mvn.environment.name=${env.BUILD_ENV:dev}
default.context.name=default
# Pulled through Google's Docker Hub mirror rather than registry-1.docker.io. The docker-maven-plugin
# pulls this image on every test run, and a direct Docker Hub pull failed the PR suite with
# "Client.Timeout exceeded while awaiting headers" against auth.docker.io. The mirror serves the same
# image: the manifest digest is identical to Docker Hub's for this tag.
docker.image.search=mirror.gcr.io/opensearchproject/opensearch:1.3.6
docker.image.search.upgrade=mirror.gcr.io/opensearchproject/opensearch:3.8.0
docker.image.postgres=mirror.gcr.io/pgvector/pgvector:pg18
postman.collections=Maintenance_Resource
docker.image.wiremock=wiremock/wiremock:3.5.3
wiremock.api.key=some-api-key-1a2bc3
