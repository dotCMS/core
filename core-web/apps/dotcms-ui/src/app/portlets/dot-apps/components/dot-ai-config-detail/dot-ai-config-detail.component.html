<div class="min-h-0 flex-1 overflow-y-auto p-6 [scrollbar-gutter:stable]">
    <div class="mx-auto flex max-w-4xl flex-col gap-4">
        <div class="mb-2">
            <h2 class="m-0 text-2xl font-semibold text-gray-900">
                {{ 'apps.ai.config.title' | dm }}
            </h2>
            <p class="mt-1 mb-0 max-w-[60%] text-gray-600">
                {{ 'apps.ai.config.first.subtitle' | dm }}
            </p>
            <p class="mt-1 mb-0 max-w-[60%] text-gray-600">
                {{ 'apps.ai.config.second.subtitle' | dm }}
            </p>
        </div>

        @if (loading()) {
            <div class="flex items-center justify-center py-12">
                <dot-spinner />
            </div>
        } @else if (loadFailed()) {
            <p-message severity="error" [text]="'apps.ai.error.load' | dm" />
        } @else {
            @for (meta of capabilityMeta; track meta.capability) {
                <dot-ai-capability-card
                    [meta]="meta"
                    [providers]="providers()"
                    [initialValue]="initialSections()[meta.sectionKey] ?? null"
                    [siteId]="siteId"
                    (changed)="onAnyChanged()" />
            }

            <dot-ai-settings-card [initialValue]="initialSettings()" (changed)="onAnyChanged()" />
        }
    </div>
</div>

<div class="flex shrink-0 items-center justify-end gap-4 border-t border-surface px-6 py-3">
    @if (dirty()) {
        <small class="mr-auto text-gray-600">{{ 'apps.ai.unsaved.changes' | dm }}</small>
        <p-button
            [label]="'apps.ai.button.cancel' | dm"
            [text]="true"
            severity="secondary"
            (onClick)="cancel()" />
    }
    <p-button
        [label]="'apps.ai.button.save' | dm"
        [loading]="saving()"
        [disabled]="loadFailed()"
        (onClick)="save()" />
</div>
