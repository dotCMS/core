<div class="min-h-0 flex-1 overflow-y-auto bg-white p-6 [scrollbar-gutter:stable]">
    <div class="mx-auto flex max-w-3xl flex-col gap-4">
        <div class="mb-2">
            <h2 class="m-0 text-xl font-semibold text-gray-900">
                {{ 'apps.ai.config.title' | dm }}
            </h2>
            <p class="mt-1 mb-0 text-sm text-gray-500">
                {{ 'apps.ai.config.subtitle' | dm }}
            </p>
        </div>

        @if (loading()) {
            <div class="flex items-center justify-center py-12 text-sm text-gray-400">
                {{ 'apps.ai.loading' | dm }}
            </div>
        } @else {
            @for (meta of capabilityMeta; track meta.capability) {
                <dot-ai-capability-card
                    [meta]="meta"
                    [providers]="providers()"
                    [initialValue]="initialSections()[meta.sectionKey] ?? null"
                    [siteId]="siteId"
                    (changed)="onAnyChanged()" />
            }

            <dot-ai-settings-card [initialValue]="initialSettings()" (changed)="onAnyChanged()" />
        }
    </div>
</div>

<div
    class="flex shrink-0 items-center justify-end gap-4 border-t border-gray-200 bg-white px-6 py-3">
    @if (dirty()) {
        <span class="mr-auto text-sm text-gray-500">{{ 'apps.ai.unsaved.changes' | dm }}</span>
        <p-button
            [label]="'apps.ai.button.cancel' | dm"
            [text]="true"
            severity="secondary"
            (onClick)="cancel()" />
    }
    <p-button [label]="'apps.ai.button.save' | dm" [loading]="saving()" (onClick)="save()" />
</div>
