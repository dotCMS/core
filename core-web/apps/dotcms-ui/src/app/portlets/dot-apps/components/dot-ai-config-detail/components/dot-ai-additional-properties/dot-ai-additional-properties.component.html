<div class="flex flex-col gap-2">
    <div class="flex items-center gap-1">
        <span class="text-sm font-medium text-gray-700">
            {{ 'apps.ai.additional-properties.label' | dm }}
        </span>
        <i
            class="pi pi-info-circle text-xs text-gray-400"
            [pTooltip]="'apps.ai.additional-properties.tooltip' | dm"
            tooltipPosition="top"></i>
    </div>

    @if (properties().length > 0) {
        <div class="flex flex-col gap-2">
            @for (property of properties().controls; track $index; let i = $index) {
                <div class="flex items-center gap-2" [formGroup]="property">
                    <input
                        pInputText
                        formControlName="key"
                        class="w-1/3 text-sm"
                        [placeholder]="'apps.ai.additional-properties.key.placeholder' | dm" />
                    <input
                        pInputText
                        formControlName="value"
                        class="flex-1 text-sm"
                        [placeholder]="'apps.ai.additional-properties.value.placeholder' | dm" />
                    <p-button
                        icon="pi pi-trash"
                        [text]="true"
                        severity="secondary"
                        size="small"
                        [attr.aria-label]="'apps.ai.additional-properties.remove.aria-label' | dm"
                        (onClick)="removeProperty(i)" />
                </div>
            }
        </div>
    }

    <p-button
        class="self-end"
        [text]="true"
        size="small"
        [label]="'apps.ai.additional-properties.add.button' | dm"
        (onClick)="addProperty()" />
</div>
