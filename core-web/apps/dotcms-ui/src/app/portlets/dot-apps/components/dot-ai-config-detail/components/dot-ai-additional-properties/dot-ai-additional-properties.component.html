<div class="flex flex-col gap-2">
    <span class="text-xs font-medium text-gray-600">{{ 'Additional properties' | dm }}</span>

    @if (properties().length > 0) {
        <div class="flex flex-col gap-2">
            @for (property of properties().controls; track $index; let i = $index) {
                <div class="flex items-center gap-2" [formGroup]="property">
                    <input
                        pInputText
                        formControlName="key"
                        class="w-1/3"
                        [placeholder]="'Property name' | dm" />
                    <input
                        pInputText
                        formControlName="value"
                        class="flex-1"
                        [placeholder]="'Value' | dm" />
                    <p-button
                        icon="pi pi-trash"
                        [text]="true"
                        severity="secondary"
                        size="small"
                        [attr.aria-label]="'Remove property' | dm"
                        (onClick)="removeProperty(i)" />
                </div>
            }
        </div>
    }

    <p-button
        [text]="true"
        size="small"
        icon="pi pi-plus"
        [label]="'Add Property' | dm"
        styleClass="self-start"
        (onClick)="addProperty()" />
</div>
