<div class="flex flex-col gap-2">
    <span class="text-sm font-semibold text-gray-950">
        {{ 'apps.ai.additional-properties.label' | dm }}
    </span>

    @if (properties().length > 0) {
        <div class="flex flex-col gap-2">
            @for (property of properties().controls; track $index; let i = $index) {
                <div class="flex items-center gap-2" [formGroup]="property">
                    <input
                        pInputText
                        formControlName="key"
                        class="w-2/5 font-mono text-sm"
                        [placeholder]="'apps.ai.additional-properties.key.placeholder' | dm" />
                    <input
                        pInputText
                        formControlName="value"
                        class="flex-1 font-mono text-sm"
                        [placeholder]="'apps.ai.additional-properties.value.placeholder' | dm" />
                    <p-button
                        [text]="true"
                        severity="secondary"
                        size="small"
                        [attr.aria-label]="'apps.ai.additional-properties.remove.aria-label' | dm"
                        (onClick)="removeProperty(i)">
                        <span class="material-symbols-outlined text-base">close</span>
                    </p-button>
                </div>
            }
        </div>
    }

    <p-button
        [text]="true"
        size="small"
        [label]="'apps.ai.additional-properties.add.button' | dm"
        styleClass="self-start"
        (onClick)="addProperty()">
        <span class="material-symbols-outlined text-base">add</span>
    </p-button>
</div>
