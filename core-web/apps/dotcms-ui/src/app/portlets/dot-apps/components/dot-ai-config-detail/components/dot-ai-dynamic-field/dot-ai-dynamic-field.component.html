<div class="field" [formGroup]="formGroup()">
    <label [for]="field().name" class="text-xs font-medium text-gray-600">
        {{ label() }}
        @if (field().required) {
            <span class="text-red-500">*</span>
        }
    </label>

    @switch (field().type) {
        @case (DotAiProviderFieldType.NUMBER) {
            <p-inputnumber
                [inputId]="field().name"
                [formControlName]="field().name"
                [useGrouping]="false"
                [invalid]="isInvalid()"
                styleClass="w-full"
                inputStyleClass="w-full text-sm" />
        }
        @case (DotAiProviderFieldType.SECRET) {
            @if (isMaskedSecret()) {
                <input
                    pInputText
                    type="text"
                    [id]="field().name"
                    [formControlName]="field().name"
                    [invalid]="isInvalid()"
                    class="w-full text-sm" />
            } @else {
                <p-password
                    [inputId]="field().name"
                    [formControlName]="field().name"
                    [feedback]="false"
                    [toggleMask]="true"
                    [invalid]="isInvalid()"
                    styleClass="w-full"
                    inputStyleClass="w-full text-sm" />
            }
        }
        @default {
            <input
                pInputText
                [id]="field().name"
                [formControlName]="field().name"
                [invalid]="isInvalid()"
                class="w-full text-sm" />
        }
    }

    @if (field().hint) {
        <small class="text-gray-500">{{ field().hint }}</small>
    }
</div>
