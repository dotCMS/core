<div class="field" [formGroup]="formGroup()">
    <label [for]="field().name" [class.p-label-input-required]="field().required">
        {{ label() }}
    </label>

    @switch (field().type) {
        @case (DotAiProviderFieldType.NUMBER) {
            <p-inputnumber
                [inputId]="field().name"
                [formControlName]="field().name"
                [useGrouping]="false"
                [invalid]="isInvalid()"
                styleClass="w-full"
                inputStyleClass="w-full text-sm" />
        }
        @case (DotAiProviderFieldType.SECRET) {
            @if (isMaskedSecret()) {
                <input
                    pInputText
                    type="text"
                    [id]="field().name"
                    [formControlName]="field().name"
                    [invalid]="isInvalid()"
                    class="w-full text-sm" />
            } @else {
                <p-password
                    [inputId]="field().name"
                    [formControlName]="field().name"
                    [feedback]="false"
                    [toggleMask]="true"
                    [invalid]="isInvalid()"
                    styleClass="w-full"
                    inputStyleClass="w-full text-sm" />
            }
        }
        @default {
            <input
                pInputText
                [id]="field().name"
                [formControlName]="field().name"
                [invalid]="isInvalid()"
                class="w-full text-sm" />
        }
    }

    @if (field().hint) {
        <span class="p-field-hint">{{ field().hint }}</span>
    }
</div>
