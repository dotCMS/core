@if (fieldRow) {
    <div class="row-header flex justify-center rounded-t-xl bg-white">
        <i
            class="material-symbols-outlined row-header__drag block cursor-move text-gray-400"
            aria-hidden="true">
            drag_handle
        </i>
    </div>
    <div class="row-columns flex rounded-b-xl bg-white p-2">
        @for (column of fieldRow.columns; track column; let i = $index) {
            <div
                [(dragulaModel)]="column.fields"
                [class.empty]="!column.fields.length"
                [class]="{
                    'bg-gray-200': !column.fields.length,
                    'min-h-36': !column.fields.length
                }"
                class="row-columns__item group relative mx-2 flex w-0 flex-1 flex-col first:ml-0 last:mr-0"
                [attr.data-testid]="'fields-bag-' + i"
                data-drag-type="target"
                dragula="fields-bag">
                @if (!column.fields.length) {
                    <p-button
                        (click)="remove(i)"
                        [pTooltip]="'contenttypes.action.delete' | dm"
                        class="absolute top-2 right-2"
                        icon="pi pi-trash"
                        styleClass="p-button-rounded p-button-text p-button-sm p-button-danger" />
                }
                @for (field of column.fields; track field) {
                    <dot-content-type-field-dragabble-item
                        (remove)="onRemoveField($event)"
                        (edit)="this.editField.emit($event)"
                        [field]="field"
                        [isSmall]="fieldRow.columns.length > 1" />
                }
                <div
                    class="pointer-events-none flex min-h-18 flex-1 flex-col justify-center rounded-md border border-dashed border-gray-600 bg-white text-center text-xs text-gray-600 group-[.row-columns__item--over]:hidden">
                    {{ emptyMessage }}
                </div>
            </div>
        }
    </div>
}
