@let data = $data();

<p-dialog
    #dialog
    (visibleChange)="close()"
    [visible]="!!data"
    [header]="data?.title"
    [draggable]="false"
    [resizable]="false"
    [maximizable]="false"
    [modal]="true"
    [baseZIndex]="100"
    appendTo="body"
    data-testid="dot-wizard">
    @if (data?.steps?.length) {
        <div class="dot-wizard__view">
            <div
                [style.transform]="transform"
                class="dot-wizard__container"
                (keydown.tab)="handleTab($event)">
                @for (step of data.steps; track $index) {
                    <div
                        class="dot-wizard__step"
                        [class.dot-wizard__step--visible]="$stepsVisible()">
                        <ng-template dotContainerReference />
                    </div>
                }
            </div>

            @if ($dialogActions(); as actions) {
                @if ($stepsVisible()) {
                    <footer class="dot-wizard__footer mt-5">
                        @if (actions.cancel; as cancel) {
                            <button
                                (click)="cancel.action?.()"
                                [disabled]="cancel.disabled"
                                [label]="cancel.label"
                                class="dialog__button-cancel p-button-outlined"
                                data-testid="dialog-close-button"
                                pButton></button>
                        }
                        @if (actions.accept; as accept) {
                            <button
                                (click)="accept.action?.()"
                                [disabled]="accept.disabled"
                                [label]="accept.label"
                                class="dialog__button-accept"
                                data-testid="dialog-accept-button"
                                pButton></button>
                        }
                    </footer>
                }
            }
        </div>
    }
</p-dialog>
