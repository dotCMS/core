<div class="dot-device-selector wrapper flex h-full min-w-full flex-auto items-center gap-4">
    <dot-icon big name="devices"></dot-icon>

    <div class="device-selector__field grow">
        <p-select
            (onChange)="change($event.value)"
            [(ngModel)]="value"
            [disabled]="disabled"
            [options]="options"
            [placeholder]="placeholder"
            class="p-dropdown-sm"
            id="device-selector"
            dataKey="inode"
            optionLabel="name"></p-select>
    </div>
</div>
