<div
    [class.selected]="selectedItems().length"
    class="flex flex-row-reverse items-center px-5 py-3 text-base">
    @if (options()?.primary; as primary) {
        <dot-action-button
            (press)="handlePrimaryAction()"
            [model]="primary.model ?? []"
            class="transition-all duration-200"
            [class]="
                selectedItems().length ? '-translate-y-5 opacity-0' : 'translate-y-0 opacity-100'
            " />
    }
    <div [style.overflow]="dynamicOverflow()" class="flex-1 overflow-hidden">
        <div
            class="flex items-center p-1 transition-transform duration-200 ease-in-out"
            [class]="
                selectedItems().length ? 'invisible -translate-y-15' : 'visible translate-y-0'
            ">
            <ng-content />
        </div>
        @if (options()?.secondary || selectedItems().length) {
            <div
                class="flex items-center bg-primary text-white transition-all duration-200 ease-in-out"
                [class]="
                    selectedItems().length ? 'visible -translate-y-15' : 'invisible translate-y-0'
                ">
                <span class="mr-3 border-r border-white px-3 py-1">
                    {{ selectedItems().length }} {{ 'selected' | dm }}
                </span>
                @if (options()?.secondary; as secondary) {
                    @for (action of secondary; track action) {
                        <p-splitButton
                            [model]="action.model"
                            [outlined]="true"
                            secondary
                            label="{{ action.label }}"
                            class="inverted" />
                    }
                }
            </div>
        }
    </div>
</div>
