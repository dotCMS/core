@let field = $field();
@let showLabel = $showLabel();
@let fieldHasError = $hasError();

<dot-card-field [hasError]="fieldHasError" [isRequired]="isRequired">
    @if (showLabel) {
        <label dotCardFieldLabel [variableName]="field.variable" [isRequired]="isRequired">
            {{ field.name }}
        </label>
    }
    <dot-card-field-content>
        <div
            class="dot-json-field__container flex size-full flex-col gap-2"
            data-testid="json-field-container">
            <div
                class="dot-json-field__controls flex justify-end"
                data-testid="json-field-controls">
                <dot-language-variable-selector
                    data-testid="json-field-language-selector"
                    (onSelectLanguageVariable)="onSelectLanguageVariable($event)" />
            </div>

            <div
                class="block size-full min-h-[150px] rounded-md px-[3px]"
                data-testid="json-field-editor">
                <dot-edit-content-monaco-editor-control
                    #monaco
                    data-testid="json-field-monaco-editor"
                    [field]="field"
                    [hasError]="fieldHasError"
                    [forceLanguage]="languages.Json" />
            </div>
        </div>
    </dot-card-field-content>
    @if ((fieldHasError && isRequired) || field.hint) {
        <dot-card-field-footer>
            @if (fieldHasError && isRequired) {
                <small class="p-field-error">
                    {{ 'dot.edit.content.form.field.required' | dm }}
                </small>
            }

            @if (field.hint) {
                <small class="p-field-hint" [attr.data-testId]="'hint-' + field.variable">
                    {{ field.hint }}
                </small>
            }
        </dot-card-field-footer>
    }
</dot-card-field>
