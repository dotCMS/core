<div class="flex min-w-0 items-center gap-3">
    <span
        class="truncate text-xl font-semibold"
        data-testid="dialog-header-title"
        [attr.id]="$titleId()">
        {{ title }}
    </span>

    @let status = $titleStatus();
    @if (status) {
        <div class="shrink-0" data-testid="title-status-chip">
            <dot-contentlet-status-badge [state]="status.state" />
        </div>
    }
</div>
