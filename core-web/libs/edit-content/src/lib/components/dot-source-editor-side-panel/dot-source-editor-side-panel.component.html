@switch ($status()) {
    @case (ComponentStatus.LOADING) {
        <div
            class="flex size-full flex-1 items-center justify-center"
            data-testid="source-editor-loading">
            <i class="pi pi-spin pi-spinner text-4xl text-gray-500"></i>
        </div>
    }
    @case (ComponentStatus.ERROR) {
        <div
            class="flex size-full flex-1 items-center justify-center text-gray-500"
            data-testid="source-editor-error">
            {{ 'edit.content.source-editor.load-error' | dm }}
        </div>
    }
    @default {
        <!-- Mounted only once the source is in, so the editor starts on the file rather than on
             an empty model that is then replaced. The border is this panel's alone, on the host,
             so other Monaco editors are untouched; `overflow-hidden` clips the editor's
             background to the rounded corners and hides nothing, since ngx-monaco-editor already
             clips its own container. -->
        <ngx-monaco-editor
            class="min-h-0 flex-1 overflow-hidden rounded-md border border-surface"
            [ngModel]="$source()"
            (ngModelChange)="$source.set($event)"
            [options]="$editorOptions()"
            (init)="onEditorInit($event)"
            data-testid="source-editor-monaco" />
    }
}

@if ($saveError() !== null) {
    <!-- A failed save the shared HTTP handler cannot explain, such as a file the server refused to
         stage. The edits are still in the editor above. -->
    <p-message severity="error" data-testid="source-editor-save-error">
        {{ 'edit.content.source-editor.save-error' | dm }} {{ $saveError() }}
    </p-message>
}

<div class="flex items-center justify-end gap-2" data-testid="source-editor-actions">
    <p-button
        [label]="'dot.common.cancel' | dm"
        severity="secondary"
        [outlined]="true"
        [disabled]="$status() === ComponentStatus.SAVING"
        (onClick)="requestClose()"
        data-testid="source-editor-cancel" />
    <p-button
        [label]="'dot.common.save' | dm"
        [disabled]="!$canSave()"
        [loading]="$status() === ComponentStatus.SAVING"
        (onClick)="save()"
        data-testid="source-editor-save" />
</div>

<!-- The unsaved-changes prompt, on this panel's own ConfirmationService (see requestClose). On the
     body, so the drawer it sits in never positions or clips it. -->
<p-confirmDialog appendTo="body" />
