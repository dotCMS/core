<div class="flex flex-col gap-4">
    <p class="m-0" data-testid="configuration-regenerate-key-impact">
        {{ 'configuration.regenerate-key.impact' | dm }}
    </p>
    <p class="m-0" data-testid="configuration-regenerate-key-warning">
        {{ 'configuration.regenerate-key.warning' | dm }}
    </p>

    <div class="flex items-center gap-2 rounded-md border border-surface bg-surface-50 p-3">
        <p-checkbox
            inputId="configuration-regenerate-key-ack"
            [binary]="true"
            [ngModel]="$acknowledged()"
            (ngModelChange)="onAcknowledgedChange($event)"
            data-testid="configuration-regenerate-key-ack" />
        <label for="configuration-regenerate-key-ack">
            {{ 'configuration.regenerate-key.acknowledge' | dm }}
        </label>
    </div>

    <div class="flex justify-end gap-2">
        <p-button
            [outlined]="true"
            severity="secondary"
            [label]="'configuration.action-bar.cancel' | dm"
            (onClick)="cancel()"
            data-testid="configuration-regenerate-key-cancel-btn" />
        <p-button
            severity="danger"
            [label]="'configuration.regenerate-key.confirm' | dm"
            [disabled]="!$acknowledged()"
            (onClick)="confirm()"
            data-testid="configuration-regenerate-key-confirm-btn" />
    </div>
</div>
