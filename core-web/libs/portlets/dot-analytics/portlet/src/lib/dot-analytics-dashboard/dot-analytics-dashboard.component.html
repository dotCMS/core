<div class="flex flex-col portlet-wrapper" data-testid="analytics-dashboard">
    @if ($showMessage()) {
        <p-message
            severity="info"
            [closable]="true"
            (onClose)="onCloseMessage()"
            data-testid="analytics-message">
            <div class="flex items-center gap-2">
                <i class="pi pi-info-circle"></i>
                <span data-testid="message-content">
                    {{ 'analytics.feature.state' | dm }}
                    <b>{{ 'development' | dm }}</b>
                </span>
            </div>
        </p-message>
    }

    <p-tabs [lazy]="true">
        <div class="analytics-dashboard-toolbar bg-gray-100 border-b border-gray-300 px-4">
            <div class="flex justify-between items-center gap-4 min-h-12">
                <div class="flex items-center gap-4 min-w-0">
                    <p-tablist
                        class="shrink-0 min-w-0 border-0 bg-transparent shadow-none"
                        [pt]="tabListPt">
                        @for (tab of tabs; track tab.id) {
                            <p-tab
                                [routerLink]="tab.route"
                                queryParamsHandling="preserve"
                                [routerLinkActive]="['p-tab-active']">
                                {{ tab.label | dm }}
                            </p-tab>
                        }
                    </p-tablist>
                    <p-divider layout="vertical" />
                    <dot-analytics-filters
                        [timeRange]="store.timeRange()"
                        (changeFilters)="onTimeRangeChange($event)"
                        data-testid="analytics-filters" />
                </div>
                <p-button
                    [label]="'analytics.dashboard.refresh.button' | dm"
                    severity="primary"
                    size="small"
                    (onClick)="onRefresh()"
                    data-testid="refresh-button" />
            </div>
        </div>
    </p-tabs>
    <div class="analytics-dashboard-body p-8">
        <!-- Full-report loading overlay: mirrors dot-edit-content-layout's reload overlay
             (same spinner + semi-transparent backdrop) so the ~2s customer-environment load
             time for each tab reads consistently with the rest of the app, instead of just
             the per-widget skeletons underneath. -->
        @if (store.$isReportLoading()) {
            <div
                class="analytics-dashboard-body__loading-overlay flex items-center justify-center"
                data-testid="analytics-dashboard-loading-overlay">
                <i class="pi pi-spin pi-spinner text-4xl text-gray-500"></i>
            </div>
        }
        <router-outlet />
    </div>
</div>
