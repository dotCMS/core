<p-toolbar class="justify-start gap-1 border-x-0! border-t-0! px-3">
    <div class="flex w-full items-center gap-2 py-3">
        <p-iconField iconPosition="left">
            <p-inputIcon>
                <span class="material-symbols-rounded text-xl! leading-none!" aria-hidden="true">
                    search
                </span>
            </p-inputIcon>
            <input
                pInputText
                type="text"
                [ngModel]="store.search()"
                (ngModelChange)="onSearch($event)"
                [placeholder]="'publishing-queue.search.placeholder' | dm"
                [attr.aria-label]="'publishing-queue.search.placeholder' | dm"
                data-testid="pq-search-input"
                class="w-80" />
        </p-iconField>

        <dot-publishing-queue-status-filter />

        <div class="ml-auto flex items-center gap-2">
            @if ($hasBulkActions()) {
                <p-button
                    [label]="'publishing-queue.delete-bundles' | dm"
                    [text]="true"
                    severity="danger"
                    (onClick)="$deleteClick.emit()"
                    [pt]="{ root: { 'data-testid': 'pq-bulk-delete' } }" />
            }
            <p-button
                [text]="true"
                (onClick)="store.refresh()"
                [pt]="{ root: { 'data-testid': 'pq-refresh-btn' } }">
                <span class="material-symbols-rounded -my-1 text-xl!" aria-hidden="true">
                    refresh
                </span>
                <span class="p-button-label">{{ 'publishing-queue.refresh' | dm }}</span>
            </p-button>
            @if ($hasBulkActions()) {
                <p-button
                    [label]="'publishing-queue.retry-send' | dm"
                    (onClick)="onBulkRetry()"
                    [pt]="{ root: { 'data-testid': 'pq-bulk-retry' } }" />
            } @else {
                <!-- Placeholder: the Publishing Environments dialog ships in #37813. -->
                <p-button
                    [label]="'publishing-queue.publishing-environments' | dm"
                    [outlined]="true"
                    [pt]="{ root: { 'data-testid': 'pq-publishing-environments-btn' } }" />
                <p-button
                    [label]="'publishing-queue.upload-bundle' | dm"
                    (onClick)="$uploadClick.emit()"
                    [pt]="{ root: { 'data-testid': 'pq-upload-bundle-btn' } }" />
            }
        </div>
    </div>
</p-toolbar>
