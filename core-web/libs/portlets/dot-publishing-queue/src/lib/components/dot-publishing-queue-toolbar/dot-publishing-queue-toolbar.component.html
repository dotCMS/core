<p-toolbar class="justify-start gap-1 border-x-0! border-t-0! px-3">
    <div class="flex w-full items-center gap-2 py-3">
        <p-iconField iconPosition="left">
            <p-inputIcon>
                <span class="material-symbols-rounded text-xl! leading-none!" aria-hidden="true">
                    search
                </span>
            </p-inputIcon>
            <input
                pInputText
                type="text"
                [ngModel]="store.search()"
                (ngModelChange)="onSearch($event)"
                [placeholder]="'publishing-queue.search.placeholder' | dm"
                [attr.aria-label]="'publishing-queue.search.placeholder' | dm"
                data-testid="pq-search-input"
                class="w-80" />
        </p-iconField>

        <dot-publishing-queue-status-filter />

        <div class="ml-auto flex items-center gap-2">
            @if ($hasBulkActions()) {
                <p-button
                    [label]="'publishing-queue.delete-bundles' | dm"
                    [text]="true"
                    severity="danger"
                    (onClick)="$deleteClick.emit()"
                    [pt]="{ root: { 'data-testid': 'pq-bulk-delete' } }" />
            }
            <p-button
                [text]="true"
                (onClick)="store.refresh()"
                [pt]="{ root: { 'data-testid': 'pq-refresh-btn' } }">
                <span class="material-symbols-rounded -my-1 text-xl!" aria-hidden="true">
                    refresh
                </span>
                <span class="p-button-label">{{ 'publishing-queue.refresh' | dm }}</span>
            </p-button>
            @if ($hasBulkActions()) {
                <p-button
                    [label]="'publishing-queue.retry-send' | dm"
                    (onClick)="onBulkRetry()"
                    [pt]="{ root: { 'data-testid': 'pq-bulk-retry' } }" />
            } @else {
                <p-menu
                    #addBundleMenu
                    [model]="addBundleItems"
                    [popup]="true"
                    appendTo="body"
                    showTransitionOptions="0ms"
                    hideTransitionOptions="0ms"
                    data-testid="pq-add-bundle-menu">
                    <!-- Custom item template only so the "Select Bundle" row can
                         carry the same draft count as the trigger button. The
                         classes mirror PrimeNG's default item markup (global,
                         unencapsulated) so padding/hover stay identical; the
                         click that fires `command` is handled by the wrapping
                         `.p-menu-item-content` PrimeNG renders around this. -->
                    <ng-template pTemplate="item" let-item>
                        <span class="p-menu-item-link">
                            <span class="p-menu-item-label">{{ item.label }}</span>
                            @if (showsDraftCount(item)) {
                                <span
                                    class="text-color-secondary ml-auto pl-4 text-sm"
                                    data-testid="pq-select-bundle-count">
                                    {{ store.draftBundlesTotal() }}
                                </span>
                            }
                        </span>
                    </ng-template>
                </p-menu>
                <p-button
                    (onClick)="addBundleMenu.toggle($event)"
                    [attr.aria-label]="$bundlesLabel()"
                    data-testid="pq-add-bundle-btn">
                    <span class="p-button-label" data-testid="pq-add-bundle-btn-label">
                        {{ $bundlesLabel() }}
                    </span>
                    <span
                        class="material-symbols-rounded -my-1 w-5 leading-none!"
                        aria-hidden="true">
                        keyboard_arrow_down
                    </span>
                </p-button>
            }
        </div>
    </div>
</p-toolbar>
