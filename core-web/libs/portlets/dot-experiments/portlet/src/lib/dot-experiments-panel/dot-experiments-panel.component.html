<!--
    Mirrors `dot-edit-content-side-panel.component.html` on purpose — see the class docs for why
    each of these is the way it is rather than the obvious way.

    `maskStyle` forces a transparent mask so the page behind stays visible. The `!important` is
    required to override PrimeNG's default dimmed background, which neither the theme nor the `pt`
    API otherwise lets us clear; it is deliberate, not a leftover.

    The shadow goes on `pt.root.class` rather than in component SCSS because the drawer uses
    `appendTo="body"` and is teleported out of this component's DOM, where component-scoped SCSS
    and `:host ::ng-deep` cannot reach it.

    `dismissible` is left OFF even though clicking outside DOES close the panel: PrimeNG's own
    dismissible tears the drawer down immediately, which would bypass the unsaved-changes confirm
    this panel gains in phase 2. The mask click is handled by the component instead (`onMaskClick`).
    `closeOnEscape` is off for the same reason — Escape goes through the shared shortcut registry.

    The header buttons name themselves through PrimeNG's `[ariaLabel]`, never `[attr.aria-label]`:
    the latter lands on the non-focusable `<p-button>` host, leaving the real `<button>` — whose
    only content is an icon glyph — with no accessible name.
-->
<p-drawer
    [visible]="store.isOpen()"
    [modal]="true"
    [dismissible]="false"
    [closeOnEscape]="false"
    [closable]="false"
    appendTo="body"
    position="right"
    [maskStyle]="{ background: 'transparent !important' }"
    [pt]="{
        root: {
            'data-testid': 'experiments-panel',
            class: '!shadow-2xl',
            style: { width: $width(), transition: 'width 250ms ease' }
        },
        content: { class: 'p-0! flex flex-col min-h-0' }
    }">
    <ng-template #header>
        <div class="flex w-full items-center justify-between gap-4">
            <span class="truncate text-xl font-semibold" data-testid="experiments-panel-title">
                {{ $titleKey() | dm }}
            </span>
            <div class="flex items-center gap-1">
                <p-button
                    [text]="true"
                    severity="secondary"
                    [ariaLabel]="
                        ($expanded()
                            ? 'experiments.panel.action.collapse'
                            : 'experiments.panel.action.expand'
                        ) | dm
                    "
                    (onClick)="toggleExpanded()"
                    data-testid="experiments-panel-expand">
                    <ng-template #icon>
                        <i class="material-symbols-outlined text-xl!">
                            {{ $expanded() ? 'close_fullscreen' : 'open_in_full' }}
                        </i>
                    </ng-template>
                </p-button>
                <p-button
                    [text]="true"
                    severity="secondary"
                    [ariaLabel]="'experiments.panel.action.close' | dm"
                    (onClick)="requestClose()"
                    data-testid="experiments-panel-close">
                    <ng-template #icon>
                        <i class="material-symbols-outlined text-xl!">close</i>
                    </ng-template>
                </p-button>
            </div>
        </div>
    </ng-template>

    @switch (store.view()) {
        @case ('list') {
            <!-- The list screen lands at T035; until then the panel proves its own lifecycle. -->
            <div
                class="flex min-h-0 flex-1 items-center justify-center p-6 text-sm text-surface-500"
                data-testid="experiments-panel-list">
                {{ 'experiments.panel.empty.description' | dm }}
            </div>
        }
        @default {
            <div class="flex min-h-0 flex-1 items-center justify-center p-6"></div>
        }
    }
</p-drawer>
