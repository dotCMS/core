<!--
    Not modal, and no mask. Unlike the Edit Content drawer this panel must leave the editor
    usable: the editor may navigate to another page while it is open, and the panel re-scopes to
    that page rather than blocking the move (D10, FR-034).

    `dismissible` and `closeOnEscape` are on — closing is always safe on the list. Once the panel
    carries a configuration with unsaved work, both have to route through the same confirm the
    full-screen screen uses (FR-019, T062), so they will stop being plain booleans then.
-->
<p-drawer
    [visible]="store.isOpen()"
    (visibleChange)="!$event && onClose()"
    [modal]="false"
    [showCloseIcon]="false"
    [dismissible]="true"
    [closeOnEscape]="true"
    appendTo="body"
    position="right"
    [pt]="{
        root: {
            'data-testid': 'experiments-panel',
            class: '!shadow-2xl',
            style: { width: PANEL_WIDTH }
        },
        content: { class: 'p-0! flex flex-col min-h-0' }
    }">
    <ng-template #header>
        <div class="flex w-full items-center justify-between gap-4">
            <span class="truncate text-xl font-semibold" data-testid="experiments-panel-title">
                {{ $titleKey() | dm }}
            </span>
            <p-button
                [text]="true"
                severity="secondary"
                [ariaLabel]="'experiments.panel.action.close' | dm"
                (onClick)="onClose()"
                data-testid="experiments-panel-close">
                <ng-template #icon>
                    <i class="material-symbols-outlined text-xl!">close</i>
                </ng-template>
            </p-button>
        </div>
    </ng-template>

    @switch (store.view()) {
        @case ('list') {
            <!-- The list screen lands at T035; until then the panel proves its own lifecycle. -->
            <div
                class="flex min-h-0 flex-1 items-center justify-center p-6 text-sm text-surface-500"
                data-testid="experiments-panel-list">
                {{ 'experiments.panel.empty.description' | dm }}
            </div>
        }
        @default {
            <div class="flex min-h-0 flex-1 items-center justify-center p-6"></div>
        }
    }
</p-drawer>
