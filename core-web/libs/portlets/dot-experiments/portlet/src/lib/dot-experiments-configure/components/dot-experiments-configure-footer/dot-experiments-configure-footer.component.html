@if ($hint(); as hint) {
    <span
        class="truncate text-sm font-medium"
        [class.text-surface-500]="!hint.isError"
        [class.text-red-600]="hint.isError"
        [attr.role]="hint.isError ? 'alert' : null"
        data-testid="experiments-configure-footer-hint">
        {{ hint.key | dm: hint.args }}
    </span>
}

<div class="flex flex-none items-center gap-2">
    @if ($showSave()) {
        <p-button
            [outlined]="true"
            severity="secondary"
            [label]="'experiments.configure.action.save-draft' | dm"
            [disabled]="$isSaveDisabled()"
            (onClick)="onSaveDraft()"
            data-testid="experiments-configure-save-btn" />
    }

    @if ($showStart()) {
        <!-- Disabled only when in limited mode and the free slot is occupied — otherwise
             never disabled (AC28): pressing it on an incomplete form reveals the missing fields. -->
        <p-button
            [label]="$startLabelKey() | dm"
            [disabled]="$startDisabled()"
            [pTooltip]="$startDisabled() ? ('experiments.list.limited-mode.banner.slot-used' | dm) : ''"
            tooltipPosition="top"
            (onClick)="onStart()"
            data-testid="experiments-configure-start-btn" />
    }
</div>
