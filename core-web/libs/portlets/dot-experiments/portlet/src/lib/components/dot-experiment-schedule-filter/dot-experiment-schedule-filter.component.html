<dot-chip-filter
    [title]="'experiments.list.filter.schedule' | dm"
    [selections]="$selectedLabels()"
    [emptyLabel]="'experiments.list.filter.schedule.any' | dm"
    (clicked)="popover.toggle($event)"
    (removed)="onRemove()"
    data-testid="experiment-schedule-filter-chip" />

<p-popover #popover>
    <p-datePicker
        selectionMode="range"
        [ngModel]="$range()"
        (ngModelChange)="onRangeChange($event)"
        [ngModelOptions]="{ standalone: true }"
        [showButtonBar]="true"
        [readonlyInput]="true"
        [inline]="true"
        dateFormat="yy-mm-dd"
        [pt]="datePickerPt"
        [attr.aria-label]="'experiments.list.filter.schedule' | dm"
        data-testid="experiment-schedule-filter-calendar" />
</p-popover>
