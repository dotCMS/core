<dot-chip-filter
    [title]="'experiments.list.filter.status' | dm"
    [selections]="$selectedLabels()"
    (clicked)="popover.toggle($event)"
    (removed)="onClear()"
    data-testid="experiment-status-filter-chip" />

<p-popover #popover [pt]="popoverPt" (onHide)="onPopoverHide()">
    <p-listbox
        [(ngModel)]="$pendingStatuses"
        [ngModelOptions]="{ standalone: true }"
        [options]="$options()"
        [multiple]="true"
        [checkbox]="true"
        [scrollHeight]="LISTBOX_SCROLL_HEIGHT"
        [pt]="listboxPt"
        [ariaLabel]="'experiments.list.filter.status' | dm"
        optionLabel="label"
        optionValue="value">
        <ng-template let-option pTemplate="item">
            <dot-filter-list-item
                [label]="option.label"
                [secondary]="option.count"
                [attr.data-testid]="option.testId" />
        </ng-template>
    </p-listbox>

    <div class="flex items-center justify-end gap-2 border-t border-slate-200 px-3 py-2">
        <p-button
            [label]="'Clear' | dm"
            [text]="true"
            severity="secondary"
            size="small"
            (onClick)="onClear()"
            data-testid="experiment-status-filter-clear" />
        <p-button
            [label]="'Done' | dm"
            size="small"
            (onClick)="onDone(popover)"
            data-testid="experiment-status-filter-done" />
    </div>
</p-popover>
