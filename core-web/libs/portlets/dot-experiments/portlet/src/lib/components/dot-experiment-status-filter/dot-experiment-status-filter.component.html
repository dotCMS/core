<dot-chip-filter
    [title]="'experiments.list.filter.status' | dm"
    [selections]="$selectedLabels()"
    (clicked)="popover.toggle($event)"
    (removed)="onRemoveAll()"
    data-testid="experiment-status-filter-chip" />

<p-popover #popover [pt]="popoverPt">
    <p-listbox
        [(ngModel)]="$selectedStatusValues"
        [ngModelOptions]="{ standalone: true }"
        [options]="$options()"
        [multiple]="true"
        [checkbox]="true"
        [scrollHeight]="LISTBOX_SCROLL_HEIGHT"
        [pt]="listboxPt"
        [ariaLabel]="'experiments.list.filter.status' | dm"
        optionLabel="label"
        optionValue="value"
        (onChange)="onChange()">
        <ng-template let-option pTemplate="item">
            <dot-filter-list-item
                [label]="option.label"
                [secondary]="option.count"
                [attr.data-testid]="option.testId" />
        </ng-template>
    </p-listbox>
</p-popover>
