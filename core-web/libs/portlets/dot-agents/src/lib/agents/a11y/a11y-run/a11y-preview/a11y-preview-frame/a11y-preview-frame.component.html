<div class="flex h-10 flex-none items-center border-b border-surface-100 bg-surface-50 px-3.5">
    <!-- Single address bar: lock + URL, with the mode badge as a segment
         on the right inside the same pill. -->
    <div
        class="mx-auto flex h-6.5 w-full max-w-[460px] items-center gap-1.5 overflow-hidden rounded-full border border-surface-200 bg-white pl-3">
        <!-- text-[11px]!: material-symbols-outlined sets its own font-size on the
             class, which a plain utility can't override at equal specificity. -->
        <span class="material-symbols-outlined text-[11px]! text-muted-color" aria-hidden="true">
            lock
        </span>
        <span class="min-w-0 flex-1 truncate text-xs text-muted-color">{{ address() }}</span>
        <span
            class="inline-flex flex-none items-center gap-1 self-stretch border-l border-surface-200 bg-surface-200 px-2.5 text-[11px] font-semibold text-muted-color"
            [attr.data-testid]="$labelTestId()">
            <span class="material-symbols-outlined text-[11px]!" aria-hidden="true">
                {{ icon() }}
            </span>
            {{ labelKey() | dm }}
        </span>
    </div>
</div>

<div class="min-h-0 flex-1 bg-white">
    @if (url()) {
        <iframe
            #frame
            [src]="url() | safeUrl"
            (load)="loaded.emit()"
            class="size-full border-0"
            [title]="labelKey() | dm"
            [attr.data-testid]="$iframeTestId()"></iframe>
    }
</div>
