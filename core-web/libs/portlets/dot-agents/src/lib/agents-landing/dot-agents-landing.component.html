<div class="max-w-5xl mx-auto w-full px-6 py-10">
    <header class="mb-8">
        <h1 class="text-2xl font-bold text-color m-0">{{ 'agents.landing.title' | dm }}</h1>
        <p class="text-color-secondary mt-2 m-0">{{ 'agents.landing.subtitle' | dm }}</p>
    </header>

    <ul
        class="list-none p-0 m-0 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
        data-testid="agents-grid">
        @for (agent of agents; track agent.id) {
            @let available = agent.status === 'available';

            <li class="contents">
                @if (available) {
                    <a
                        class="no-underline"
                        [routerLink]="[agent.id]"
                        [attr.data-testid]="'agent-card-' + agent.id"
                        [attr.aria-label]="agent.labelKey | dm">
                        <ng-container
                            [ngTemplateOutlet]="card"
                            [ngTemplateOutletContext]="{ $implicit: agent, available: true }" />
                    </a>
                } @else {
                    <div
                        [attr.data-testid]="'agent-card-' + agent.id"
                        [attr.aria-disabled]="true">
                        <ng-container
                            [ngTemplateOutlet]="card"
                            [ngTemplateOutletContext]="{ $implicit: agent, available: false }" />
                    </div>
                }
            </li>
        }
    </ul>
</div>

<ng-template #card let-agent let-available="available">
    <p-card
        styleClass="h-full transition-all duration-150"
        [class.cursor-pointer]="available"
        [class.hover:shadow-4]="available"
        [class.opacity-60]="!available">
        <div class="flex items-start gap-4">
            <span
                class="flex items-center justify-center size-12 rounded-lg bg-primary-50 text-primary shrink-0">
                <i class="text-2xl" [class]="agent.icon"></i>
            </span>
            <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                    <h2 class="text-base font-semibold text-color m-0">
                        {{ agent.labelKey | dm }}
                    </h2>
                    @if (!available) {
                        <p-tag
                            severity="secondary"
                            [value]="'agents.status.coming-soon' | dm" />
                    }
                </div>
                <p class="text-sm text-color-secondary mt-1 m-0">
                    {{ agent.descriptionKey | dm }}
                </p>
            </div>
        </div>
    </p-card>
</ng-template>
