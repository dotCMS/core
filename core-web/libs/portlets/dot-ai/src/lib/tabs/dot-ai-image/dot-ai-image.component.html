<section class="flex h-full min-w-0 flex-col overflow-hidden">
    <div class="shrink-0 border-b border-surface-200 p-4">
        <div class="flex items-end gap-2">
            <input
                pInputText
                class="flex-1"
                [value]="$prompt()"
                (input)="$prompt.set($any($event.target).value)"
                (keydown.enter)="onGenerate()"
                [disabled]="!store.isConfigured()"
                [attr.aria-label]="'dotai.image.input.aria' | dm"
                [placeholder]="'dotai.image.placeholder' | dm"
                data-testid="dotai-image-input" />

            <p-select
                size="small"
                [options]="orientations"
                optionLabel="label"
                optionValue="value"
                [ngModel]="store.imageOrientation()"
                (ngModelChange)="store.setOrientation($event)"
                [ngModelOptions]="{ standalone: true }"
                data-testid="dotai-image-orientation" />

            <p-button
                [label]="'dotai.image.generate' | dm"
                [disabled]="!store.isConfigured() || !$prompt().trim() || store.imageGenerating()"
                (onClick)="onGenerate()"
                data-testid="dotai-image-generate" />
        </div>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto p-4">
        @if (store.imageGenerating()) {
            <p-skeleton
                class="block aspect-video w-full max-w-2xl"
                data-testid="dotai-image-loading" />
        } @else if (store.image(); as image) {
            <div class="max-w-2xl" data-testid="dotai-image-result">
                <div class="aspect-video overflow-hidden rounded-md border border-surface-200">
                    <p-image
                        [src]="store.imageUrl()"
                        [preview]="true"
                        alt="{{ image.originalPrompt }}" />
                </div>

                <div class="mt-3 flex items-center gap-2">
                    <p-button
                        [label]="'dotai.image.save' | dm"
                        [disabled]="image.published || store.imageSaving()"
                        (onClick)="store.saveImage()"
                        data-testid="dotai-image-save" />

                    <!-- Same-origin anchor: no backend, and it works before any save. -->
                    <a
                        class="p-button p-button-outlined"
                        [href]="store.imageUrl()"
                        [download]="image.tempFileName"
                        data-testid="dotai-image-download">
                        {{ 'dotai.image.download' | dm }}
                    </a>

                    @if (image.published) {
                        <span class="text-sm text-muted-color" data-testid="dotai-image-published">
                            {{ 'dotai.image.published' | dm }}
                        </span>
                    }
                </div>

                <div class="mt-3 flex items-start gap-2">
                    <p class="flex-1 text-sm text-muted-color" data-testid="dotai-image-revised">
                        {{ image.revisedPrompt }}
                    </p>
                    <dot-copy-button [copy]="image.revisedPrompt" />
                </div>
            </div>
        } @else {
            <div class="p-8 text-center" data-testid="dotai-image-empty">
                <h2 class="text-2xl font-medium">{{ 'dotai.image.empty.title' | dm }}</h2>
                <p class="mt-1 text-muted-color">{{ 'dotai.image.empty.sub' | dm }}</p>
            </div>
        }
    </div>
</section>
