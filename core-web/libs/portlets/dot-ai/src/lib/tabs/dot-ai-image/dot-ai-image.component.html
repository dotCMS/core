<section class="flex h-full min-w-0 flex-col overflow-hidden">
    <!-- flex-col so the placeholder can take the remaining height rather than sitting as a
         short band above the composer. The inner container mirrors the composer's width, so the
         panel and the card share the same edges. -->
    <div class="flex min-h-0 flex-1 flex-col overflow-y-auto p-4">
        <div class="container mx-auto flex min-h-0 flex-1 flex-col gap-3">
            @if (store.imageError(); as error) {
                <!-- Inline rather than a dialog: the message is usually the provider's own
                     explanation of the prompt it refused, which belongs next to the prompt.
                     `dm` translates the keys the service returns and leaves prose alone. -->
                <p-message
                    class="block shrink-0"
                    severity="error"
                    [closable]="true"
                    (onClose)="store.dismissImageError()"
                    data-testid="dotai-image-error">
                    {{ error | dm }}
                </p-message>
            }

            @if (store.imageGenerating()) {
                <!-- Takes the same room the picture will, so the panel does not jump when the
                     placeholder is swapped for the result. -->
                <p-skeleton
                    class="block min-h-0 flex-1"
                    width="100%"
                    height="100%"
                    data-testid="dotai-image-loading" />
            } @else if (store.image(); as image) {
                <!-- The frame carries the picture's own aspect ratio and both caps, and no
                     explicit width or height; its children then fill it. That combination is
                     the only one whose box equals the rendered picture whichever axis the
                     panel limits — measured both ways. Capping the image alone leaves the
                     frame at the panel's full width once the picture is height-limited, which
                     put the action bar on the panel's corner instead of the picture's; fixing
                     the frame's height instead skews the box the other way. -->
                <div
                    class="flex min-h-0 flex-1 items-center justify-center"
                    data-testid="dotai-image-result">
                    <div
                        class="relative flex max-h-full max-w-full"
                        [style.aspect-ratio]="aspectRatio(image.size)"
                        data-testid="dotai-image-frame">
                        <p-image
                            [pt]="imagePt"
                            imageClass="h-full w-full rounded-lg border border-surface-200 object-contain"
                            [src]="store.imageUrl()"
                            [preview]="true"
                            alt="{{ image.originalPrompt }}" />

                        <!-- A rounded pill of small icon buttons over the picture's top-right
                             corner, the same shape as the image editor's `address-bar__pill`:
                             text + rounded + secondary p-buttons, a material glyph projected
                             into #icon, and the label carried by both `pTooltip` and
                             `aria-label` so the icon is never the only thing saying what the
                             control does (FR-056).

                             Built from Tailwind rather than a copy of that component's SCSS —
                             this lib has no stylesheets of its own, and the pill is six
                             utilities. The translucent fill is not decoration: icon buttons
                             directly on an arbitrary generated image are unreadable.

                             z-20 clears p-image's hover preview mask, which is absolute with
                             no z-index of its own and would otherwise swallow these clicks. -->
                        <div
                            class="absolute top-2 right-2 z-20 flex items-center gap-1 rounded-full bg-surface-0/90 p-0.5 shadow-sm"
                            role="group"
                            [attr.aria-label]="'dotai.image.actions.aria' | dm">
                            <p-button
                                [text]="true"
                                [rounded]="true"
                                severity="secondary"
                                [disabled]="image.published || store.imageSaving()"
                                [attr.aria-label]="'dotai.image.save' | dm"
                                [pTooltip]="'dotai.image.save' | dm"
                                tooltipPosition="bottom"
                                (onClick)="store.saveImage()"
                                data-testid="dotai-image-save">
                                <ng-template #icon>
                                    <i class="material-symbols-outlined">save</i>
                                </ng-template>
                            </p-button>

                            <!-- Same-origin anchor, not a p-button: it needs `download` and an
                                 `href`, so it borrows the button classes instead — the same
                                 set `text`/`rounded`/`severity` generate on the real
                                 component, at its default size.

                                 `no-underline!` needs the bang: style.css's `a { @apply
                                 underline }` is unlayered, and an unlayered declaration beats
                                 anything in @layer utilities whatever the specificity. -->
                            <a
                                class="p-button p-button-icon-only p-button-text p-button-rounded p-button-secondary no-underline!"
                                [href]="store.imageUrl()"
                                [download]="image.tempFileName"
                                [attr.aria-label]="'dotai.image.download' | dm"
                                [pTooltip]="'dotai.image.download' | dm"
                                tooltipPosition="bottom"
                                data-testid="dotai-image-download">
                                <i class="material-symbols-outlined" aria-hidden="true">download</i>
                            </a>

                            @if (image.published) {
                                <!-- A disabled button does not fire hover, so the Save tooltip
                                     cannot carry this once it is published. `role="img"` plus
                                     the label is what states it to a screen reader. -->
                                <span
                                    class="flex items-center px-1 text-green-600"
                                    role="img"
                                    [attr.aria-label]="'dotai.image.published' | dm"
                                    [pTooltip]="'dotai.image.published' | dm"
                                    tooltipPosition="bottom"
                                    data-testid="dotai-image-published">
                                    <i class="material-symbols-outlined" aria-hidden="true">
                                        check_circle
                                    </i>
                                </span>
                            }
                        </div>
                    </div>
                </div>
            } @else {
                <div
                    class="flex min-h-0 flex-1 items-center justify-center rounded-lg bg-surface-100 p-8 text-center"
                    data-testid="dotai-image-empty">
                    <div>
                        <span
                            class="material-symbols-outlined text-4xl! text-muted-color"
                            aria-hidden="true">
                            image
                        </span>
                        <p class="mt-2 text-muted-color">{{ 'dotai.image.empty.sub' | dm }}</p>
                    </div>
                </div>
            }
        </div>
    </div>
    <!-- Composer under the result, the usual arrangement for this kind of screen. No border
         here — dot-ai-prompt-input draws its own card, and a rule above it read as a second
         box around the first. -->
    <div class="shrink-0 p-4">
        <dot-ai-prompt-input
            class="container mx-auto"
            [value]="$prompt()"
            (valueChange)="$prompt.set($event)"
            (submitted)="onGenerate()"
            [disabled]="!store.isConfigured()"
            [ariaLabel]="'dotai.image.input.aria' | dm"
            [placeholder]="'dotai.image.placeholder' | dm">
            <!-- promptEnd, not promptStart: the size belongs with the action it applies to,
                 so it reads as "this size, Generate" rather than sitting alone at the far
                 left of the row. -->
            <p-select
                promptEnd
                [options]="orientations"
                optionLabel="label"
                optionValue="value"
                [ngModel]="store.imageOrientation()"
                (ngModelChange)="store.setOrientation($event)"
                [ngModelOptions]="{ standalone: true }"
                [ariaLabel]="'dotai.image.size.aria' | dm"
                appendTo="body"
                data-testid="dotai-image-orientation">
                <!-- PrimeNG's own template seam, so the leading glyph rides along with the
                     selected value instead of being positioned over the control. -->
                <ng-template #selectedItem let-selected>
                    <span class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-base!" aria-hidden="true">
                            image
                        </span>
                        <span>{{ selected.label }}</span>
                    </span>
                </ng-template>
            </p-select>

            <p-button
                promptEnd
                [label]="'dotai.image.generate' | dm"
                [disabled]="!$canGenerate()"
                (onClick)="onGenerate()"
                data-testid="dotai-image-generate" />
        </dot-ai-prompt-input>
    </div>
</section>
