<form class="form" (ngSubmit)="submit()">
    <!-- Same reason as the operator group in the settings panel: the heading needs to be
         programmatically associated, and a segmented control has no single input to point a
         `for` at. -->
    <div class="field" role="group" aria-labelledby="dotai-index-create-mode-label">
        <label id="dotai-index-create-mode-label">{{ 'dotai.index.create.mode' | dm }}</label>
        <p-selectButton
            [options]="modes"
            optionLabel="label"
            optionValue="value"
            [allowEmpty]="false"
            [ngModel]="$mode()"
            (ngModelChange)="$mode.set($event)"
            [ngModelOptions]="{ standalone: true }"
            data-testid="dotai-index-create-mode">
            <ng-template let-item pTemplate="item">{{ item.label | dm }}</ng-template>
        </p-selectButton>
    </div>

    <div class="field">
        <!-- `p-label-input-required` is the asterisk `dotFieldRequired` applies. The
             directive itself is unusable here: it injects `FormGroupDirective`, and this
             dialog is signal-based with no FormGroup, so it would throw on construction. -->
        <label class="p-label-input-required" for="dotai-index-name">
            {{ 'dotai.index.create.name' | dm }}
        </label>
        <input
            pInputText
            id="dotai-index-name"
            [ngModel]="$indexName()"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="$indexName.set($event)"
            [placeholder]="'dotai.index.create.name.placeholder' | dm"
            data-testid="dotai-index-create-name" />

        @if ($nameError(); as error) {
            <small class="p-field-error" data-testid="dotai-index-create-name-error">
                {{ error | dm }}
            </small>
        }
    </div>

    <div class="field">
        <label class="p-label-input-required" for="dotai-index-query">
            {{ 'dotai.index.create.query' | dm }}
        </label>
        <textarea
            pTextarea
            id="dotai-index-query"
            rows="3"
            [ngModel]="$query()"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="$query.set($event)"
            [placeholder]="'dotai.index.create.query.placeholder' | dm"
            data-testid="dotai-index-create-query"></textarea>
        <small class="p-field-hint">{{ 'dotai.index.create.query.hint' | dm }}</small>
    </div>

    <!-- Both only shape what gets embedded, so they are meaningless when deleting. -->
    @if ($mode() === 'add') {
        <div class="field">
            <label for="dotai-index-fields">{{ 'dotai.index.create.fields' | dm }}</label>
            <input
                pInputText
                id="dotai-index-fields"
                [ngModel]="$fields()"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="$fields.set($event)"
                [placeholder]="'dotai.index.create.fields.placeholder' | dm"
                data-testid="dotai-index-create-fields" />
            <small class="p-field-hint">{{ 'dotai.index.create.fields.hint' | dm }}</small>
        </div>

        <div class="field">
            <label for="dotai-index-template">{{ 'dotai.index.create.template' | dm }}</label>
            <textarea
                pTextarea
                id="dotai-index-template"
                rows="2"
                [ngModel]="$velocityTemplate()"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="$velocityTemplate.set($event)"
                data-testid="dotai-index-create-template"></textarea>
        </div>
    }

    <div class="mt-4 flex justify-end gap-2">
        <p-button
            severity="secondary"
            [text]="true"
            [label]="'dotai.index.create.cancel' | dm"
            (onClick)="cancel()"
            data-testid="dotai-index-create-cancel" />
        <p-button
            type="submit"
            [severity]="$mode() === 'delete' ? 'danger' : 'primary'"
            [disabled]="!$canSubmit()"
            [label]="$submitLabel() | dm"
            data-testid="dotai-index-create-submit" />
    </div>
</form>
