@if (!store.isConfigured()) {
    <!-- Pinned above the tab bar, full-bleed: the design omits this, but the legacy screen
         showed it and without it an unconfigured instance is a silent dead end (FR-047).
         Deliberately non-blocking — Config Values and Embeddings stay usable (FR-048). -->
    <p-message severity="warn" [closable]="false" data-testid="dotai-not-configured">
        {{ 'dotai.not-configured.message' | dm }}
    </p-message>
}

<p-tabs [value]="$activeTab()">
    <p-tablist>
        @for (tab of tabs; track tab.id) {
            <p-tab
                [value]="tab.id"
                [routerLink]="['/dotai', tab.id]"
                [routerLinkActive]="['bg-primary-50']"
                [attr.data-testid]="'dotai-tab-' + tab.id">
                <span class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg!" aria-hidden="true">
                        {{ tab.icon }}
                    </span>
                    <span>{{ tab.labelKey | dm }}</span>
                </span>
            </p-tab>
        }
    </p-tablist>
</p-tabs>

<div class="min-h-0 flex-1 overflow-hidden" data-testid="dotai-outlet">
    <router-outlet />
</div>
