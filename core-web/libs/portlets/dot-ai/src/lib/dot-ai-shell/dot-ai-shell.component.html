<p-tabs [value]="$activeTab()">
    <p-tablist>
        @for (tab of tabs; track tab.id) {
            <p-tab
                [value]="tab.id"
                [routerLink]="['/dotai', tab.id]"
                [routerLinkActive]="['bg-primary-50']"
                [attr.data-testid]="'dotai-tab-' + tab.id">
                <span class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg!" aria-hidden="true">
                        {{ tab.icon }}
                    </span>
                    <span>{{ tab.labelKey | dm }}</span>
                </span>
            </p-tab>
        }
    </p-tablist>
</p-tabs>

<div class="min-h-0 flex-1 overflow-hidden" data-testid="dotai-outlet">
    <router-outlet />
</div>
