@let ogTagsResults = ogTagsResults$;
@let showSEOTool = $seoResults() && ogTagsResults;

<dot-uve-toolbar />

@if (showSEOTool) {
    @if ($seoResults(); as seoResults) {
        <dot-results-seo-tool
            [seoMedia]="seoResults.socialMedia"
            [seoOGTags]="seoResults.ogTags"
            [seoOGTagsResults]="ogTagsResults"
            data-testId="results-seo-tool" />
    }
}

@if (uveStore.editorCanEditContent()) {
    <dot-uve-palette class="col-[1/2] row-[2/-1]" data-testId="palette" />
}

<div
    class="editor-content bg-gray-100"
    [ngStyle]="$editorContentStyles()"
    [ngClass]="{ 'editor-content-preview': $mode() === UVE_MODE.PREVIEW }"
    data-testId="editor-content">
    <dot-uve-browser-toolbar data-testid="uve-browser-toolbar" />
    <dot-uve-canvas data-testid="uve-canvas" />
</div>

@if (uveStore.viewMode() === UVE_MODE.EDIT) {
    <div
        class="edit-panel-wrapper border-gray-200"
        [class.border-l]="$editPanelOpen"
        [class.open]="$editPanelOpen">
        <dot-uve-edit-panel data-testid="uve-edit-panel" />
    </div>
}

<!-- Opens every content editor, in any mode and on any page: the legacy dialog, the new editor,
     the VTL source editor and the block editor sidebar. -->
<dot-uve-content-editor data-testid="uve-content-editor" />
<p-confirmDialog
    [style]="{
        width: '400px'
    }"
    rejectIcon="hidden"
    acceptIcon="hidden"
    rejectButtonStyleClass="p-button-outlined"
    data-testId="confirm-dialog" />
