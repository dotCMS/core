<p-button
    (click)="op.toggle($event)"
    [label]="value.name"
    [text]="true"
    size="small"
    data-testId="persona-button">
    @if (value?.identifier !== 'modes.persona.no.persona') {
        <p-avatar [text]="value?.name" [image]="photo" shape="circle" [pt]="avatarPt" dotAvatar />
    } @else {
        <p-avatar
            [text]="'modes.persona.no.persona' | dm"
            shape="circle"
            [pt]="avatarPt"
            dotAvatar />
    }
</p-button>
<p-popover #op data-testId="persona-op" [appendTo]="'body'">
    <!-- The popover supplies the panel chrome (border, radius, shadow) exactly as it does for
         every other filter panel, so the listbox does not restate it. Rows carry a fixed height
         on the option itself, not the item template, so the hover and selected bands cover the
         full row — the theme zeroes option padding on the assumption that the panel's contents
         own their vertical rhythm. -->
    <p-listbox
        size="small"
        (onChange)="onSelect($event); op.hide()"
        [options]="$personas().items"
        #listbox
        optionLabel="label"
        data-testId="persona-listbox"
        dataKey="identifier">
        <ng-template let-persona pTemplate="item">
            <div class="flex w-full items-center justify-between gap-4">
                <div class="flex min-w-0 items-center gap-2">
                    <p-avatar
                        [text]="persona.name"
                        [image]="persona.photo"
                        shape="circle"
                        dotAvatar />
                    <span class="truncate text-sm text-gray-900">{{ persona.name }}</span>
                </div>
                @if (persona.personalized) {
                    <p-chip
                        [label]="'modes.persona.personalized' | dm"
                        [removable]="true"
                        removeIcon="pi pi-times-circle"
                        (onRemove)="
                            onRemove($event, persona, value.identifier === persona.identifier);
                            op.hide()
                        "
                        data-testId="persona-chip" />
                }
            </div>
        </ng-template>
    </p-listbox>
    @if ($personas()?.totalRecords > MAX_PERSONAS_PER_PAGE) {
        <p-paginator
            class="p-paginator-sm"
            [rows]="$personas().itemsPerPage"
            [totalRecords]="$personas().totalRecords"
            (onPageChange)="onPaginate($event)"
            [showFirstLastIcon]="false"
            [pageLinkSize]="0"
            data-testId="persona-paginator" />
    }
</p-popover>
