<p-toolbar
    class="browser-toolbar"
    [pt]="{
        root: {
            style: {
                borderRadius: '0',
                border: 'none',
                borderBottom: 'solid 1px var(--color-gray-200)'
            }
        }
    }">
    <ng-template #start>
        <div class="flex items-center gap-1">
            @if (store.viewMode() === UVE_MODE.EDIT) {
                <p-button
                    (click)="togglePalette()"
                    [text]="true"
                    [rounded]="true"
                    [ariaLabel]="
                        (store.editorPaletteOpen()
                            ? 'uve.palette.toggle.close'
                            : 'uve.palette.toggle.open'
                        ) | dm
                    "
                    size="small"
                    data-testid="uve-toolbar-palette-toggle">
                    <!-- One static glyph: the icon names where the panel docks, not what the click
                         does, so it must not swap per state. `dock_to_right` for a LEFT panel.
                         `aria-hidden` keeps screen readers off the ligature; the state is on the
                         button's accessible name. -->
                    <i
                        class="material-symbols-outlined"
                        aria-hidden="true"
                        data-testid="palette-toggle-icon">
                        dock_to_right
                    </i>
                </p-button>
            }
        </div>
    </ng-template>
    <ng-template #center>
        <div class="browser-url-pill bg-gray-100">
            <p-button
                (click)="copyUrlOverlay.toggle($event)"
                [pTooltip]="'editpage.header.copy' | dm"
                tooltipPosition="bottom"
                icon="pi pi-link"
                [text]="true"
                [rounded]="true"
                size="small"
                [pt]="{ icon: { class: 'text-gray-900!' } }"
                data-testid="uve-toolbar-copy-url">
                <p-popover #copyUrlOverlay>
                    <div class="url-list">
                        @for (url of $pageURLS(); track url.value) {
                            <div class="url-item">
                                <div class="url-info">
                                    <span class="url-label" data-testid="copy-url-label">
                                        {{ url.label | dm }}
                                    </span>
                                    <a
                                        class="url-value"
                                        [href]="url.value"
                                        target="_blank"
                                        rel="noreferrer noopener"
                                        data-testid="copy-url-link">
                                        {{ url.value }}
                                    </a>
                                </div>
                                <p-button
                                    icon="pi pi-copy"
                                    [text]="true"
                                    size="small"
                                    [rounded]="true"
                                    (cdkCopyToClipboardCopied)="triggerCopyToast()"
                                    [cdkCopyToClipboard]="url.value"
                                    data-testid="copy-url-button" />
                            </div>
                        }
                    </div>
                </p-popover>
            </p-button>
            <div class="browser-url-bar" data-testid="uve-toolbar-page-url">{{ $pageURL() }}</div>
        </div>
        <dot-uve-device-controls
            [state]="store.$viewDeviceSelectorState()"
            (stateChange)="store.viewApplyDeviceSelectorChange($event)"
            data-testid="uve-device-controls" />
        <div class="flex items-center gap-2 rounded-full bg-gray-100 pr-3">
            <p-button
                icon="pi pi-undo"
                size="small"
                [text]="true"
                [rounded]="true"
                [pt]="{ icon: { class: 'text-gray-900!' } }"
                (onClick)="store.viewZoomReset()"
                aria-label="Reset zoom and canvas size"
                data-testid="zoom-reset" />
            <span class="h-4 w-px bg-gray-300" aria-hidden="true"></span>
            <dot-uve-iframe-size-input data-testid="uve-iframe-size-input" />
            <span class="h-4 w-px bg-gray-300" aria-hidden="true"></span>
            <dot-uve-zoom-controls data-testid="uve-zoom-controls" />
        </div>
    </ng-template>
    <ng-template #end>
        <div class="flex items-center gap-1">
            @if (store.viewMode() === UVE_MODE.EDIT) {
                <p-button
                    (click)="toggleEditPanel()"
                    [text]="true"
                    [rounded]="true"
                    [ariaLabel]="
                        (store.editorEditPanelOpen()
                            ? 'uve.edit-panel.toggle.close'
                            : 'uve.edit-panel.toggle.open'
                        ) | dm
                    "
                    size="small"
                    data-testid="right-sidebar-toggle">
                    <!-- `dock_to_left` for a RIGHT panel, rendered as-is: the glyph already points
                         the correct way, so the horizontal flip the SVG pair needed is gone. -->
                    <i
                        class="material-symbols-outlined"
                        aria-hidden="true"
                        data-testid="right-sidebar-toggle-icon">
                        dock_to_left
                    </i>
                </p-button>
            }
        </div>
    </ng-template>
</p-toolbar>
