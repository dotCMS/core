<!-- An action has no `routerLink`: the directive would navigate on the same click that opens the
     panel, so the destination is dropped rather than suppressed — the same shape the Experiments
     nav item uses when the switch is on (#37478, FR-025c, D14). -->
<p-tag
    [routerLink]="
        $asAction()
            ? null
            : [
                  '/edit-page/experiments/',
                  $runningExperiment().pageId,
                  $runningExperiment().id,
                  'reports'
              ]
    "
    (click)="onTagClick()"
    [value]="
        ('running' | dm | titlecase) +
        ' ' +
        ('dot.common.until' | dm) +
        ' ' +
        ($runningExperiment().scheduling?.endDate | date: runningUntilDateFormat)
    "
    class="p-tag-success sm cursor-pointer"
    data-testId="runningExperimentTag"
    queryParamsHandling="preserve"
    role="button">
    <svg class="mr-1" fill="currentColor" viewBox="0 0 13 13" width="13px" height="13px">
        <use href="./assets/edit-ema/experiments.svg#experiments" width="13px" height="13px"></use>
    </svg>
</p-tag>
