<!-- Only there while the user can edit the page's content, which `editorCanEditContent` already
     limits to edit mode. A contentlet in the Story Block it shows opens in the side panel. -->
@if (uveStore.editorCanEditContent()) {
    <dot-block-editor-sidebar
        [variantName]="uveStore.pageVariantId()"
        (onSaved)="uveStore.pageReload()"
        (contentletEdit)="openBlockContentlet($event)"
        #blockSidebar
        data-testid="uve-content-editor-block-sidebar" />
}
