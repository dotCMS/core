@for (container of $containers(); track $index) {
    <div
        (dragover)="onDragover($event, container)"
        [style]="container.container | dotPosition"
        [attr.data-payload]="container.payloadAttribute"
        [attr.data-dropzone]="true"
        [attr.data-empty]="!container.contentlets.length"
        data-type="container">
        @for (contentlet of container.contentlets; track $index) {
            <div
                [attr.data-payload]="contentlet.payloadAttribute"
                [style]="contentlet.area | dotPosition"
                [attr.data-dropzone]="true"
                [attr.data-empty]="false"
                data-type="contentlet"></div>
        }

        @let error = container.container | dotError: dragItem();
        @if (error.message.length) {
            <div [style]="container.container | dotPosition: true" class="drop-zone_error">
                <span [innerHTML]="error.message | dm: error.args"></span>
            </div>
        }
    </div>
}

@if (containers().length > 0) {
    <div [style]="$pointerPosition()" class="pointer" data-testid="dropzone-insertion-line"></div>
}
