<!--
    The one entry that names no place inside the hierarchy, which is why it sits above the section
    rather than in it. A button, not a tree node: the hierarchy beside it handles arrow keys, and a
    row that expands nothing must not offer a disclosure control that does nothing.
-->
<button
    type="button"
    class="p-tree-node-content mt-5 w-full shrink-0 cursor-pointer text-left"
    data-testid="all-site-content"
    [class.p-tree-node-selected]="$allSiteContentSelected()"
    [attr.aria-current]="$allSiteContentSelected() ? 'true' : null"
    (click)="onSelectAllSiteContent()">
    <i class="pi pi-list"></i>
    <span>{{ 'content-drive.sidebar.all-site-content' | dm }}</span>
</button>

<!--
    The hierarchy is the only part of the column that scrolls, so anything placed after it stays
    where it is however many folders are expanded — no sticky or fixed positioning involved. The
    tree already carries its own `overflow-y-auto`, so this only has to give it a bounded height to
    scroll within; adding a second scrolling box here would put two scrollbars in one column.
-->
<div class="min-h-0 flex-1" data-testid="hierarchy-scroll">
    <dot-tree-folder
        #treeFolder
        [folders]="$folders()"
        [loading]="$loading()"
        [selectedNode]="$selectedNode() ?? null"
        (onNodeSelect)="onNodeSelect($event)"
        (onNodeExpand)="onNodeExpand($event)"
        (loadMore)="onLoadMore($event)"
        (rightClick)="onNodeRightClick($event)"
        (uploadFiles)="uploadFiles.emit($event)"
        (moveItems)="moveItems.emit($event)" />
</div>

<!--
    Below the hierarchy, not inside it: System Host belongs to no site, so it reads as the other
    place you can be rather than as part of this site's structure. It stays reachable however many
    folders are expanded, because the hierarchy above it is what scrolls.
-->
<button
    type="button"
    class="p-tree-node-content w-full shrink-0 cursor-pointer text-left"
    data-testid="system-host"
    [class.p-tree-node-selected]="$systemHostSelected()"
    [attr.aria-current]="$systemHostSelected() ? 'true' : null"
    (click)="onSelectSystemHost()">
    <i class="pi pi-cloud"></i>
    <span>{{ 'content-drive.sidebar.system-host' | dm }}</span>
</button>
