<!--
    Column markup follows the main grid (`dot-folder-list-view`) so a row reads the same in both
    places: the same thumbnail component, the same status badge, and the content type piped through
    `dm` (which falls back to the raw variable name when there is no translation).

    Selection is a one-way `[selection]` binding plus `(selectionChange)`, rather than `[(selection)]`,
    so the parent stays the single owner of the included set.
-->
<p-table
    [value]="items()"
    [selection]="selection()"
    (selectionChange)="onSelectionChange($event)"
    dataKey="inode"
    selectionMode="multiple"
    [paginator]="$paginate()"
    [rows]="ROWS_PER_PAGE"
    [showFirstLastIcon]="false"
    [showPageLinks]="false"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} - {last} of {totalRecords}"
    [tableStyle]="{ width: '100%', 'table-layout': 'fixed' }"
    [scrollable]="true"
    scrollHeight="flex"
    data-testId="action-preview-table">
    <!--
        `table-layout: fixed` is load-bearing: with the default `auto` layout a long title widens the
        table past the dialog, pushing the Type column out of view behind a horizontal scrollbar.
        Fixed layout makes the columns honour these widths and lets the title cell truncate instead.
    -->
    <ng-template #header>
        <tr data-testId="preview-header-row">
            <th [style.width]="'3rem'">
                <p-tableHeaderCheckbox
                    [disabled]="disabled()"
                    data-testId="preview-header-checkbox" />
            </th>
            <th>{{ 'Title' | dm }}</th>
            <th [style.width]="'7rem'">{{ 'status' | dm }}</th>
            <th [style.width]="'9rem'">{{ 'type' | dm }}</th>
        </tr>
    </ng-template>

    <ng-template #body let-item>
        <tr data-testId="preview-row" [attr.data-inode]="item.inode">
            <td>
                <p-tableCheckbox
                    [value]="item"
                    [disabled]="disabled()"
                    data-testId="preview-row-checkbox" />
            </td>
            <td data-testId="preview-row-title">
                <div class="flex items-center gap-3 overflow-hidden">
                    <!-- No `fieldVariable`: the rows are the assets themselves, so the mapper
                         resolves through titleImage / the default /dA path. -->
                    <div
                        class="size-9 shrink-0 overflow-hidden rounded-md bg-(--color-palette-primary-100) p-1">
                        <dot-content-thumbnail [contentlet]="item" iconSize="20px" />
                    </div>
                    <!-- `min-w-0` is what makes `truncate` work here: a flex item refuses to shrink
                         below its content width without it, so the title would push the row wide
                         instead of ellipsing. The full text stays available as the hover title. -->
                    <span
                        class="min-w-0 truncate text-sm font-semibold text-surface-700"
                        [title]="item.title">
                        {{ item.title }}
                    </span>
                </div>
            </td>
            <td data-testId="preview-row-status">
                <dot-contentlet-status-badge [state]="item" />
            </td>
            <td class="truncate text-sm text-surface-500" data-testId="preview-row-type">
                {{ item.contentType | dm }}
            </td>
        </tr>
    </ng-template>
</p-table>
