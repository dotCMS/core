<!-- p-inputgroup joins the two halves into one field: it owns the seam and the shared border. The
     trigger sits in the addon as a plain PrimeNG button — PrimeNG's own inputgroup stylesheet
     already zeroes an addon's padding and a button's radius when it detects a button inside an
     addon (`.p-inputgroupaddon:has(.p-button)` / `.p-inputgroupaddon .p-button`), which is the exact
     recipe https://v21.primeng.org/inputgroup#button uses. No override needed on that side.

     The search input's connecting edge needs one, because this component's own host sits between
     `p-inputgroup` and the real `<input>`, breaking PrimeNG's structural CSS. `inputDt` reaches
     through with a design-token override rather than a class, so it applies by redefining the
     value the component's own stylesheet reads instead of competing with it for specificity.

     The panel reuses the same popover + listbox pass-through every other Content Drive filter
     dropdown already uses (see dot-content-drive-workflow-filter), so this control matches the
     rest of the toolbar instead of introducing a styling idiom of its own. -->
<p-inputgroup class="w-full">
    <dot-search-input
        [value]="$searchTerm()"
        [placeholder]="$placeholder()"
        [inputDt]="{
            border: { radius: '{form.field.border.radius} 0 0 {form.field.border.radius}' }
        }"
        (search)="onSearch($event)"
        class="min-w-0 flex-1" />

    <!-- Fixed width, not a minimum: a p-button sizes itself to its label, so "Title" and
         "All Fields" produced two different widths and the whole group visibly resized as the
         choice changed. 140px is what the filter chips below already use, and it fits the longer
         label whole. Width is plain Tailwind because it is layout, not a PrimeNG token — nothing in
         the button's own stylesheet sets a width to compete with, unlike the border-colour case
         below.

         Border colour, via `dt`: Button's `secondary` severity and InputText are different PrimeNG
         components with separate token families — this theme's `button.secondary.border.color`
         resolves to `{surface.700}` while `inputtext.border.color` resolves to
         `{form.field.border.color}`, so the two never matched. `TRIGGER_DT` repoints the button at
         the exact token the input already uses, rather than a guessed literal colour, so the two
         stay identical if the theme itself ever changes. -->
    <p-inputgroup-addon>
        <button
            type="button"
            pButton
            severity="secondary"
            [dt]="TRIGGER_DT"
            [attr.aria-label]="'content-drive.search.scope.label' | dm"
            [pTooltip]="'content-drive.search.scope.help' | dm"
            aria-haspopup="listbox"
            data-testid="search-scope-trigger"
            tooltipPosition="bottom"
            class="w-[140px]"
            (click)="panel.toggle($event)">
            <span class="truncate" data-testid="search-scope-active">
                {{ $activeScopeLabel() | dm }}
            </span>
            <i class="pi pi-chevron-down shrink-0 text-xs" aria-hidden="true"></i>
        </button>
    </p-inputgroup-addon>
</p-inputgroup>

<p-popover #panel [pt]="POPOVER_PT">
    <p-listbox
        [options]="scopeOptions"
        [ngModel]="$searchScope()"
        [ngModelOptions]="{ standalone: true }"
        [checkmark]="true"
        [pt]="LISTBOX_PT"
        [scrollHeight]="SCROLL_HEIGHT"
        optionValue="value"
        data-testid="search-scope-panel"
        (ngModelChange)="onScopeChange($event); panel.hide()">
        <ng-template let-item pTemplate="item">
            <span [attr.data-testid]="'search-scope-option-' + item.value">
                {{ item.label | dm }}
            </span>
        </ng-template>
    </p-listbox>
</p-popover>
