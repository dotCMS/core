<!-- The box and its Title / All Fields dropdown are the shared control in `@dotcms/ui`, which the
     AssetPicker renders too. This component is the Content Drive half: it binds the control to the
     store and claims the search shortcuts. -->
<dot-search-scope-input
    [term]="$searchTerm()"
    [scope]="$searchScope()"
    (search)="onSearch($event)"
    (scopeChange)="onScopeChange($event)" />
