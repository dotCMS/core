<p-toolbar class="h-full justify-start gap-1 border-none! px-3">
    <div
        class="grid w-full grid-cols-[min-content_1fr] grid-rows-[auto_auto] items-center gap-x-1 gap-y-4 py-3 transition-all duration-300 ease-in-out">
        <!-- Stays put whether the tree is open or closed, the way UVE keeps its palette and
             quick-edit toggles in the toolbar. -->
        <dot-content-drive-tree-toggler data-testid="tree-toggler" />

        <div
            class="col-start-2 row-start-1 grid w-full grid-cols-[repeat(2,minmax(4.5rem,14rem))_1fr] items-center gap-1">
            <dot-content-drive-search-input data-testid="search-input" class="col-span-2" />

            <div class="col-start-3 flex items-center gap-2 justify-self-end">
                @if ($displayButton()) {
                    <dot-upload-button
                        animate.enter="toolbar-enter"
                        animate.leave="toolbar-leave"
                        [defaultBaseType]="$uploadBaseType()"
                        data-testid="upload-asset-button"
                        (upload)="$upload.emit($event)" />

                    <p-button
                        animate.enter="toolbar-enter"
                        animate.leave="toolbar-leave"
                        [label]="'content-drive.add-new' | dm"
                        icon="pi pi-chevron-down"
                        iconPos="right"
                        data-testid="add-new-button"
                        (click)="menu.toggle($event)"
                        #button />
                }

                @if ($displayActions()) {
                    <!-- Workflow actions stay first in the row and remain visible for any
                         selection; the Action Center is offered alongside them, not instead, from
                         the first selected contentlet. -->
                    <dot-content-drive-workflow-actions
                        animate.enter="toolbar-enter"
                        animate.leave="toolbar-leave"
                        data-testid="workflow-actions" />

                    @if ($displayActionCenter()) {
                        <!-- Refused outright during a run: the dialog would open with every row
                             disabled and then close itself when the run settled. -->
                        <p-button
                            animate.enter="toolbar-enter"
                            animate.leave="toolbar-leave"
                            [label]="'content-drive.action-center.header' | dm"
                            [disabled]="!!$actionExecution()"
                            [pTooltip]="$actionCenterTooltip() | dm"
                            data-testid="action-center-button"
                            (click)="onOpenActionCenter()" />
                    }
                }
            </div>
        </div>

        <div class="col-start-2 row-start-2 flex w-full flex-wrap items-center gap-2">
            <!-- Leads the row: it scopes *which* assets are in play at all, so it reads as a
                 precondition for the filters that narrow within them. -->
            <dot-content-drive-shared-assets-filter data-testid="shared-assets-filter" />
            <dot-content-drive-content-type-filter data-testid="content-type-filter" />
            <dot-content-drive-workflow-filter data-testid="workflow-filter" />
            <dot-content-drive-language-field data-testid="language-field" />

            @for (field of $activeFieldFilters(); track field.variable) {
                <dot-content-drive-field-filter
                    animate.enter="field-filter-enter"
                    animate.leave="field-filter-leave"
                    [field]="field" />
            }

            <dot-content-drive-field-filter-menu data-testid="field-filter-menu" />

            @if ($hasFilters()) {
                <p-button
                    [label]="'content-drive.filters.clear-all' | dm"
                    [text]="true"
                    [rounded]="true"
                    size="small"
                    (click)="onClearAll()"
                    data-testid="clear-all-filters" />
            }

            <!-- Sits at the end of the filter row rather than beside the search box: during a run the
                 selection still stands, so the row above is occupied by the workflow-action buttons.
                 `ml-auto` keeps it right-aligned as filter chips come and go. -->
            @if ($actionExecution()) {
                <div
                    class="ml-auto flex items-center gap-2 text-sm text-gray-700"
                    animate.enter="toolbar-enter"
                    animate.leave="toolbar-leave"
                    role="status"
                    aria-live="polite"
                    data-testid="action-execution-indicator">
                    <i class="pi pi-spin pi-spinner text-[0.875rem]!" aria-hidden="true"></i>
                    <span [innerHTML]="$actionExecutionLabel()"></span>
                </div>
            }
        </div>
    </div>
</p-toolbar>

<p-menu [model]="$items()" #menu data-testId="actionsMenu" [popup]="true" appendTo="body">
    <ng-template #item let-item>
        <span class="p-menu-item-link flex cursor-pointer items-center gap-3 px-3 py-2">
            <i class="material-symbols-outlined text-[1.25rem]! leading-none text-gray-500">
                {{ item.icon }}
            </i>
            <span class="text-gray-800">{{ item.label }}</span>
        </span>
    </ng-template>
</p-menu>
