<!-- Same glyph UVE uses to toggle the palette and the quick-edit panel, rendered from the Material
     Symbols font rather than UVE's exported SVG. UVE's asset hardcodes the primary blue in both
     states, so the color is set here rather than inherited from the button. -->
<i
    pButtonIcon
    class="material-symbols-outlined text-[1.25rem]! leading-none text-primary"
    aria-hidden="true"
    data-testid="tree-toggle-icon">
    left_panel_open
</i>
