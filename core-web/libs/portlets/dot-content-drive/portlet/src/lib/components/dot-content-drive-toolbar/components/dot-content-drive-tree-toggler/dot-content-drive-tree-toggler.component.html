<!-- UVE's own palette / quick-edit toggle assets, kept as images rather than Material Symbols
     glyphs on purpose: the pair carries the blue fill and the two files differ only in how much of
     the panel is filled, which is the state cue. Both are rendered and toggled with `hidden` so
     neither has to be fetched mid-interaction. -->
<img
    class="size-5"
    src="/dotAdmin/assets/edit-uve-toolbar/left_panel_open.svg"
    alt=""
    draggable="false"
    data-testid="tree-toggle-open-icon"
    [class.hidden]="!$treeExpanded()" />
<img
    class="size-5"
    src="/dotAdmin/assets/edit-uve-toolbar/left_panel_close.svg"
    alt=""
    draggable="false"
    data-testid="tree-toggle-close-icon"
    [class.hidden]="$treeExpanded()" />
