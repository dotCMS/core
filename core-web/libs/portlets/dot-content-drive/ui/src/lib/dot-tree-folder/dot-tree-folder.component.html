@let loading = $loading();

@if (!loading) {
    <dot-folder-tree
        [folders]="$folders()"
        [loading]="false"
        [selectedNode]="$selectedNode()"
        selectionMode="multiple"
        [metaKeySelection]="true"
        scrollHeight="auto"
        [pt]="treePt"
        [showFolderIcons]="true"
        [showLoadMorePlusIcon]="true"
        loadMoreTestId="tree-load-more"
        loadMoreLabelKey="dot.file.field.host.folder.action.load.more"
        (onNodeSelect)="onNodeSelect.emit($event)"
        (onNodeExpand)="onNodeExpand.emit($event)"
        (onNodeCollapse)="onNodeCollapse.emit($event)"
        (loadMore)="onLoadMore($event)">
        <ng-template #folderTreeNodeLabel let-node>
            <!-- Every row renders the same way. A site row carries its hostname, which
                 `dotFolderName` passes through untouched (there are no path segments to strip), and
                 its icon comes from the node itself, which PrimeNG renders beside this label. Only
                 the weight sets it apart, and it is told apart by having no folder path — a tree of
                 plain folders simply has no such row. -->
            <span
                data-testid="tree-node-label"
                [attr.data-json-node]="node.data | json"
                [attr.data-id]="node?.data?.id"
                [attr.data-node-key]="node.key"
                [class]="node.data?.path ? 'font-normal' : 'font-semibold'"
                [class.active]="$activeDropNode()?.id === node?.data.id">
                {{ node.label | dotFolderName }}
            </span>
        </ng-template>
    </dot-folder-tree>
} @else {
    <div
        class="pointer-events-none flex size-full flex-col items-center justify-center gap-6 font-normal select-none">
        <div class="pulse-container relative inline-block">
            <i class="pi pi-folder z-1 text-[64px] text-(--gray-400)"></i>
        </div>
        <span class="text-base">{{ 'content.drive.loading.folders.title' | dm }}</span>
    </div>
}
