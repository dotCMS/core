<div
    class="flex w-fit items-center gap-4 rounded-md border-[1.5px] border-primary-500 bg-white py-2 pr-4 pl-1">
    <i class="material-symbols-outlined text-base text-gray-500">drag_indicator</i>
    <div class="flex items-center justify-center gap-3">
        <div class="flex min-h-6 min-w-6 items-center justify-center">
            @if (!imageError) {
                <img (error)="imageError = true" [src]="icon()" alt="drag-icon" draggable="false" />
            } @else {
                <i
                    class="material-symbols-outlined text-base text-gray-500"
                    data-testId="material-symbols-outlined-fallback">
                    {{ icon() }}
                </i>
            }
        </div>
        <span class="text-sm leading-[140%] text-black" data-testid="addWidgetLabel">
            {{ label() }}
        </span>
    </div>
</div>
