<div class="flex items-center justify-between">
    <h5 class="m-0 text-base leading-[140%] font-medium">
        {{ 'dot.template.builder.sidebar.header.title' | dm }}
    </h5>
    <p-select
        (onChange)="widthChange($event)"
        [options]="widthOptions"
        [ngModel]="width"
        data-testId="select-sidebar-width" />
</div>

<div class="flex-1">
    <dotcms-template-builder-box
        (addContainer)="addContainer($event)"
        (deleteContainer)="deleteContainer($event)"
        [width]="4"
        [items]="containers"
        [actions]="['add']"
        [containerMap]="containerMap()" />
</div>
