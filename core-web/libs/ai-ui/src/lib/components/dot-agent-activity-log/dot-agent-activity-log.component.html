<!-- Step log — one bubble per message. While the agent is working, the last
     bubble is the live/in-progress step (spinner + primary tint), so the current
     step is shown once, in place — no separate "now doing" banner. -->
<div class="flex flex-col" data-testid="agent-activity-steps">
    @for (message of displayMessages(); track message.id; let i = $index, last = $last) {
        <dot-agent-message
            [message]="message"
            [last]="last"
            [active]="i === activeIndex()" />
    }
</div>
