<div class="flex flex-none flex-col items-center">
    <!-- Timeline dot. dot-color-icon's own sizes (48/56px) are far too big for a
         log row, so the w/h + radius are overridden here — it's kept for the
         tone-driven bg/fg derivation, which is the part worth sharing. -->
    <dot-color-icon
        class="size-7.5! rounded-lg!"
        size="sm"
        aria-hidden="true"
        data-testid="agent-message-chip"
        [color]="toneColor()">
        <span class="material-symbols-outlined text-base!" data-testid="agent-message-icon">
            {{ message().icon }}
        </span>
    </dot-color-icon>
    @if (!last()) {
        <div
            class="mt-0.5 min-h-1.5 w-0.5 flex-1 bg-surface-100"
            data-testid="agent-message-connector"></div>
    }
</div>
<div class="min-w-0 pt-1">
    <div class="text-color" data-testid="agent-message-text">
        {{ message().text }}
    </div>
    @if (message().sub) {
        <div class="mt-0.5 text-muted-color" data-testid="agent-message-sub">
            {{ message().sub }}
        </div>
    }
</div>
