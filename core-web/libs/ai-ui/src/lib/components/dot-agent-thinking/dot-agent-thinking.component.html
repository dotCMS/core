<!-- Spinner + gradient-text shimmer (AI-chatbot style): the spinner is the clear
     motion cue; the shimmer sweeps a band through the label as it works. The
     shimmer is plain CSS (see the component styles) so it never clips the text. -->
<i
    class="pi pi-spin pi-spinner flex-none text-primary"
    aria-hidden="true"
    data-testid="agent-thinking-spinner"></i>
<span class="agent-shimmer min-w-0 font-medium" data-testid="agent-thinking-text">
    {{ text() }}
</span>
@if (sub()) {
    <span class="flex-none text-muted-color tabular-nums" data-testid="agent-thinking-sub">
        {{ sub() }}
    </span>
}
