<p-button
    [text]="true"
    [rounded]="true"
    [attr.aria-pressed]="store.isFullscreen()"
    [attr.aria-label]="$fullscreenLabelKey() | dm"
    [pTooltip]="$fullscreenLabelKey() | dm"
    (onClick)="store.toggleFullscreen()"
    data-testid="asset-picker-fullscreen-btn">
    <ng-template #icon>
        <i class="material-symbols-outlined text-[1.125rem]!">{{ $fullscreenIcon() }}</i>
    </ng-template>
</p-button>
