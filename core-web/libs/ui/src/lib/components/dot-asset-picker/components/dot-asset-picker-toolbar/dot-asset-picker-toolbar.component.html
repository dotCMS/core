<div class="flex w-full items-center gap-2">
    <dot-search-input
        class="min-w-0 flex-1"
        testId="asset-picker-search-input"
        [value]="$searchTerm()"
        (search)="store.setSearch($event)" />

    <dot-upload-button
        [defaultBaseType]="$defaultBaseType()"
        data-testid="asset-picker-upload"
        (upload)="upload.emit($event)" />
</div>

<!-- The same bar Content Drive renders, so the two read as one toolbar. Workflow is excluded
     deliberately (FR-014a): choosing an asset to reference is not managing where it sits in a
     review process, and the types a File or Image field can take carry no meaningful scheme
     distinction. Adding it later is one element here. -->
<dot-filter-bar class="mt-2">
    <dot-shared-assets-filter />
    <dot-content-type-filter-chip [allowedBaseTypes]="$allowedBaseTypes()" />
    <dot-language-filter-chip />
</dot-filter-bar>
