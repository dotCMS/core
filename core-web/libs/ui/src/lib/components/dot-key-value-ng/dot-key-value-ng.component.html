@let showHiddenField = $showHiddenField();

<!--
    PrimeNG gives cells their separators but the table no outer frame, so the border
    is ours; the last body row's separator is then suppressed, or it lands a second
    line just inside that frame. Framing matches `dot-relationship-field`.
-->
<p-table
    [value]="$variableList()"
    #table
    dataKey="key"
    class="overflow-hidden rounded-lg border border-solid border-(--p-inputtext-border-color) transition-colors hover:border-(--p-inputtext-hover-border-color) [&_tbody_tr:last-child_td]:border-b-0!"
    [rowHover]="true"
    [scrollable]="true"
    (onRowReorder)="onRowReorder()">
    <ng-template #header>
        <tr>
            <th class="w-12 min-w-12" scope="col"></th>
            <th scope="col">{{ 'keyValue.key_header.label' | dm }}</th>
            <th scope="col">{{ 'keyValue.value_header.label' | dm }}</th>
            <th class="w-16 min-w-12" scope="col">
                <span class="sr-only">{{ 'keyValue.actions_header.label' | dm }}</span>
            </th>
        </tr>
        <!-- `td` not `th`, so this row keeps the plain background instead of the header band. -->
        <tr
            dotKeyValueTableHeaderRow
            (save)="saveVariable($event)"
            (saveMany)="saveVariables($event)"
            [showHiddenField]="showHiddenField"
            [forbiddenkeys]="$forbiddenkeys()"></tr>
    </ng-template>

    <!--
        The table is bound to the WHOLE list and rows are withheld here instead.
        PrimeNG's row reorder mutates the very array given to `[value]`, so binding a
        shortened copy would drop the move; and because only a prefix is rendered,
        `rowIndex` stays a true index into the full list for every handler below.
    -->
    <ng-template #body let-variable let-rowIndex="rowIndex">
        @if (rowIndex < $visibleCount()) {
            <tr
                dotKeyValueTableRow
                [pReorderableRow]="rowIndex"
                (delete)="deleteVariable(rowIndex)"
                (save)="updateKeyValue($event, rowIndex)"
                [showHiddenField]="showHiddenField"
                [variable]="variable"
                [index]="rowIndex"
                #tableRow></tr>
        }
    </ng-template>

    <ng-template #footer>
        @if ($remaining() > 0) {
            <tr data-testId="dot-key-value-load-more-row">
                <!--
                    Left-aligned under the drag column, like the site/folder selector.
                    The separator is this row's top border: the last body row has its own
                    suppressed, so that it never doubles up with the table's outer frame.
                -->
                <td
                    [attr.colspan]="colspan"
                    class="border-t border-t-(--p-datatable-border-color) bg-(--p-content-background) px-4 py-3">
                    <button
                        (click)="loadMore()"
                        class="flex cursor-pointer items-center gap-2 border-0 bg-transparent p-0 text-left text-sm font-normal text-primary-500 hover:underline"
                        data-testId="dot-key-value-load-more"
                        type="button">
                        <span class="material-symbols-outlined text-base!" aria-hidden="true">
                            add_circle
                        </span>
                        {{ 'keyValue.action.load_more' | dm }}
                    </button>
                </td>
            </tr>
        }
    </ng-template>

    <ng-template #emptymessage>
        <tr>
            <td [attr.colspan]="colspan">
                <div
                    class="flex flex-col items-center justify-center gap-2 p-6"
                    data-testId="no-rows">
                    <span
                        class="material-symbols-outlined text-4xl! text-surface-500 dark:text-surface-300"
                        aria-hidden="true"
                        data-testId="dot-key-value-empty-icon">
                        key
                    </span>
                    <p class="text-surface-500 dark:text-surface-300">
                        {{ 'keyValue.value_no_rows.label' | dm }}
                    </p>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
