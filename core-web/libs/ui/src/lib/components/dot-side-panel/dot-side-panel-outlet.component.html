@for (panel of $panels(); track panel.id; let last = $last) {
    <dot-side-panel
        [heading]="panel.heading()"
        [contentStyleClass]="panel.ref.contentStyleClass()"
        [front]="last"
        (closeRequested)="panel.ref.requestClose()">
        @if (panel.component()) {
            <ng-container [dotSidePanelContent]="panel" />
        } @else {
            <!-- Fills the panel so the spinner sits in the middle, where a content that loads
                 its own data (e.g. Edit Content) shows the same spinner next: one continuous
                 loading instead of one at the top followed by one in the middle. -->
            <div
                class="flex h-full flex-1 items-center justify-center p-8"
                data-testid="side-panel-loading">
                <p-progressSpinner
                    styleClass="h-8! w-8!"
                    strokeWidth="4"
                    [ariaLabel]="'Loading' | dm" />
            </div>
        }
    </dot-side-panel>
}
