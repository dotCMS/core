<span class="truncate">
    <span class="font-semibold" data-testid="chip-title">{{ title() }}</span>
    @if (active() && !isToggle()) {
        <span data-testid="chip-values">: {{ valuesLabel() }}</span>
    } @else if (emptyLabel()) {
        <span data-testid="chip-empty-label">: {{ emptyLabel() }}</span>
    }
</span>
@if (active() && removable()) {
    <button
        type="button"
        class="flex cursor-pointer items-center justify-center border-0 bg-transparent p-0 text-current"
        [attr.aria-label]="'dot.common.remove' | dm"
        (click)="onRemove($event)"
        data-testid="chip-remove">
        <i class="pi pi-times text-sm leading-none"></i>
    </button>
} @else if (!isToggle()) {
    <!-- A toggle that is off shows nothing here: there is no overlay to promise, and no selection
         to clear. Only the dropdown chip keeps a trailing affordance in every state. -->
    <i class="pi pi-chevron-down text-sm leading-none"></i>
}
