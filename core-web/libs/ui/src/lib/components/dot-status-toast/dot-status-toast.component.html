<p-toast [position]="$position()" [key]="$key()" data-testid="dot-status-toast">
    <!-- Class names and `data-pc-section` mirror PrimeNG's own message template, the way dot-toast
         does, so Lara keeps colouring this by severity. What differs is what is rendered: an icon,
         and one line. No dismiss: a status reports something already under way and goes when
         that finishes, so a close button would ask the reader to tidy up after a thing they
         did not start. No detail slot either, because a status that needs a paragraph is a
         report and belongs in the wider outlet. -->
    <ng-template let-message #message>
        <span
            class="p-toast-message-icon"
            [attr.aria-hidden]="true"
            [attr.data-pc-section]="'icon'">
            @if (message.icon) {
                <!-- A run still going carries its own glyph, usually a spinner. -->
                <i [class]="message.icon"></i>
            } @else {
                <dot-severity-icon [severity]="message.severity" />
            }
        </span>

        <div class="p-toast-message-text">
            <!-- `innerHtml`, like dot-toast: the run label bolds the action and its target
                 ("Applying <b>Upload</b> to <b>demo.dotcms.com</b>"), and interpolating would show
                 those tags literally. Angular sanitises it. -->
            <div
                class="p-toast-summary"
                data-testid="status-toast-summary"
                [innerHtml]="message.summary"></div>
        </div>
    </ng-template>
</p-toast>
