<p-tree
    #folderTree
    [value]="$folders()"
    [loading]="$loading()"
    [selectionMode]="$selectionMode()"
    loadingMode="icon"
    [selection]="$selection()"
    [scrollHeight]="$scrollHeight() ?? undefined"
    [metaKeySelection]="$metaKeySelection()"
    [pt]="$pt() ?? undefined"
    [contextMenu]="$contextMenu() ?? undefined"
    [attr.data-testid]="$treeTestId()"
    (onNodeSelect)="onNodeSelect.emit($event)"
    (onNodeExpand)="onNodeExpand.emit($event)"
    (onNodeCollapse)="onNodeCollapse.emit($event)"
    (onNodeContextMenuSelect)="onNodeContextMenuSelect.emit($event)">
    <ng-template let-node pTemplate="default">
        @if (showsFolderIcon(node)) {
            <!-- The icon joins the row rather than the toggler. PrimeNG only renders a toggler for
                 non-leaf rows, so an icon living there would vanish on exactly the childless folders
                 that still need to look like folders.

                 `gap-1` matches the `0.25rem` the theme puts between a node's own children, so this
                 icon sits the same distance from its label as a site row's globe does from its
                 hostname.

                 The wrapper is only introduced when there is an icon to place: consumers project
                 label templates whose root is `block w-full truncate`, which would drop below an
                 inline sibling. Adding the flex row unconditionally would relayout every consumer,
                 including the roles tree, for nothing. -->
            <span class="flex min-w-0 items-center gap-1">
                <i
                    class="pi shrink-0 leading-none! text-gray-800"
                    [class]="node.expanded ? 'pi-folder-open' : 'pi-folder'"
                    [attr.data-expanded]="!!node.expanded"
                    data-testid="tree-node-folder-icon"
                    aria-hidden="true"></i>
                <ng-container *ngTemplateOutlet="nodeLabel; context: { $implicit: node }" />
            </span>
        } @else {
            <ng-container *ngTemplateOutlet="nodeLabel; context: { $implicit: node }" />
        }
    </ng-template>

    <ng-template let-node pTemplate="load-more">
        <button
            type="button"
            class="flex cursor-pointer items-center gap-2 border-0 bg-transparent p-0 text-left text-sm font-normal text-primary-500 hover:underline"
            [attr.data-testid]="$loadMoreTestId()"
            [disabled]="node.loading"
            [attr.aria-label]="loadMoreLabel(node) | dm"
            (click)="onLoadMoreClick($event, node)">
            @if (node.loading) {
                <i class="pi pi-spinner pi-spin text-xs"></i>
            } @else if ($showLoadMorePlusIcon()) {
                <i class="pi pi-plus-circle"></i>
            }
            {{ loadMoreLabel(node) | dm }}
            @if ($showLoadMoreRemaining() && node.data?.remaining) {
                ({{ node.data.remaining }})
            }
        </button>
    </ng-template>

    <!-- LOADING WON'T WORK WITH CUSTOM TEMPLATE: https://github.com/primefaces/primeng/blob/v17/src/app/components/tree/tree.ts#L113 -->
    <!-- The icon owns its own centring instead of inheriting it.
         `flex size-full items-center justify-center` makes this element fill the toggle button and
         centre the glyph box inside itself, so the glyph's position no longer depends on the icon
         font's baseline — which is what made the misalignment change with the font size, since a
         baseline-aligned glyph moves as the em box grows or shrinks. `leading-none` keeps the line box
         equal to the glyph.
         The `!` modifiers are required, and `flex!` especially: primeicons' own `.pi` sets
         `display: inline-block`, and it is unlayered (primeicons.css is a plain build stylesheet),
         so it beats Tailwind utilities, which live in `@layer utilities`. Without the modifier the
         `flex` is silently dropped while `size-*` still applies, which leaves an inline-block box
         taller than its line box and pins the glyph to the top of it. -->
    <ng-template pTemplate="togglericon" let-expanded let-loading="loading">
        @if (loading) {
            <i
                class="pi pi-spin pi-spinner flex! size-full items-center justify-center text-xs! leading-none! text-surface-400"
                data-testid="tree-toggler-loading"></i>
        } @else {
            <i
                class="pi flex! size-full translate-y-px items-center justify-center text-xs! leading-none! text-gray-600"
                [class]="expanded ? 'pi-chevron-down' : 'pi-chevron-right'"></i>
        }
    </ng-template>
</p-tree>

<!-- The row's label, factored out so the folder-icon branch above and the plain branch can share
     one definition instead of repeating it. Declared outside `<p-tree>` because PrimeNG collects
     projected templates by the `pTemplate` directive, and this one has none — it is a local
     reference, not a tree slot. -->
<ng-template #nodeLabel let-node>
    @if (nodeLabelTemplate(); as labelTpl) {
        <ng-container *ngTemplateOutlet="labelTpl; context: { $implicit: node }" />
    } @else {
        <span data-testid="tree-node-label" class="font-normal">
            {{ node.label | dotFolderName }}
        </span>
    }
</ng-template>
