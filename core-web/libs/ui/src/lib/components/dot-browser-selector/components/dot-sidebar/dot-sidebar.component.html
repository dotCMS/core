@let loading = $loading();

@if (!loading) {
    <dot-folder-tree
        [folders]="$folders()"
        [loading]="false"
        [selectedNode]="$selectedNode()"
        selectionMode="single"
        styleClass="size-full w-full h-full"
        treeTestId="browser-selector-folder-tree"
        (onNodeSelect)="handleNodeSelect($event)"
        (onNodeExpand)="onNodeExpand.emit($event)" />
} @else {
    <div class="flex size-full flex-col p-2">
        @for (col of $fakeColumns(); track $index) {
            <p-skeleton styleClass="mb-4" [width]="col" />
        }
    </div>
}
