<div class="flex w-full flex-wrap items-center gap-2" data-testid="dot-filter-bar">
    <!-- Chips arrive by projection, not from a registry. A registry inside this library could not
         render Content Drive's Workflow chip — that one lives in the portlet, and the dependency
         would run the wrong way. -->
    <ng-content />

    @if (filters.$hasNonDefaultFilters()) {
        <p-button
            [label]="'content-drive.filters.clear-all' | dm"
            [text]="true"
            [rounded]="true"
            size="small"
            (click)="onClearAll()"
            data-testid="clear-all-filters" />
    }

    <!-- Trails "Clear all", inside the same wrapping row. A surface with something to show at the
         end of the filter row — Content Drive's action-execution indicator — projects it here
         instead of placing it beside the bar: as a sibling it would be pushed onto its own line,
         because this component is a full-width flex item in the row above. -->
    <ng-content select="[dotFilterBarTrailing]" />
</div>
