<div class="flex w-72 flex-col" data-testid="lazy-multiselect">
    <div class="px-3 pt-3 pb-2">
        <p-iconfield class="w-full">
            <p-inputicon class="pi pi-search" />
            <input
                pInputText
                type="text"
                class="w-full"
                (input)="onSearch($any($event.target).value)"
                [placeholder]="$searchPlaceholderKey() | dm"
                [attr.aria-label]="$searchPlaceholderKey() | dm"
                data-testid="lazy-multiselect-search" />
        </p-iconfield>
    </div>

    <p-listbox
        [(ngModel)]="$model"
        [ngModelOptions]="{ standalone: true }"
        [options]="$state.options()"
        [multiple]="$multiple()"
        [checkbox]="$multiple()"
        [showToggleAll]="false"
        [virtualScroll]="true"
        [virtualScrollItemSize]="$itemSize()"
        [lazy]="true"
        (onLazyLoad)="onLazyLoad($event)"
        [scrollHeight]="SCROLL_HEIGHT"
        optionLabel="label"
        optionValue="value"
        dataKey="value"
        (onChange)="onChange($event.value)"
        data-testid="lazy-multiselect-listbox">
        <ng-template let-item pTemplate="item">
            @if ($itemTemplate(); as itemTemplate) {
                <ng-container
                    [ngTemplateOutlet]="itemTemplate"
                    [ngTemplateOutletContext]="{ $implicit: item }" />
            } @else {
                <dot-filter-list-item [label]="item.label" data-testid="lazy-multiselect-option" />
            }
        </ng-template>
        <ng-template pTemplate="empty">
            <div
                class="flex items-center justify-center gap-2 py-4 text-slate-500"
                [style.height]="SCROLL_HEIGHT"
                data-testid="lazy-multiselect-empty">
                @if ($state.loading()) {
                    <i class="pi pi-spin pi-spinner text-2xl"></i>
                } @else if ($state.error()) {
                    <span class="text-sm" data-testid="lazy-multiselect-error">
                        {{ $errorKey() | dm }}
                    </span>
                } @else {
                    <span class="text-sm">{{ $emptyKey() | dm }}</span>
                }
            </div>
        </ng-template>
    </p-listbox>
</div>
