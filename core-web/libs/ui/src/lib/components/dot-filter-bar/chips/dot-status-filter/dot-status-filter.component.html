<dot-chip-filter
    [title]="'content-drive.status-filter.title' | dm"
    [selections]="$chipSelections()"
    [attr.aria-label]="'content-drive.status-filter.title' | dm"
    (clicked)="popover.toggle($event)"
    (removed)="onClearAll()"
    data-testid="status-filter-chip" />

<p-popover #popover>
    <div class="flex w-64 flex-col bg-white" data-testid="status-filter-panel">
        @if ($isBounded()) {
            <!-- FR-014e: a silently shorter list reads as "these states do not exist" rather than
                 "how this picker was opened rules them out". -->
            <p
                class="px-4 pt-3 text-xs text-slate-500"
                data-testid="status-filter-bound-note">
                {{ 'content-drive.status-filter.bound' | dm }}
            </p>
        }

        <!-- The listbox owns selection in multiple mode, so the whole row — label included — is
             the click target. The checkbox below is presentation only. -->
        <p-listbox
            class="min-h-0 flex-1"
            [options]="$options()"
            [multiple]="true"
            [ngModel]="$selection()"
            (ngModelChange)="onSelectionChange($event)"
            [ngModelOptions]="{ standalone: true }"
            optionValue="value"
            [scrollHeight]="LISTBOX_SCROLL_HEIGHT"
            data-testid="status-filter-listbox">
            <ng-template let-item pTemplate="item">
                <!-- testid on the row, not the checkbox: the row is what a user clicks. -->
                <div
                    class="flex w-full min-w-0 items-center gap-2"
                    [attr.data-testid]="'status-option-' + item.value">
                    <!-- pointer-events-none so the row handles the click: without it the checkbox
                         would toggle on its own and the row would toggle again, cancelling out. -->
                    <p-checkbox
                        [ngModel]="isSelected(item.value)"
                        [ngModelOptions]="{ standalone: true }"
                        [binary]="true"
                        class="pointer-events-none"
                        [attr.data-testid]="'status-checkbox-' + item.value" />
                    <dot-filter-list-item [label]="item.labelKey | dm" />
                </div>
            </ng-template>
        </p-listbox>
    </div>
</p-popover>
