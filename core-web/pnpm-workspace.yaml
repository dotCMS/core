# pnpm configuration for core-web.
#
# From pnpm 11 on, the `pnpm` block in package.json is no longer read and .npmrc is
# consulted for registry/auth only. Everything else lives here. pnpm 12 fails the
# install on an unrecognized key in this file (ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS)
# because the project pins its package manager, so typos surface immediately.
#
# This stays a single-project setup: no `packages:` key on purpose.

overrides:
    '@babel/helper-define-polyfill-provider': 0.6.6
    '@tiptap/core': 3.22.2
    '@vue/shared': 3.5.29
    http-cache-semantics: 4.1.1
    pdfjs-dist: 4.2.67
# The `stylus: github:stylus/stylus#0.59.0` override that lived here under pnpm 10 was
# dropped: stylus is an optional peer of the css loaders and is never installed (it
# appears in pnpm-lock.yaml only as an optional peerDependency, with no resolution), so
# the override resolves nothing. It would also be the only exotic (git) source in a tree
# where blockExoticSubdeps is now on.

peerDependencyRules:
    allowedVersions:
        '@angular/core': '22'
        '@angular/common': '22'
        '@angular/forms': '22'
        '@angular/router': '22'
        '@angular/platform-browser': '22'
        '@angular/cdk': '22'
        'primeng>@angular/core': '22'
        'primeng>@angular/common': '22'
        'primeng>@angular/forms': '22'
        'primeng>@angular/router': '22'
        'primeng>@angular/platform-browser': '22'
        '@ngrx/signals>@angular/core': '22'
        '@ngrx/component-store>@angular/core': '22'

# Third-party manifest corrections — packages that import modules they never declare.
#
# All four work today only by accident of directory geometry: Node's walk-up escapes the isolated
# package directory and reaches core-web's own node_modules, where the module happens to be a direct
# dependency. That rescue disappears the moment the virtual store lives outside the project
# (`virtualStoreType: global`, which pnpm recommends for git worktrees — see #37573), and the
# production build then fails with "Could not resolve".
#
# Each entry adds the missing module as a **peerDependency**, never a `dependency`. A dependency
# would let pnpm resolve a SECOND copy: yjs throws when two instances load, and Angular does not
# throw at all — it just ends up with two injector registries, which fails quietly and far from the
# cause. A peer resolves from the consumer, so the package links the single instance core-web
# already installs.
#
# Keys carry the exact validated version on purpose: when a package moves past it the correction
# stops applying, which is the condition the nightly detector exists to surface. Re-validate and
# re-key rather than widening a range.
packageExtensions:
    # Imports 'chart.js/auto' in fesm2022/primeng-chart.mjs. Declares every Angular peer it needs
    # and rxjs, but not chart.js. Optional: only consumers using the Chart component need it, and
    # core-web does (dot-analytics). Verified against #37573 build output. discoveredBy: build
    'primeng@21.1.3':
        peerDependencies:
            chart.js: '^4.0.0'
        peerDependenciesMeta:
            chart.js:
                optional: true

    # Imports 'yjs' in awareness.js. Declares only lib0 and has no peerDependencies at all.
    # discoveredBy: build (and independently by tools/scan-undeclared-imports.mjs)
    'y-protocols@1.0.1':
        peerDependencies:
            yjs: '^13.5.0'

    # Imports '@angular/forms' (NG_VALUE_ACCESSOR, NG_VALIDATORS). Declares @angular/core and rxjs
    # as peers but omits forms. Range mirrors its own `>=` style. discoveredBy: build
    '@materia-ui/ngx-monaco-editor@6.0.0':
        peerDependencies:
            '@angular/forms': '>=13.0.0'

    # Imports 'rxjs' and 'rxjs/operators'. Declares the three Angular peers and tinymce, but not
    # rxjs. Range mirrors its own `>=` style. discoveredBy: build
    '@tinymce/tinymce-angular@7.0.0':
        peerDependencies:
            rxjs: '>=6.0.0'

    # setup-testbed.js imports 'tslib', '@angular/core', '@angular/core/testing' and
    # '@angular/platform-browser/testing'. The manifest has `dependencies: {}` and lists neither
    # tslib nor any @angular package among its peers.
    #
    # This one is NOT reachable from the production bundle, so `nx build` never surfaced it — the
    # whole Vitest suite failed to load instead (116 test files, "no tests"). It is the reason the
    # test run is a separate acceptance story rather than a formality after a green build.
    # discoveredBy: build (test layer)
    '@analogjs/vitest-angular@2.7.1':
        peerDependencies:
            tslib: '^2.0.0'
            '@angular/core': '>=17.0.0'
            '@angular/platform-browser': '>=17.0.0'

    # --- Test-layer corrections ---------------------------------------------------------------
    # The six below serve the Vitest module graph, which the production bundler never walks. They
    # were found by scanning the 28 packages listed in the vite configs' `test.server.deps.inline`
    # rather than by iterating on failed test runs, after the first two cost a full suite run each.
    # Every added peer is a direct dependency of core-web, so each resolves to the one instance the
    # workspace already installs. discoveredBy: scan (test layer)

    # Imports @angular/core, @angular/platform-browser(-dynamic), rxjs and vitest; declares only
    # @angular/common, @angular/router and @angular/animations as peers. Its '@jest/globals' import
    # is deliberately NOT declared here — this workspace is migrating off jest, and core-web does
    # not carry it. If a spec ever reaches that path it should fail loudly rather than resolve.
    '@openng/spectator@1.0.1':
        peerDependencies:
            '@angular/core': '>=22.0.0'
            '@angular/platform-browser': '>=22.0.0'
            '@angular/platform-browser-dynamic': '>=22.0.0'
            rxjs: '>=7.0.0'
            vitest: '>=1.0.0'

    '@analogjs/vite-plugin-angular@2.7.1':
        peerDependencies:
            '@angular/compiler': '>=17.0.0'
            '@angular/compiler-cli': '>=17.0.0'
            '@angular/core': '>=17.0.0'
            typescript: '>=5.0.0'
            vitest: '>=1.0.0'

    # Imports @angular/forms from its form-field and input modules without declaring it.
    '@angular/cdk@22.1.0':
        peerDependencies:
            '@angular/forms': '>=22.0.0'

    # Both import '@ngrx/operators', which neither declares.
    '@ngrx/component-store@21.1.1':
        peerDependencies:
            '@ngrx/operators': '>=21.0.0'

    '@ngrx/signals@21.1.1':
        peerDependencies:
            '@ngrx/operators': '>=21.0.0'

    # --- Stencil / webcomponents layer -------------------------------------------------------
    # A third module graph, found only by watching the dotcms-webcomponents build inside
    # `nx serve`. Both import '@material/mwc-base/aria-property.js' and declare mwc-icon,
    # mwc-ripple, lit and tslib but never mwc-base — which core-web does carry as a direct
    # dependency at the same 0.27.0. Under the global store Stencil reported UNRESOLVED_IMPORT and
    # silently treated it as external, so the component would have shipped with a broken import
    # rather than failing the build. discoveredBy: build (stencil layer)
    '@material/mwc-button@0.27.0':
        peerDependencies:
            '@material/mwc-base': '^0.27.0'

    '@material/mwc-icon-button@0.27.0':
        peerDependencies:
            '@material/mwc-base': '^0.27.0'

    # Ships an optional Angular wrapper (gridstack/dist/angular) importing Angular and rxjs, none of
    # it declared. Optional because the plain gridstack entry point needs none of it.
    'gridstack@8.4.0':
        peerDependencies:
            '@angular/common': '>=22.0.0'
            '@angular/core': '>=22.0.0'
            rxjs: '>=7.0.0'
        peerDependenciesMeta:
            '@angular/common':
                optional: true
            '@angular/core':
                optional: true
            rxjs:
                optional: true

ignoredOptionalDependencies:
    - canvas

# Moved out of .npmrc, which pnpm 11+ reads for registry and auth only.
engineStrict: true

# Keep strictPeerDependencies false (the pnpm default would block the install on
# pre-existing peer conflicts: codelyzer, ng-mocks, ngx-markdown, etc.).
# These mirror what yarn 1 warned about silently. Dropping this flag requires
# fixing each conflict first, tracked as separate follow-up work.
strictPeerDependencies: false

# Mirrors `yarn config set network-timeout 6000000` from the previous toolchain.
fetchTimeout: 6000000

# Replaces onlyBuiltDependencies, removed in pnpm 11 along with neverBuiltDependencies,
# ignoredBuiltDependencies and ignoreDepScripts.
allowBuilds:
    # `canvas` is also in ignoredOptionalDependencies above, so it is never installed and
    # this entry never fires today. Kept deliberately: if that ignore is ever lifted, canvas
    # is a native module that must build, and discovering that through ERR_PNPM_IGNORED_BUILDS
    # is a worse day than carrying one dead line.
    canvas: true
    esbuild: true
    '@swc/core': true
    nx: true
    '@parcel/watcher': true
    core-js: true
    document-register-element: true
    lmdb: true
    msgpackr-extract: true
    unrs-resolver: true
    # `less` was never in onlyBuiltDependencies, so pnpm 10 reported it as
    # "Ignored build scripts: less" — a notice there, but a hard install failure under
    # pnpm 12's strictDepBuilds. It has been running without its build script all
    # along, so denying it explicitly preserves today's behaviour.
    less: false

# Security posture. Set explicitly even where it matches the pnpm 12 default, because
# the intent is being declared rather than inherited.
trustPolicy: no-downgrade

# Eight lockfile entries fail no-downgrade today. None is a takeover: each is an older
# release of a package whose other releases carry provenance, and the check compares a
# version against the package's whole history regardless of semver line. Publish dates
# verified against registry.npmjs.org. Listed one by one rather than waved through with
# trustPolicyIgnoreAfter, which would stop checking every package older than its window.
trustPolicyExclude:
    # legacy major lines that never adopted provenance, while a newer line already had it
    - 'semver@5.7.2' # 2023-07-10; semver 7.5.1 attested since 2023-05-12
    - 'semver@6.3.1' # 2023-07-10; same
    - 'css-declaration-sorter@6.4.1' # 2023-07-08; 7.0.0 attested since 2023-05-29
    # a provenance gap in one release of an otherwise attested line
    - 'undici-types@6.21.0' # 2024-11-13; 6.13.0 through 6.16.x (Apr-May 2024) were attested
    - 'detect-port@1.6.1' # 2024-05-08; 1.6.0 was attested the same day
    - 'chokidar@4.0.3' # 2024-12-18; 3.6.0 attested since 2024-02-06
    # strongest signal here: over a thousand earlier versions attested, these two are not
    - '@modern-js/node-bundle-require@2.68.2' # 2025-07-11
    - '@modern-js/utils@2.68.2' # 2025-07-11

# Drop entries above as soon as the lockfile stops resolving them, so the list cannot rot.
trustPolicyExcludePrune: true

blockExoticSubdeps: true
strictDepBuilds: true

# pnpm 11 changed the default to `install`, which would inject a dependency install into
# Maven and CI builds that expect to run against an already-installed tree.
verifyDepsBeforeRun: warn

# Maturity gate. pnpm refuses to resolve a version until it has been public for this
# long, which is the defence against a freshly compromised release: those are usually
# detected and pulled within hours. 7 days rather than the 1440-minute (1 day) default,
# to leave more room for that detection.
#
# Declaring this explicitly also turns on minimumReleaseAgeStrict (pnpm 12.3.0+): when no
# version in a range is old enough, resolution fails instead of quietly falling back to a
# young one. `pnpm audit --fix` records a security update that must skip the wait in
# minimumReleaseAgeExclude.
#
# minimumReleaseAgeIgnoreMissingTime: false closes the silent hole. The check needs the
# registry's `time` field; when it is missing, the default is to skip the check without
# saying so. Our mirror dotcms-npm.b-cdn.net did not return `time` consistently until the
# Cloud team fixed its cache to honour the Accept header (dotCMS/core#37562) — with that
# fixed, the data is there, and a future regression should fail loudly rather than
# silently disable the gate.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
