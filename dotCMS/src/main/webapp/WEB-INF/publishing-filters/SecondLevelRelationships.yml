title: Everything, Dependencies and Second-Level Relationships
sort: 6
default: false
roles: "DOTCMS_BACK_END_USER"
filters:
   ## Lucene query that exclude content to be added to the bundle
   excludeQuery: ""
   ## list of classes that should never be pushed: ContentType, Template, Containers, Folder, Host, Links, Workflow, Language, Rule, Contentlet, Category, User, OSGI
   excludeClasses: []
   ## check for any dependency that the pushed asset may need (if false will not look for any dependency or relationship)
   dependencies: true
   ## Lucene query that exclude content to be added to the bundle as a dependency
   excludeDependencyQuery: ""
   ##  list of classes that should never be pushed as dependencies: ContentType, Template, Containers, Folder, Host, Links, Workflow, Language, Rule, Contentlet, Category
   excludeDependencyClasses: []
   ## force push as always worked, if true will push regardless the pushed asset history
   forcePush: false
   ## check for relationships (if false neither the related content nor the related content type will be pushed)
   relationships: true
   ## if true, also follows relationships one extra level beyond the direct relationships above
   ## (e.g. pushing A, related to B, related to C, also includes C) — does not recurse any further
   relationshipsSecondLevel: true
   ## optional: number of relationship levels to follow (1 = direct only, 2 = same as relationshipsSecondLevel,
   ## N = N levels, 0 = unlimited / the whole reachable graph). When set it takes precedence over
   ## relationshipsSecondLevel. Every value, including 0, is limited by the server property
   ## push.publishing.relationships.max.depth (default 10). Copy this filter under a new file name and
   ## uncomment to use, e.g.:
   # relationshipsDepth: 0
