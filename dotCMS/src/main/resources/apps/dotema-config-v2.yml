name: 'UVE - Universal Visual Editor'
iconUrl: 'https://static.dotcms.com/assets/icons/apps/ema-v2-icon.png'
allowExtraParameters: false
description: 'UVE - or Universal Visual Editor, allows you to proxy your edit mode requests to a 3rd party server or web site. If that site is configured to use the dotCMS Page API then UVE enables remote content management of content, layouts and pages that are hosted remotely.'
params:
    configuration:
        value: ''
        hidden: false
        type: 'JSON'
        label: 'Configuration'
        required: true
        hint: |
            A JSON object that maps page URLs to the 3rd party server that renders them. Each entry in `config` is checked in order, and the first `pattern` (a RegEx) that matches the page path wins.

            - `pattern`: RegEx matched against the page path.
            - `url`: base URL of the server that renders the matching pages.
            - `options.allowedDevURLs` (optional): extra URLs allowed to load the UVE through the `clientHost` query parameter, e.g. local dev servers.

            Example: pages under `/blogs/` go to one server, and every other page (`.*`) goes to another.

            ```json
            {
                "config": [
                    {
                        "pattern": "/blogs/(.*)",
                        "url": "https://myspa.blogs.com:3000"
                    },
                    {
                        "pattern": ".*",
                        "url": "https://myspa.com:3000",
                        "options": {
                            "allowedDevURLs": [
                                "http://localhost:3000",
                                "http://localhost:3001",
                                "https://myspa.dev.com"
                            ]
                        }
                    }
                ]
            }
            ```
