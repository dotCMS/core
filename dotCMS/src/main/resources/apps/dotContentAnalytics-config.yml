name: "Content Analytics"
iconUrl: "https://static.dotcms.com/assets/icons/apps/analytics.png"
allowExtraParameters: false
description: "Content Analytics allow developers and/or marketers to track user interactions across specified Sites in dotCMS."

params:
  siteKey:
    value: ""
    hidden: false
    type: "GENERATED_STRING"
    label: "Site Key"
    hint: "The Site Key is required in all requests that send Events to the Content Analytics Service. You can either enter your own Site Key, or have dotCMS generate a secure one for you."
    required: true
    buttonLabel: "Auto Generate Site Key"
    buttonEndpoint: "/api/v1/analytics/content/sitekey/generate/$siteId"
  filterUrlParams:
    value: true
    hidden: false
    type: "BOOL"
    label: "Filter URL Parameters"
    hint: "When checked, page and link URLs sent with analytics events keep only the query parameters listed in Allowed URL Parameters, the ones set for the whole instance, and the standard campaign parameters and ad click IDs. When unchecked, all query parameters are sent. Either way, user names, passwords and session ids are removed from these URLs."
    required: false
  allowedUrlParams:
    value: ""
    hidden: false
    type: "STRING"
    label: "Allowed URL Parameters"
    hint: "Comma-separated list of extra query parameter names to keep in page and link URLs sent with analytics events (for example: lang, category). Always kept: utm_source, utm_medium, utm_campaign, utm_term, utm_content, utm_id, utm_source_platform, utm_creative_format, utm_marketing_tactic, gclid, fbclid and dclid. Names set for the whole instance by your administrator are also kept. Other query parameters are removed. Applies to server-rendered and headless sites."
    required: false
