# dotCMS Spec-Kit extension hooks
#
# Read by the /speckit-* skills. Schema mirrors the shipped core extensions
# (e.g. the `git` extension's extension.yml `hooks:` block). Command names use
# dots; skills map them to slash commands by replacing dots with hyphens
# (speckit.adr-context -> /speckit-adr-context).
#
# Two purposes:
#
#   1. before_plan  -> make ADR consultation an AUTOMATIC, mandatory step at the start
#      of the plan phase, so every plan treats relevant dotCMS/platform-adrs decisions
#      as input.
#
#   2. after_implement -- RECOMMEND convergence at the end of implement. Deliberately
#      `optional: true`: the shipped skills print the recommendation with the command
#      ready to run, and do NOT execute it. Convergence IS part of the flow, but the
#      developer decides WHEN.
#
#      Why not mandatory: firing automatically at the end of implement assesses the
#      LEAST final state of the work. In practice a developer finishes the task list and
#      then makes several manual corrections; an automatic run would sign off on the code
#      as it stood before that polishing, and a stale `converged` verdict is worse than
#      none because nobody re-reads it. Only the developer knows when they are actually
#      done, so only the developer can pick the moment.
#
#   3. after_converge -- this one IS mandatory, and that is not a contradiction. By the
#      time it fires the developer has already chosen to converge; extending that single
#      decision to documentation drift (docs/, CLAUDE.md, openapi.yaml, Javadoc) needs no
#      second prompt. One intent, complete coverage.
#
#      Both converge commands are append-only: they add tasks to tasks.md and never edit
#      docs, code, spec.md or plan.md.
#
# See .specify/CUSTOMIZATIONS.md customizations #2, #7 and #8 for the full rationale.

hooks:
  before_plan:
    command: speckit.adr-context
    optional: false
    description: "Consult dotCMS/platform-adrs for ADRs relevant to this work before planning (binding input; never creates ADRs)"

  after_implement:
    command: speckit.converge
    optional: true
    description: "Recommended before PR 2: assess the codebase against spec/plan/tasks and append remaining work"
    prompt: "Task list complete. Once you have finished any manual corrections, run /speckit-converge to check the final state against the approved spec — then open PR 2. Run it when YOU judge the work done, not now if you still have edits to make."

  after_converge:
    command: speckit.docs-converge
    optional: false
    description: "Extend the gap analysis to documentation drift (docs/, CLAUDE.md, openapi.yaml, Javadoc); append-only, never edits docs"
