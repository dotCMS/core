version: '3.7'

networks:
    db_net:
    es_net:

volumes:
    cms-shared:
    cms-local:

services:
    elasticsearch-test:
        image: ghcr.io/dotcms/elasticsearch:7.9.1
        environment:
            - cluster.name=elastic-cluster
            - discovery.type=single-node
            - data
            - bootstrap.memory_lock=true
            - CLI_JAVA_OPTS="-Xms3g -Xmx3g"
        ports:
            - 9200:9200
            - 9600:9600
        ulimits:
            memlock:
                soft: -1
                hard: -1
        networks:
            - es_net

    dejavu:
        image: appbaseio/dejavu:3.6.0
        container_name: dejavu
        ports:
            - '1358:1358'
        links:
            - elasticsearch-test
    db-test:
        image: pgvector/pgvector:pg18
        command: postgres -c 'max_connections=400' -c 'shared_buffers=128MB'
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PWD:-postgres}
            POSTGRES_DB: ${DB_DB:-dotcms}
        volumes:
            - ./setup/db/postgres/init-scripts:/docker-entrypoint-initdb.d/
        tmpfs:
            - /var/lib/postgresql:rw
        networks:
            - db_net
        ports:
            - '${DB_HOST_PORT:-5432}:5432'

    dotcms-test:
        image: ${DOTCMS_IMAGE}
        environment:
            CATALINA_OPTS: '-XX:+PrintFlagsFinal'
            DB_BASE_URL: 'jdbc:postgresql://db-test/dotcms'
            DB_USERNAME: 'postgres'
            DB_PASSWORD: 'postgres'
            DOT_ES_ENDPOINTS: 'http://elasticsearch-test:9200'
            DOT_ES_PROTOCOL: 'http'
            DOT_DOTCMS_DEV_MODE: 'true'
            DB_MAX_TOTAL: 15
            DB_MAX_WAIT: 600000
            DOT_INDEX_POLICY_SINGLE_CONTENT: 'FORCE'
            DOT_ASYNC_REINDEX_COMMIT_LISTENERS: 'false'
            DOT_ASYNC_COMMIT_LISTENERS: 'false'
            # With synchronous commit listeners, the cache-flush delay is a sleep on the request
            # thread after every write (3000 ms by default). One node needs no wait for a cluster.
            DOT_NETWORK_CACHE_FLUSH_DELAY: 10
            # Drop the GraphQL schema as soon as a content type changes (default: 5 s debounce).
            # Safe only because newman runs one request at a time: field delete and type destroy
            # drop the schema before their transaction commits.
            DOT_GRAPHQL_SCHEMA_DEBOUNCE_DELAY_MILLIS: 0
            # Tomcat's keep-alive timeout defaults to this (3000 ms in server.xml). It must exceed the
            # longest script wait before a request (70 s in GraphQLTests), or newman reuses a closing connection.
            CMS_CONNECTION_TIMEOUT: 120000
            DOT_CACHE_GRAPHQLQUERYCACHE_SECONDS: 600
            WAIT_FOR_DEPS: 30
            JVM_ENDPOINT_TEST_PASS: 'obfuscate_me'
            # The escalation job archives content from imported bundles (old task dates) at an
            # arbitrary moment, undoing a publish the request before. No collection tests it.
            DOT_ESCALATION_ENABLE: 'false'
            DOT_ENABLE_SCRIPTING: 'true'
            DOT_ANNOUNCEMENTS_BASE_URL: 'http://localhost:8080'
        ports:
            - 8080:8080
            - 8443:8443
            - 8000:8000
        depends_on:
            - db-test
            - elasticsearch-test
        volumes:
            - cms-shared:/data/shared
            - cms-local:/data/local
            - type: bind
              source: ./license/license.dat
              target: /data/local/dotsecure/license/license.dat
        networks:
            - db_net
            - es_net
