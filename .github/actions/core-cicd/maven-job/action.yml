# Maven Job Action
#
# This composite action sets up and runs a Maven job with extensive configuration options.
# It handles runner preparation, caching, artifact management, and Maven execution.
#
# Features:
# - Flexible runner preparation including Java and GraalVM setup
# - Caching for Maven repository, Node.js, Yarn, and SonarQube
# - Artifact restoration and persistence
# - Configurable Maven execution with support for native builds
# - Docker image handling and artifact generation
# - Test result and build report generation
# - Support for dotCMS license setup
#
# This action is designed to be highly customizable to fit various Maven-based workflow needs,
# particularly for projects involving dotCMS, Docker, and potentially native image builds.

name: 'Maven Job'
description: 'Setup and run a Maven job'
inputs:
  needs-docker-image:
    description: 'The runner needs the built dotCMS docker image'
    required: true
    default: 'false'
  cleanup-runner:
    description: 'The runner requires extra disk space'
    required: true
    default: 'false'
  generate-artifacts:
    description: 'Generate artifacts for the job'
    required: true
    default: 'false'
  generate-docker:
    description: 'Generate docker artifact'
    required: true
    default: 'false'
  # generate-docker covers two unrelated outputs: the deployment context
  # (dotCMS/target/docker-build.tar) that deploy-docker consumes, and a throwaway
  # test image that is built, `docker save`d (~1GB) and uploaded as the
  # docker-image artifact. Only test phases consume the image; release downloads
  # the context and never looks at it. These two flags split them apart so a
  # caller can keep the context and skip the image. Both default to today's
  # behaviour so existing callers are unaffected.
  generate-test-image:
    description: 'Build, save and upload the throwaway test image. Only test phases consume it.'
    required: false
    default: 'true'
  upload-docker-context:
    description: 'Upload the docker-build-context artifact. Only the deployment phase downloads it; pull request builds turn it off. Needs generate-docker.'
    required: false
    default: 'true'
  generate-build-classes:
    description: 'Upload per-module build classes (build-classes artifact). Only the deploy-javadoc action reads it, and no workflow calls that action.'
    required: false
    default: 'true'
  needs-history:
    description: 'The runner needs the full git history'
    required: true
    default: 'false'
  requires-node:
    description: 'The job requires Node.js'
    required: true
    default: 'true'
  cache-sonar:
    description: 'Cache the SonarQube files'
    required: false
    default: 'false'
  dotcms-license:
    description: 'The license key for dotCMS'
    required: false
    default: ''
  artifacts-from:
    description: 'Download artifacts from a previous job'
    required: false
    default: ''
  needs-maven-repo:
    description: |
      Whether the job needs the dotCMS build in ~/.m2: restores the shared third-party
      dependency cache and, with artifacts-from, downloads the maven-repo artifact on
      top of it. The artifact carries only what the build installed, so a job that
      compiles or runs the dotCMS modules needs both. A job whose modules use none of
      them (Postman and E2E declare no dependencies, Karate only karate-junit5) turns
      this off and gets a small Maven plugin cache instead, which holds just the
      plugins those modules run.
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for authentication'
    required: true
  restore-classes:
    description: 'Restore build classes'
    required: false
    default: 'false'
  stage-name:
    description: 'Stage name for the build'
    required: true
  maven-args:
    description: 'Arguments for Maven build'
    required: true
  generates-test-results:
    description: 'Generate test results artifacts'
    required: false
    default: 'false'
  native:
    description: 'Build native image.  Ensures that GraalVM is installed and adds correct parameters'
    required: true
    default: 'false'
  version:
    description: 'The version of the build'
    required: false
    default: '1.0.0-SNAPSHOT'
  java-version:
    description: 'The version of Java to install'
    required: false
  graalvm-version:
    description: 'Override the sdkman version of GraalVM to install'
    required: false
  require-graalvm:
    description: 'Require GraalVM to be installed'
    required: true
    default: 'false'
  maven-compiler-release:
    description: 'Override Maven compiler release version (e.g., 21). Preferred over source/target.'
    required: false
  release-build:
    description: |
      Build the Maven coordinates the release phase will publish. On a release
      branch .mvn/maven.config pins -Drevision=<version> and -Dchangelist=, so a
      primary release already installs <version>. A Java variant needs
      -Dchangelist=-<javaNN> applied to THIS build, because the release phase no
      longer runs a second reactor install to create the suffixed coordinates.
      A CLI -D overrides .mvn/maven.config, so this wins.

      Two consequences, both intended but worth knowing:
      - The changelist applies to the whole reactor, not only the published
        coordinates, so a Java variant Docker image is now built from a
        <version>-javaNN reactor (MANIFEST Implementation-Version, OSGi bundle
        versions, resolved war coordinates). The image and its Maven coordinates
        finally agree; the shipped variant image does change.
      - Do NOT combine with a downstream test phase. cicd_comp_test-phase runs
        mvnw without -Dchangelist and would look for <version> coordinates that
        the maven-repo artifact no longer contains.

      Fails if .mvn/maven.config has no -Drevision=: the CI-friendly version
      would collapse to the parent default (1.0.0) and the build would install
      and upload release-looking 1.0.0 coordinates.
    required: false
    default: 'false'
  save-nx-cache:
    description: |
      Save the Nx cache this build used and built (see Restore Nx Cache). Only for builds of
      main's own code on main: the saved entry lands in main's cache scope, which every pull
      request and merge-queue run restores from. Never set it for a run that builds another ref.
    required: false
    default: 'false'
  artifact-suffix:
    description: 'Artifact suffix without leading separator (e.g., java-25, java-25-ms). Dash prefix added automatically for Maven artifacts. Computed from java-version if not provided.'
    required: false
  docker-io-username:
    description: 'Docker Hub username for authenticated pulls (avoids rate limiting)'
    required: false
    default: ''
  docker-io-token:
    description: 'Docker Hub token for authenticated pulls (avoids rate limiting)'
    required: false
    default: ''
  pre-pull-images:
    description: >-
      Space-separated docker.image.* property names from environments/environment.properties
      (e.g. "docker.image.postgres docker.image.search") for the test images the Maven run
      starts. They are pulled, with retries and fallbacks (Docker Hub, then Amazon's public
      gallery for OpenSearch) for mirror.gcr.io images, before Maven runs, because
      docker-maven-plugin makes a single pull attempt.
      Empty skips the step.
    required: false
    default: ''
outputs:
  # Consumed by the release phase so build, deployment and publication all agree
  # on one suffix instead of each deriving it (which is how the deployment phase
  # came to derive '-java-25' where the build derived '-java25').
  artifact-suffix:
    description: 'Resolved artifact suffix without leading separator (e.g. java-25). Empty for the primary build.'
    value: ${{ steps.artifact-suffix.outputs.raw_suffix }}
runs:
  using: 'composite'
  steps:
    - name: Prepare Runner
      uses: ./.github/actions/core-cicd/prepare-runner
      with:
        cleanup-runner: ${{ inputs.cleanup-runner }}
        java-version: ${{ inputs.java-version }}
        require-graalvm: ${{ inputs.native || inputs.require-graalvm }}
        graalvm-version: ${{ inputs.graalvm-version }}

    - name: Compute Artifact Suffix
      id: artifact-suffix
      shell: bash
      run: |
        # Naming Convention for Java Variants:
        # - User input: suffix without leading separator (e.g., "java-25" or "java-25-ms")
        # - Maven artifacts: use dash separator (e.g., "-java-25")
        # - Docker tags: use underscore separator (e.g., "_java-25")
        #
        # Note: Underscore in Docker tags is non-standard but follows existing dotCMS convention.
        # Docker typically uses dash or no separator, but we use underscore to distinguish from
        # version dashes (e.g., "25.02.16-01_java-25_abc123" vs "25.02.16-01-java-25-abc123").
        # This convention may be revisited in future.
        #
        # The derived form is "java-<major>" to match RELEASE_JAVA_VARIANT_SUFFIX
        # (java-25 in the repo variables) and cicd_comp_deployment-phase. Deriving
        # "java<major>" here made the build publish maven-repo-java25 while the
        # deployment phase asked for maven-repo-java-25.

        # Use provided artifact-suffix if set, otherwise compute from java-version
        if [ -n "${{ inputs.artifact-suffix }}" ]; then
          RAW_SUFFIX="${{ inputs.artifact-suffix }}"
        elif [ -n "${{ inputs.java-version }}" ]; then
          JAVA_MAJOR=$(echo "${{ inputs.java-version }}" | grep -oE '^[0-9]+')
          RAW_SUFFIX="java-${JAVA_MAJOR}"
        else
          RAW_SUFFIX=""
        fi

        # Normalize: strip any leading separators, then add dash for Maven artifacts
        if [ -n "${RAW_SUFFIX}" ]; then
          while [[ "${RAW_SUFFIX}" =~ ^[-_] ]]; do
            RAW_SUFFIX="${RAW_SUFFIX:1}"
          done
          ARTIFACT_SUFFIX="-${RAW_SUFFIX}"
        else
          ARTIFACT_SUFFIX=""
        fi

        echo "suffix=${ARTIFACT_SUFFIX}" >> "$GITHUB_OUTPUT"
        # Separator-free form, published as the action output for downstream jobs.
        echo "raw_suffix=${RAW_SUFFIX}" >> "$GITHUB_OUTPUT"
        echo "Artifact suffix: '${ARTIFACT_SUFFIX}'"

    - id: setup-license
      if: ${{ inputs.dotcms-license != '' }}
      name: Setup License
      shell: bash
      env:
        DOTCMS_LICENSE_KEY: ${{ inputs.dotcms-license }}
      run: |
        DOTCMS_LICENSE_PATH=~/.dotcms/license
        mkdir -p ${DOTCMS_LICENSE_PATH}
        echo "${DOTCMS_LICENSE_KEY}" > ${DOTCMS_LICENSE_PATH}/license.dat
        echo "DOTCMS_LICENSE_FILE=${DOTCMS_LICENSE_PATH}/license.dat" >> "$GITHUB_ENV"

    # The Maven distribution itself, which mvnw downloads from Maven Central on a
    # cold runner. Without this every job in a run fetches the same ~40MB zip --
    # around 26 downloads per run -- and Maven Central eventually answers 429,
    # killing the job before any dotCMS code runs (and, under fail-fast, taking
    # the rest of the matrix with it).
    #
    # Unlike the caches below this uses the combined action rather than the
    # restore/save split: the content is an immutable versioned download, so
    # there is no risk of persisting a polluted cache, and letting every job save
    # means the first one to run on a cold key repairs it for the rest.
    - id: cache-maven-wrapper
      name: Cache Maven Wrapper Distribution
      # Pinned to a commit SHA, not the mutable v6 tag: a tag can be repointed by
      # the action owner, which is how the trivy-action and kics-github-action
      # compromises worked. Bump deliberately when updating.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/wrapper
        # Changes only when the Maven version does, so this key is ~always a hit.
        key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

    # Third-party dependencies only: the build job removes everything it installed
    # before saving (see Delete Built Artifacts From Cache), and consumers get the
    # built artifacts from the maven-repo artifact instead. Test jobs that need the
    # dotCMS build restore it too; the build job saves it before they start, and a
    # miss falls back to an older entry plus whatever Maven downloads.
    #
    # The v2 in the key retires the entries written before that cleanup existed.
    # They carried a second copy of every dotCMS module under old release versions
    # (about 1 GB), and the restore-keys fallback copies such an entry forward to
    # every new pom hash, so it would never have aged out on its own.
    - id: restore-cache-maven
      name: Restore Maven Repository Cache
      if: ${{ inputs.needs-maven-repo == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-mavencore-v2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-mavencore-v2-

    # Postman, Karate and E2E run no dotCMS module, so they skip the cache above and the
    # maven-repo artifact, and Maven fetches the plugins they run (about 170-220 MB, thousands
    # of small files) from Maven Central. Maven 3.9.2's resolver (1.9.10) retries only I/O
    # errors, three times (aether.connector.http.retryHandler.count), and never an HTTP 429 or
    # 503, so 15 jobs resolving the same files at once are one rate limit away from failing.
    # This small cache takes Central out of the path: whichever of those jobs finds no entry
    # saves the repository after its Maven run (Save Maven Plugin Cache), and the rest restore
    # it. The key covers the poms that decide which plugins run. It is only a head start:
    # a stale entry just means Maven downloads the difference, so a pom outside the list
    # cannot make a job wrong, only slower.
    - id: restore-cache-maven-plugins
      name: Restore Maven Plugin Cache
      if: ${{ inputs.needs-maven-repo != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-mavenplugins-v1-${{ hashFiles('pom.xml', 'parent/pom.xml', 'nodejs-parent/pom.xml', 'dotcms-postman/pom.xml', 'core-web/apps/dotcms-ui-e2e/pom.xml', 'test-karate/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-mavenplugins-v1-

    - id: restore-cache-node
      name: Restore Node Binary Cache
      if: ${{ inputs.requires-node == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: installs
        # hash nodejs-parent/pom.xml because that pom is what decides the contents
        # of installs/: it holds <pnpm.version> and installs pnpm into the same
        # prefix as Node, so bumping the pinned pnpm (or Node) invalidates this key
        # instead of restoring a cache built for the previous versions.
        key: node-binary-${{ hashFiles('core-web/.nvmrc', 'nodejs-parent/pom.xml') }}

    - name: Verify the pinned toolchain versions are in sync
      if: ${{ inputs.requires-node == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # nodejs-parent/pom.xml is the reference: Maven installs those versions and every
        # module runs them. Every other declaration has to agree, including the ones that
        # only the workflow reads — pnpm/setup resolves its version from
        # devEngines.packageManager *before* falling back to packageManager, so checking
        # packageManager alone would let a devEngines-only bump install a different pnpm
        # than Maven's, with nothing failing. Same for devEngines.runtime and Node.
        # Collect every mismatch before failing, so a contributor who forgot to bump one
        # declaration does not fix it, re-run CI, and only then learn about the next.
        pom_pnpm=$(grep -oE '<pnpm\.version>[^<]+</pnpm\.version>' nodejs-parent/pom.xml | sed -E 's|</?pnpm\.version>||g')
        pom_node=$(grep -oE '<node\.js\.version>[^<]+</node\.js\.version>' nodejs-parent/pom.xml | sed -E 's|</?node\.js\.version>||g')
        pom_node=${pom_node#v}
        fail=0

        # An absent declaration is fine; a present one must match. Written as a plain `if`
        # rather than a `&&` chain because under `set -e` a short-circuited chain returns
        # non-zero and would abort the step instead of recording the mismatch.
        check() { # <file> <label> <declared> <expected>
          if [ -n "$3" ] && [ "$3" != "$4" ]; then
            echo "::error file=$1::$2 declares $3, nodejs-parent/pom.xml pins $4. Maven installs the pom version and every module runs it, so all declarations must agree." >&2
            fail=1
          fi
        }

        for manifest in core-web/package.json dotcms-postman/package.json; do
          declared=$(jq -r '.packageManager // ""' "$manifest")
          check "$manifest" "$manifest packageManager" "${declared#pnpm@}" "$pom_pnpm"
          check "$manifest" "$manifest devEngines.packageManager" \
            "$(jq -r 'if .devEngines.packageManager.name == "pnpm" then .devEngines.packageManager.version else "" end' "$manifest")" "$pom_pnpm"
          check "$manifest" "$manifest devEngines.runtime" \
            "$(jq -r 'if .devEngines.runtime.name == "node" then .devEngines.runtime.version else "" end' "$manifest")" "$pom_node"
        done

        [ "$fail" -eq 0 ] || exit 1
        echo "toolchain in sync: pnpm $pom_pnpm, node $pom_node"

    # pnpm/setup downloads pnpm's own standalone binary — no Node and no npm
    # involved — and with `cache: true` restores and saves the pnpm store itself,
    # keyed on core-web/pnpm-lock.yaml. That replaces the `pnpm store path` probe
    # and the paired restore/save cache steps this action used to carry. It is run
    # through the setup-pnpm wrapper, which retries the registry download (a one-off
    # reset or timeout there used to fail the whole job).
    #
    # No `version` input: the action reads it from core-web/package.json
    # (devEngines.packageManager, falling back to packageManager), which the sync
    # check above already holds against nodejs-parent/pom.xml.
    #
    # install: false — the Maven build runs the install itself, in the phase and
    # with the flags the poms decide.
    - name: Set up pnpm
      if: ${{ inputs.requires-node == 'true' }}
      uses: ./.github/actions/core-cicd/setup-pnpm
      with:
        working-directory: core-web
        install: false
        cache: true

    # Nx task cache for the build job, so core-web only rebuilds the Nx projects whose inputs
    # changed. Nx cannot use a restored .nx/cache (see nx-cache-server.mjs for why), so the
    # entries travel as files that a local server hands to Nx through its remote cache protocol.
    # Only jobs that generate artifacts (the build phase) take part, since they run the full Nx
    # build. Of those, only release-build: true skips the cache. Everything else uses it, so
    # images that trunk, the nightly and manual deploys publish can contain outputs Nx restored
    # from the cache rather than rebuilt.
    #
    # Only callers that pass save-nx-cache save, and the build phase sets it only for trunk on a
    # push to main and the scheduled nightly, the two builds of main's own code. A run that builds
    # some other ref (manual deploy, CLI release) never saves into main's scope, whatever ref it
    # was dispatched from. restore-keys gives every run the newest saved entry: pull requests and
    # the merge queue can read main's caches, while nothing else can read the ones they would
    # save. The key only decides when
    # main stores a new entry (about 37 MB): when core-web has changed since the last one. Which
    # artifacts Nx may reuse is decided by Nx's own task hashes, not by this key, so every file a
    # shipped build reads must be one of its Nx inputs. Nx's graph alone misses some (Tailwind
    # scans the whole workspace, styles come from libs/dotcms-scss by path, npm files are read by
    # path); the warBuild, dotcmsScss and tailwindSources inputs in core-web/nx.json cover them.
    - id: restore-cache-nx
      name: Restore Nx Cache
      if: ${{ inputs.requires-node == 'true' && inputs.generate-artifacts == 'true' && inputs.release-build != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nx-cache
        key: ${{ runner.os }}-nx-v1-${{ hashFiles('core-web/**') }}
        restore-keys: |
          ${{ runner.os }}-nx-v1-

    # The restored entries are moved aside and the server links each one into the fresh
    # directory when Nx asks for it, so the directory saved later holds this run's entries only
    # and the cache does not grow from run to run. Nx is pointed at the server only once the
    # server has written its ready file, which it does after it is listening; if the port is
    # taken, the server exits instead and the build runs without the cache rather than talking
    # to whatever holds the port. If the server stops during the build, Nx fails the build with
    # "Failed to send request ... 127.0.0.1:47321" (Show Nx Cache Server Log below prints why);
    # that is accepted, since it never builds a war from partial output.
    - id: start-nx-cache
      name: Start Nx Cache Server
      if: ${{ steps.restore-cache-nx.outcome == 'success' }}
      shell: bash
      env:
        NX_CACHE_DIR: ${{ runner.temp }}/nx-cache
        NX_CACHE_PORT: '47321'
      run: |
        if [[ -d "$NX_CACHE_DIR" ]]; then
          mv "$NX_CACHE_DIR" "$NX_CACHE_DIR-restored"
          echo "Restored $(ls "$NX_CACHE_DIR-restored" | wc -l) Nx cache entries"
        fi
        ready="$RUNNER_TEMP/nx-cache-server.ready"
        rm -f "$ready"
        nohup node "$GITHUB_ACTION_PATH/nx-cache-server.mjs" "$NX_CACHE_PORT" "$NX_CACHE_DIR" "$NX_CACHE_DIR-restored" "$ready" \
          > "$RUNNER_TEMP/nx-cache-server.log" 2>&1 &
        server=$!
        for _ in $(seq 1 50); do
          if [[ -s "$ready" ]]; then
            echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:$NX_CACHE_PORT" >> "$GITHUB_ENV"
            exit 0
          fi
          kill -0 "$server" 2>/dev/null || break
          sleep 0.2
        done
        echo "::warning::Nx cache server did not start; building core-web without the Nx cache"
        cat "$RUNNER_TEMP/nx-cache-server.log"


    - id: cache-sonar
      name: Cache SonarQube Packages
      if: ${{ inputs.cache-sonar == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # Lands on top of the dependency cache restored above: the built artifacts only.
    # Suites that need no dotCMS module (needs-maven-repo off) do not download it: their
    # modules build from an empty repository (checked for Postman, Karate and E2E), and
    # their Docker image comes from the docker-image artifact below.
    - id: restore-artifact-maven-repo
      name: Restore Maven Build Repo
      if: ${{ inputs.artifacts-from != '' && inputs.needs-maven-repo == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        digest-mismatch: error
        run-id: ${{ inputs.artifacts-from }}
        github-token: ${{ inputs.github-token }}
        name: maven-repo${{ steps.artifact-suffix.outputs.suffix }}
        path: ~/.m2/repository

    - id: restore-artifact-docker-image
      name: Restore Docker Image
      if: ${{ inputs.needs-docker-image == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        digest-mismatch: error
        name: docker-image${{ steps.artifact-suffix.outputs.suffix }}
        path: /tmp/docker-image

    - name: Load Docker image from tar file
      shell: bash
      if: ${{ inputs.needs-docker-image == 'true' }}
      run: docker load < /tmp/docker-image/image.tar

    - id: restore-artifact-classes
      name: Restore Classes
      if: ${{ inputs.restore-classes == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        digest-mismatch: error
        run-id: ${{ inputs.artifacts-from }}
        github-token: ${{ inputs.github-token }}
        name: build-classes${{ steps.artifact-suffix.outputs.suffix }}

    - name: Docker Hub Login
      if: ${{ inputs.docker-io-username != '' && inputs.docker-io-token != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.docker-io-username }}
        password: ${{ inputs.docker-io-token }}

    # docker-maven-plugin pulls each image once, so a single 429 or "unknown blob" from
    # mirror.gcr.io (a shared Google mirror: anonymous, with a project-wide request quota that
    # no Docker Hub login raises) fails the whole Maven build before any test runs. Pull the
    # images here instead, where a failure can be retried, and fall back to the same image on
    # Docker Hub, which the login above authenticates, and for OpenSearch on Amazon's public
    # gallery. The plugin's default pull policy (IfNotPresent) then finds them locally. Never
    # fails the job: if every attempt fails the plugin makes its own pull and reports the
    # error as before.
    - name: Pre-pull test images
      if: ${{ inputs.pre-pull-images != '' }}
      shell: bash
      env:
        IMAGE_KEYS: ${{ inputs.pre-pull-images }}
      run: |
        set -uo pipefail
        PROPS=environments/environment.properties
        MIRROR='mirror.gcr.io/'
        ECR='public.ecr.aws/'
        ATTEMPTS=3  # per source; the pause between tries grows 10s, 20s, so at most 30s of waiting
        PULL_TIMEOUT=300  # seconds per pull, so one stalled download cannot hold the job

        # A blob download that stalls without erroring would block `wait` until the job
        # timeout, and a composite step cannot take timeout-minutes. GNU timeout exits 124
        # when it kills the pull, which counts as a failed attempt like any other, so the
        # retries and the fallbacks still run. Without `timeout` pull unbounded.
        bounded() {
          if command -v timeout > /dev/null; then timeout "$PULL_TIMEOUT" "$@"; else "$@"; fi
        }

        pull_with_retry() { # <ref>
          local n rc
          for n in $(seq 1 "$ATTEMPTS"); do
            rc=0
            bounded docker pull --quiet "$1" > /dev/null || rc=$?
            [ "$rc" -eq 0 ] && return 0
            [ "$rc" -eq 124 ] && echo "pull of $1 timed out after ${PULL_TIMEOUT}s"
            if [ "$n" -lt "$ATTEMPTS" ]; then
              echo "pull of $1 failed (attempt $n of $ATTEMPTS), retrying in $((n * 10))s"
              sleep $((n * 10))
            fi
          done
          return 1
        }

        # Sources for one image, in order: the reference as configured, then, for a mirror.gcr.io
        # reference, the same image on Docker Hub and, for OpenSearch, on Amazon's public gallery.
        # All of them serve the identical manifest digest for these tags (checked with a manifest
        # request per registry). The gallery carries only the OpenSearch images; pgvector and
        # WireMock return 404 there, so they have no third source.
        pull_image() { # <ref>
          local ref="$1" hub src
          local sources=("$ref")
          if [[ "$ref" == "$MIRROR"* ]]; then
            hub="${ref#"$MIRROR"}"
            sources+=("$hub")
            [[ "$hub" == opensearchproject/* ]] && sources+=("$ECR$hub")
          fi
          if docker image inspect "$ref" > /dev/null 2>&1; then
            echo "$ref is already present"
            return 0
          fi
          for src in "${sources[@]}"; do
            if pull_with_retry "$src"; then
              if [ "$src" = "$ref" ]; then
                echo "pulled $ref"
              else
                # Tag it with the name the Maven build asks for so the plugin finds it locally.
                docker tag "$src" "$ref" || continue
                echo "pulled $src, tagged as $ref"
              fi
              return 0
            fi
            echo "::warning::could not pull $src"
          done
          echo "::warning::could not pre-pull $ref, docker-maven-plugin will try to pull it"
          return 1
        }

        pids=()
        for key in $IMAGE_KEYS; do
          ref=$(awk -F= -v k="$key" '$1 == k { sub(/^[^=]*=/, ""); print }' "$PROPS" | tail -n 1)
          if [ -z "$ref" ]; then
            echo "::warning::$key is not set in $PROPS, nothing to pre-pull"
            continue
          fi
          pull_image "$ref" &
          pids+=($!)
        done
        for pid in "${pids[@]}"; do wait "$pid" || true; done
        exit 0

    - id: run-maven-build
      name: Run Maven Build
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        set -e  # Exit on any command failure
        DEFAULT_ARGS="-e -B --no-transfer-progress --show-version -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dprod=true"
        MAVEN_ARGS="${{ inputs.maven-args }}"
        if [[ "${{ inputs.generate-docker }}" == "true" ]]; then
          DEFAULT_ARGS="$DEFAULT_ARGS -Ddocker.buildArchiveOnly=dotCMS/target"
        fi
        if [[ "${{ inputs.native }}" == "true" ]]; then
          DEFAULT_ARGS="$DEFAULT_ARGS -Pnative"
        fi

        # Release builds: install the coordinates the release phase will publish.
        # Set explicitly (even when empty) so the result does not depend on
        # .mvn/maven.config, which release-prepare writes on the release branch.
        # Verified: a CLI -Dchangelist overrides the -Dchangelist= in that file.
        if [[ "${{ inputs.release-build }}" == "true" ]]; then
          # Guardrail: without -Drevision the version collapses to the parent
          # default (1.0.0), and the build would install and upload release-looking
          # 1.0.0 coordinates in place of the release. release-prepare writes
          # -Drevision= onto the release branch; require it.
          #
          # Require a non-empty value: a bare '-Drevision=' sets the CI-friendly
          # revision to the empty string, which collapses the version just as
          # surely, so matching the bare prefix would pass the guard on exactly
          # the case it exists for.
          if [[ ! -f .mvn/maven.config ]] || ! grep -qE -- '-Drevision=[^[:space:]]' .mvn/maven.config; then
            echo "::error::release-build=true requires a non-empty -Drevision= in .mvn/maven.config (written by the release-prepare phase). Refusing to build release-looking 1.0.0 coordinates." >&2
            exit 1
          fi
          DEFAULT_ARGS="$DEFAULT_ARGS -Dchangelist=${{ steps.artifact-suffix.outputs.suffix }}"
        fi

        # Add Maven compiler release override flag for core modules
        # Priority: explicit maven-compiler-release > default from java-version major > project defaults
        # Note: Core modules use dotcms.core.compiler.release (default 11), CLI uses dotcms.cli.compiler.release (default 11) for Quarkus/GraalVM compatibility
        COMPILER_ARGS=""
        if [[ -n "${{ inputs.maven-compiler-release }}" ]]; then
          # Explicit release override takes precedence
          COMPILER_ARGS="-Ddotcms.core.compiler.release=${{ inputs.maven-compiler-release }}"
          echo "Using explicit dotcms.core.compiler.release=${{ inputs.maven-compiler-release }}"
        elif [[ -n "${{ inputs.java-version }}" ]]; then
          # Default compiler release to match the overridden Java version
          JAVA_MAJOR=$(echo "${{ inputs.java-version }}" | grep -oE '^[0-9]+')
          COMPILER_ARGS="-Ddotcms.core.compiler.release=${JAVA_MAJOR}"
          echo "Defaulting dotcms.core.compiler.release=${JAVA_MAJOR} to match java-version"
        fi

        # Set by the build-cache-remote action when the S3 cache is wired up; empty otherwise.
        FINAL_ARGS=$(echo "$DEFAULT_ARGS $COMPILER_ARGS ${BUILD_CACHE_ARGS:-} $MAVEN_ARGS" | tr ' ' '\n' | awk '!seen[$0]++' | tr '\n' ' ')

        if [[ "${{ runner.os }}" == "Windows" && "${{ inputs.native }}" == "true" ]]; then
          echo "Building Maven with args $FINAL_ARGS"
          cmd /c 'call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" && .\mvnw.cmd $FINAL_ARGS --file pom.xml'
        elif [[ "${{ runner.os }}" == "Windows" ]]; then
          echo "Building Maven with args $FINAL_ARGS"
          .\mvnw.cmd $FINAL_ARGS --file pom.xml
        else
          echo "Building Maven with args $FINAL_ARGS"
          ./mvnw $FINAL_ARGS --file pom.xml
        fi

    # The artifact carries only what this build installed, not the whole repository:
    # the third-party dependencies travel through the Maven cache, which is far
    # smaller to move than the full repository (the 2.7 GB artifact took 37-765 s to
    # download in each of ~25 test jobs).
    #
    # "Installed" is decided per version directory, from the _remote.repositories
    # file Maven writes beside the files: an installed artifact is recorded with an
    # empty repository id ("x.jar>="), a downloaded one names the repository it came
    # from ("x.jar>dotcms-libs="). That covers builds whose version is not a
    # -SNAPSHOT (release and LTS builds), which a *-SNAPSHOT match would miss, and it
    # leaves downloaded com.dotcms releases alone: the SAML plugin compiles against
    # a pinned, downloaded com.dotcms:dotcms-core:26.03.27-01, which must stay in the
    # cache even though a build of the current version sits in the same artifactId
    # directory.
    - id: stage-built-artifacts
      name: Stage Built Artifacts
      if: ${{ inputs.generate-artifacts == 'true' }}
      shell: bash
      run: |
        STAGE="${RUNNER_TEMP}/built-artifacts"
        LIST="${RUNNER_TEMP}/built-artifacts.list"
        mkdir -p "${STAGE}"
        cd ~/.m2/repository
        # The list is NUL-separated so a path with a space cannot split. grep exits 1 when
        # nothing matches: the empty-list check below reports that, so only a real grep
        # error (2) fails here.
        { grep -rl --null --include=_remote.repositories '>=$' . || [ $? -eq 1 ]; } \
          | while IFS= read -r -d '' f; do printf '%s\0' "${f%/*}"; done > "${LIST}"
        if [ ! -s "${LIST}" ]; then
          echo "::error::The build installed nothing into ~/.m2/repository, so there is nothing to publish"
          exit 1
        fi
        tar --null -cf - -T "${LIST}" | tar -xf - -C "${STAGE}"
        du -sh "${STAGE}"

    - id: get-sdkman-version
      name: Get SDKMAN Java Version
      if: ${{ inputs.generate-docker == 'true' && inputs.generate-test-image == 'true' }}
      shell: bash
      run: |
        # Use provided java-version if set, otherwise read from .sdkmanrc
        if [ -n "${{ inputs.java-version }}" ]; then
          SDKMAN_JAVA_VERSION="${{ inputs.java-version }}"
          echo "Using override Java version: ${SDKMAN_JAVA_VERSION}"
        elif [ -f ".sdkmanrc" ]; then
          SDKMAN_JAVA_VERSION=$(awk -F= '/^java=/ {print $2}' .sdkmanrc)
          echo "Using default Java version from .sdkmanrc: ${SDKMAN_JAVA_VERSION}"
        else
          echo "Error: .sdkmanrc file not found and no java-version override provided"
          exit 1
        fi
        # This value is used as the dotcms/java-base docker tag (FROM dotcms/java-base:<tag>),
        # which cannot contain '+' - convert SDKMAN's '+' to '-' (e.g. 25.0.4+1-ms -> 25.0.4-1-ms)
        SDKMAN_JAVA_VERSION="${SDKMAN_JAVA_VERSION//+/-}"
        echo "SDKMAN_JAVA_VERSION=${SDKMAN_JAVA_VERSION}" >> $GITHUB_ENV

    # The test image is built and saved in the background while the artifacts below
    # upload: the build and `docker save` are CPU and disk work, the uploads are
    # network work, and they used to run one after another. The Wait step reports
    # the build output and fails the job if the build or save failed.
    - id: build-docker-image-from-archive
      name: Build Docker Image from Archive
      if: ${{ inputs.generate-docker == 'true' && inputs.generate-test-image == 'true' }}
      shell: bash
      run: |
        LOG="${RUNNER_TEMP}/test-image-build.log"
        STATUS="${RUNNER_TEMP}/test-image-build.status"
        PIDFILE="${RUNNER_TEMP}/test-image-build.pid"
        rm -f "${STATUS}" "${PIDFILE}"
        # Steps run under `bash -e`, which the background subshell inherits, so the
        # exit code is captured with `|| rc=$?` to make sure the status file is
        # always written. The commands are chained with && rather than `set -e`,
        # because errexit is ignored inside a command that is tested with ||.
        (
          rc=0
          (
            # Extract the build context from the tar archive
            mkdir -p /tmp/docker-context &&
            tar -xf dotCMS/target/docker-build.tar -C /tmp/docker-context &&
            # Build the Docker image from the extracted context
            docker build --build-arg SDKMAN_JAVA_VERSION="${SDKMAN_JAVA_VERSION}" -t dotcms/dotcms-test:${{ inputs.version }} /tmp/docker-context &&
            # Verify the image was created
            docker images dotcms/dotcms-test:${{ inputs.version }} &&
            docker save dotcms/dotcms-test:${{ inputs.version }} > /tmp/image.tar
          ) > "${LOG}" 2>&1 < /dev/null || rc=$?
          echo "${rc}" > "${STATUS}"
        ) > /dev/null 2>&1 < /dev/null &
        echo $! > "${PIDFILE}"

    # The jars are already deflated, so compressing them again only burns CPU: the
    # zip is single-threaded and was what paced the upload (about 19 MB/s).
    - id: persist-maven-repo
      name: Persist Maven Repo
      if: ${{ inputs.generate-artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: maven-repo${{ steps.artifact-suffix.outputs.suffix }}
        path: ${{ runner.temp }}/built-artifacts
        compression-level: 0

    # Only the deployment phase downloads this (trunk, nightly, release and manual
    # deploy, which reuse the merge-queue build). A pull request build is never
    # deployed, so it passes upload-docker-context: false.
    - id: persist-docker-build-context
      name: Persist Docker Build Context
      if: ${{ inputs.generate-docker == 'true' && inputs.upload-docker-context == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docker-build-context${{ steps.artifact-suffix.outputs.suffix }}
        path: dotCMS/target/docker-build.tar
        compression-level: 0

    - id: wait-docker-image-build
      name: Wait for Docker Image Build
      if: ${{ inputs.generate-docker == 'true' && inputs.generate-test-image == 'true' }}
      shell: bash
      run: |
        LOG="${RUNNER_TEMP}/test-image-build.log"
        STATUS="${RUNNER_TEMP}/test-image-build.status"
        PIDFILE="${RUNNER_TEMP}/test-image-build.pid"
        # The build writes the status file as its last act. If the process is gone
        # without one (killed, or the runner cancelled it), stop waiting at once
        # instead of polling to the limit. 20 minutes is far beyond the 2 minutes
        # the build and save take.
        state="timed out waiting for the build to finish"
        for _ in $(seq 600); do
          if [ -s "${STATUS}" ]; then state="finished"; break; fi
          if ! kill -0 "$(cat "${PIDFILE}" 2>/dev/null)" 2>/dev/null; then
            if [ -s "${STATUS}" ]; then state="finished"; else state="the build process vanished without recording a status"; fi
            break
          fi
          sleep 2
        done
        echo "::group::Docker image build and save output"
        cat "${LOG}" 2>/dev/null || true
        echo "::endgroup::"
        if [ "${state}" != "finished" ] || [ "$(cat "${STATUS}")" != "0" ]; then
          echo "::error::Building or saving the test image failed (${state}; status: $(cat "${STATUS}" 2>/dev/null || echo 'none'))"
          exit 1
        fi
        ls -lh /tmp/image.tar

    # level 1: measured on a 1.32 GB `docker save` tar of a dotcms/dotcms image, the
    # zip is 0.76 GB at level 1 and 0.73 GB at level 6 (level 0 stays 1.32 GB), but
    # level 1 compresses in about 15 s against 35 s. The single-threaded zip paced
    # the level 6 upload; 4% more bytes to download costs little next to that.
    - id: upload-docker-image
      name: Upload Docker Image as Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ inputs.generate-docker == 'true' && inputs.generate-test-image == 'true' }}
      with:
        name: docker-image${{ steps.artifact-suffix.outputs.suffix }}
        path: /tmp/image.tar
        compression-level: 1

    - id: persist-build-classes
      name: Persist Build Classes
      if: ${{ inputs.generate-artifacts == 'true' && inputs.generate-build-classes == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-classes${{ steps.artifact-suffix.outputs.suffix }}
        path: |
          **/target/classes/**/*.class
          **/target/generated-sources/**/*.java
          **/target/test-classes/**/*.class
          LICENSE

    # Release builds neither clean nor save the cache. Removing the release
    # coordinates would break the caller's check that they were installed, and a
    # cache entry written from a release build is how release coordinates got into
    # the shared cache in the first place.
    #
    # Pull request and merge-queue runs save only when they restored nothing at all.
    # Their entries are scoped to their own ref, so no other PR can read them, and at
    # ~690 MB each they filled the 10 GB repository cache within the hour and evicted
    # the main-branch entry that every run does read (2026-10-28: builds restoring it
    # scanned projects in 1-2 s and ran Maven in 5-8 min; cold ones took 76-127 s and
    # ~18 min). A run that restored main's entry under an older pom hash just downloads
    # the difference; main's next build (nightly) writes the new key.
    - id: delete-built-artifacts-from-cache
      name: Delete Built Artifacts From Cache
      if: ${{ inputs.generate-artifacts == 'true' && inputs.release-build != 'true' && steps.restore-cache-maven.outputs.cache-hit != 'true' && (steps.restore-cache-maven.outputs.cache-matched-key == '' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')) }}
      shell: bash
      run: |
        # Whatever this build installed, under any version (see Stage Built Artifacts for
        # how that is told from a download), then the artifactId-level metadata files that
        # listed those versions. Downloaded versions, including pinned com.dotcms releases,
        # stay.
        #
        # The list is written out before anything is deleted, so grep never walks a
        # directory that is being removed under it, and a failed delete fails the step.
        LIST="${RUNNER_TEMP}/installed-versions.list"
        cd ~/.m2/repository
        { grep -rl --null --include=_remote.repositories '>=$' . || [ $? -eq 1 ]; } \
          | while IFS= read -r -d '' f; do printf '%s\0' "${f%/*}"; done > "${LIST}"
        xargs -0 -r rm -rf < "${LIST}"
        find . -name maven-metadata-local.xml -delete
        find ~/.m2 -name \*-SNAPSHOT -type d -exec rm -rf {} +

    - id: save-cache-maven
      name: Save Maven Repository Cache
      if: ${{ inputs.generate-artifacts == 'true' && inputs.release-build != 'true' && steps.restore-cache-maven.outputs.cache-hit != 'true' && (steps.restore-cache-maven.outputs.cache-matched-key == '' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')) }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ steps.restore-cache-maven.outputs.cache-primary-key }}

    # Jobs that start together on a miss all reach this step; the first reserves the key and
    # the rest log a warning and carry on, so a lost race does not fail a job. Pull request
    # and merge-queue runs that restored an older entry skip the save, for the same reason
    # as Save Maven Repository Cache.
    - id: save-cache-maven-plugins
      name: Save Maven Plugin Cache
      if: ${{ inputs.needs-maven-repo != 'true' && steps.restore-cache-maven-plugins.outputs.cache-hit != 'true' && (steps.restore-cache-maven-plugins.outputs.cache-matched-key == '' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')) }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ steps.restore-cache-maven-plugins.outputs.cache-primary-key }}

    - id: save-cache-node
      name: Save Node Binary Cache
      if: ${{ inputs.generate-artifacts == 'true' && steps.restore-cache-node.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: installs
        key: ${{ steps.restore-cache-node.outputs.cache-primary-key }}

    # See Restore Nx Cache. An empty directory means Nx asked for nothing and stored nothing, for
    # example because Maven restored core-web from its own build cache and Nx never ran; saving
    # it would give every later run an empty entry as the newest one.
    - id: count-nx-cache
      name: Count Nx Cache Entries
      if: ${{ inputs.save-nx-cache == 'true' && env.NX_SELF_HOSTED_REMOTE_CACHE_SERVER != '' }}
      shell: bash
      env:
        NX_CACHE_DIR: ${{ runner.temp }}/nx-cache
      run: |
        entries=$(find "$NX_CACHE_DIR" -maxdepth 1 -type f ! -name '*.tmp' 2>/dev/null | wc -l | tr -d ' ')
        echo "Nx cache entries used or built by this run: $entries"
        echo "entries=$entries" >> "$GITHUB_OUTPUT"

    # Main's builds only (save-nx-cache), after a successful build with the server up.
    - id: save-cache-nx
      name: Save Nx Cache
      if: ${{ inputs.save-nx-cache == 'true' && github.ref == 'refs/heads/main' && steps.count-nx-cache.outputs.entries != '' && steps.count-nx-cache.outputs.entries != '0' && steps.restore-cache-nx.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nx-cache
        key: ${{ steps.restore-cache-nx.outputs.cache-primary-key }}

    - name: Show Nx Cache Server Log
      if: ${{ failure() && env.NX_SELF_HOSTED_REMOTE_CACHE_SERVER != '' }}
      shell: bash
      run: cat "$RUNNER_TEMP/nx-cache-server.log"

    - id: save-cache-sonar
      name: Save SonarQube Cache
      if: ${{ inputs.cache-sonar == 'true' && steps.cache-sonar.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ steps.cache-sonar.outputs.cache-primary-key }}

    # ---------------------------- Generate Reports Artifacts ----------------------------
    - id: generate-build-reports-artifact
      name: Generate Build Reports Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: "build-reports-${{ inputs.stage-name }}"
        path: |
          target/build-report.json
          LICENSE
        retention-days: 2

    - id: create-test-reports-artifact
      name: Create Test Reports Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always() && inputs.generates-test-results == 'true'
      with:
        name: "build-reports-test-${{ inputs.stage-name }}"
        path: |
          **/target/jacoco-report/*.exec
          **/target/*-reports/*.xml

    # Trial instrumentation for #38203: when cleanup-runner is off, record how
    # full the disk ends up so the job log shows the headroom. Informational only.
    - name: Report Disk Usage
      if: always() && inputs.cleanup-runner != 'true'
      shell: bash
      run: |
        echo '# Final disk usage (cleanup-runner disabled)'
        df -h / || true
        docker system df || true
