# Note: This action publishes SDK libraries to NPM.
#
# VERSIONING (ADR-0019 — date-lockstep versioning):
# - The SDK version is always the dotCMS release version it ships with. There is no
#   independent SDK versioning.
# - Single source of truth: the `version` input, supplied by the caller (the dotCMS
#   release pipeline — see cicd_release-sdk.yml, which derives it from the GitHub
#   Release tag, mirroring how cicd_release-cli.yml versions @dotcms/dotcli).
# - Every real-release invocation publishes every SDK package at that exact version to
#   the `latest` npm dist-tag — including releases where the SDK has no code changes, to
#   preserve the one-dotCMS-version <-> one-SDK-version invariant.
#
# `next` TAG (internal dev/QA use only):
# - cicd_3-trunk.yml also calls this action on merges to main that touch SDK files,
#   passing npm-tag: 'next' and a version computed from the current `latest` plus a
#   `-next.<run_number>` suffix. This is never a date-lockstep-shaped version and must
#   never be recommended to customers — see issue #36701.
#
name: 'SDK Publish NPM Packages - Stable'
description: 'Publish the dotCMS SDK libs on NPM registry at the given version and dist-tag.'
inputs:
  ref:
    description: 'Branch/tag to build from'
    required: false
    default: 'main'
  version:
    description: 'Exact version to publish every @dotcms/* SDK package at (e.g. 26.7.14-1)'
    required: true
  npm-tag:
    description: 'npm dist-tag to publish under (e.g. latest, next)'
    required: false
    default: 'latest'
  npm-token:
    description: 'NPM token'
    required: true
  github-token:
    description: 'GitHub Token'
    required: true
outputs:
  npm-package-version:
    description: 'SDK libs - NPM package version that was published'
    value: ${{ steps.update-versions.outputs.normalized_version }}
  published:
    description: 'SDK libs - Published (true if all packages published successfully)'
    value: ${{ steps.deployment_status.outputs.published }}
runs:
  using: "composite"
  steps:
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        token: ${{ inputs.github-token }}

    - name: 'Setup Node'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: 'core-web/.nvmrc'

    - name: 'Update package.json versions'
      id: update-versions
      working-directory: ${{ github.workspace }}/core-web/libs/sdk/
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        EXAMPLES_PATH: ${{ github.workspace }}/examples
      run: |
        set -euo pipefail
        echo "::group::Update package.json versions"

        # ADR-0019 requires the published SDK version to be valid, ordered npm SemVer —
        # e.g. "2026.6.24", not "2026.06.24" — but the dotCMS release tag this value comes
        # from is zero-padded (yy.mm.dd-##), so strip leading zeros from each numeric
        # segment before writing it anywhere. This is the single point of normalization;
        # every jq call below, and the idempotency check in the publish step, must use
        # this normalized value, not the raw $RELEASE_VERSION input.
        #
        # Walk the string segment by segment, PRESERVING the original separators and every
        # trailing segment. Splitting on [.-] and rebuilding from only $1..$4 silently
        # truncates the `-next.<run_number>` suffix cicd_3-trunk.yml appends to the version
        # it passes in (26.9.3-1-next.2632 -> 26.9.3-1), which would make every `next`
        # publish collide with the stable release version. Non-numeric segments (`next`)
        # pass through untouched. POSIX awk, no gawk dependency.
        RELEASE_VERSION=$(echo "$RELEASE_VERSION" | awk '{
          s = $0; out = ""
          while (match(s, /[.-]/)) {
            seg = substr(s, 1, RSTART - 1); sep = substr(s, RSTART, 1)
            if (seg ~ /^[0-9]+$/) { sub(/^0+/, "", seg); if (seg == "") seg = "0" }
            out = out seg sep
            s = substr(s, RSTART + 1)
          }
          if (s ~ /^[0-9]+$/) { sub(/^0+/, "", s); if (s == "") s = "0" }
          print out s
        }')
        echo "Normalized release version: $RELEASE_VERSION"
        echo "normalized_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

        sdk_packages=($(find . -maxdepth 1 -mindepth 1 -type d -exec basename {} \;))
        echo "Found SDK packages: ${sdk_packages[*]}"

        # Each sibling's OWN published name, resolved once up front. Never
        # "@dotcms/<directory>": libs/sdk/cli publishes as the UNSCOPED `dotcms`, so a
        # hardcoded scope can never match it and would silently leave a literal "latest" in
        # a published manifest — Defect B1 all over again. Same reason the publish step
        # below reads .name rather than assuming the scope.
        sdk_package_names=()
        for dep in "${sdk_packages[@]}"; do
          sdk_package_names+=("$(jq -r '.name' "$dep/package.json" 2>/dev/null || echo "@dotcms/$dep")")
        done
        echo "Resolved SDK package names: ${sdk_package_names[*]}"

        for sdk in "${sdk_packages[@]}"; do
          pkg="$sdk/package.json"
          if [ -f "$pkg" ]; then
            jq --arg v "$RELEASE_VERSION" '.version = $v' "$pkg" > tmp.$$.json && mv tmp.$$.json "$pkg"
            echo "  ✅ $sdk -> $RELEASE_VERSION"

            # Update dependencies/peerDependencies/devDependencies that reference other SDK
            # packages. Pinned exact (no caret): sibling SDK packages always publish in
            # lockstep at the same version, so a range only reintroduces the ambiguity
            # ADR-0019 removes. devDependencies is included so @dotcms/types (a dev-only
            # dependency in every SDK lib) no longer ships with an unmasked "latest".
            for dep_name in "${sdk_package_names[@]}"; do
              for field in dependencies peerDependencies devDependencies; do
                if jq -e ".${field}[\"$dep_name\"]" "$pkg" >/dev/null 2>&1; then
                  jq --arg field "$field" --arg dep "$dep_name" --arg v "$RELEASE_VERSION" \
                    '.[$field][$dep] = $v' "$pkg" > tmp.$$.json && mv tmp.$$.json "$pkg"
                  echo "    ↳ $field $dep_name -> $RELEASE_VERSION"
                fi
              done
            done
          fi
        done

        # Update example projects. Exact pin, no caret: a `^` range drifts forward exactly
        # the way Defect B3 did on the LTS branches, and validate-sdk-package-shapes rejects
        # ranges on any non-trunk branch — the release pipeline must never emit a shape its
        # own guardrail would fail.
        if [ -d "$EXAMPLES_PATH" ]; then
          while IFS= read -r pkg_json; do
            for dep_name in "${sdk_package_names[@]}"; do
              if jq -e ".dependencies[\"$dep_name\"]" "$pkg_json" >/dev/null 2>&1; then
                jq --arg dep "$dep_name" --arg v "$RELEASE_VERSION" \
                  '.dependencies[$dep] = $v' "$pkg_json" > tmp.$$.json && mv tmp.$$.json "$pkg_json"
              fi
            done
          done < <(find "$EXAMPLES_PATH" -name "package.json" -not -path "*/node_modules/*")
        fi

        echo "::endgroup::"
      shell: bash

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: core-web/package.json
        run_install: false

    - name: Get pnpm store directory path
      id: pnpm-info
      shell: bash
      run: |
        echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        echo "version=$(pnpm -v)" >> $GITHUB_OUTPUT

    - id: restore-cache-pnpm
      name: Restore pnpm Store Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-info.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ steps.pnpm-info.outputs.version }}-${{ hashFiles('core-web/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ steps.pnpm-info.outputs.version }}
          ${{ runner.os }}-pnpm-

    - name: 'Install project'
      working-directory: ${{ github.workspace }}/core-web/
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        pnpm --version
        node --version
      shell: bash

    - id: save-cache-pnpm
      name: Save pnpm Store Cache
      if: ${{ steps.restore-cache-pnpm.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-info.outputs.dir }}
        key: ${{ steps.restore-cache-pnpm.outputs.cache-primary-key }}

    - name: 'Build SDK packages'
      working-directory: ${{ github.workspace }}/core-web/
      run: |
        set -euo pipefail
        echo "::group::Build SDK packages"
        pnpm exec nx run-many --target=build --projects='sdk-*' --configuration=production --skip-nx-cache
        echo "::endgroup::"
      shell: bash

    - name: 'Publish SDK packages to NPM'
      id: publish_packages
      working-directory: ${{ github.workspace }}/core-web/dist/libs/sdk/
      env:
        # Normalized by the "Update package.json versions" step above — must match exactly
        # what was written into each package.json, not the raw (possibly zero-padded) input.
        RELEASE_VERSION: ${{ steps.update-versions.outputs.normalized_version }}
        NPM_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_TAG: ${{ inputs.npm-tag }}
      run: |
        set -euo pipefail
        echo "::group::Publishing SDK packages"
        echo "Version: $RELEASE_VERSION"
        echo "Tag:     $NPM_TAG"
        echo ""

        echo "//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}" > ~/.npmrc

        PUBLISH_SUCCESS=true

        for sdk in $(find . -maxdepth 1 -mindepth 1 -type d -exec basename {} \;); do
          cd "$sdk"

          # The package's OWN name, never "@dotcms/<directory>".
          #
          # The scope used to be hardcoded here, which silently assumed every SDK is scoped.
          # It held until `dotcms` — the unscoped CLI — where the guard below could never
          # match: the first publish succeeded, then every re-run tried to publish a version
          # that already existed and failed the release step. Reading `.name` makes the guard
          # work for any naming scheme, scoped or not.
          PKG_NAME=$(jq -r '.name' package.json)
          echo "📦 Processing ${PKG_NAME}..."

          # Idempotency: the version is fixed to the dotCMS release tag and can never be
          # bumped, so if a prior (failed/cancelled) run already published this exact
          # version, npm would reject a re-publish with a hard 403 — permanently stalling
          # the release. Treat "already published" as success so a re-run can finish the
          # remaining packages instead of getting stuck.
          if npm view "${PKG_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "  ⏭️  ${PKG_NAME}@${RELEASE_VERSION} already published — skipping (idempotent re-run)"
          else
            echo "  🚀 Publishing: ${PKG_NAME}@${RELEASE_VERSION} (tag: ${NPM_TAG})"
            if npm publish --access public --tag "${NPM_TAG}"; then
              echo "  ✅ Published"
            else
              echo "  ❌ Failed to publish"
              PUBLISH_SUCCESS=false
            fi
          fi

          cd ..
          echo ""
        done

        echo "actual_published=$PUBLISH_SUCCESS" >> $GITHUB_OUTPUT

        if [ "$PUBLISH_SUCCESS" = "true" ]; then
          echo "🎉 All SDK packages published successfully!"
        else
          echo "❌ Some publications failed"
          echo "::endgroup::"
          exit 1
        fi

        echo "::endgroup::"
      shell: bash

    - name: 'Set output'
      id: deployment_status
      if: success()
      env:
        ACTUAL_PUBLISHED: ${{ steps.publish_packages.outputs.actual_published }}
      run: |
        echo "published=$ACTUAL_PUBLISHED" >> $GITHUB_OUTPUT
      shell: bash
