name: 'Link Pull Request to Issue'
on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull Request number'
        type: number
        required: true
      pr_branch:
        description: 'Pull Request branch'
        type: string
        required: true
      validate_merge:
        description: 'Validate merge'
        type: boolean
        required: false
        default: true
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  link-pr-to-issue:
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    steps:
      - run: echo 'GitHub context'
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Link PR to Issue
        id: link_pr_to_issue
        continue-on-error: true
        shell: bash
        run: |
          pr_json=$(\
            gh api \
              --method GET \
              repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
            | jq -c -r \
          )
          
          pr_merged=$(echo "${pr_json}" | jq '.merged')
          [[ "${{ inputs.validate_merge }}" == 'true' && "${pr_merged}" != 'true' ]] && echo "PR [${{ inputs.pr_number }}] is not merged" && exit 1
          echo "pr_merged=${pr_merged}"
          
          pr_branch=${{ inputs.pr_branch }}
          issue_number=
          if [[ ${pr_branch} =~ ^[0-9]+- ]]; then
            issue_number=${pr_branch%%-*}
          elif [[ ${pr_branch} =~ ^issue-[0-9]+- ]]; then
            issue_number=${pr_branch#*-}
            issue_number=${issue_number%%-*}
          fi
          [[ -z "${issue_number}" ]] && echo 'Issue number could not be resolved' && exit 2
          echo "issue_number=${issue_number}"
          
          pr_body=$(echo "${pr_json}" | jq -r '.body')
          [[ "${pr_body}" == 'null' ]] && pr_body=

          # The branch number names no repository. When the body closes issue N of
          # another repository (owner/repo#N or its issue URL, the forms
          # issue_comp_link-issue-to-pr.yml accepts), the branch means that issue: keep
          # the repository, because a bare #N resolves to whatever item in this
          # repository has that number (#37845).
          closing_kw='(close[ds]?|fix(e[ds])?|resolve[ds]?)(:)?[[:space:]]+'
          issue_repo=$(echo "${pr_body}" \
            | grep -oiE "${closing_kw}([a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#|https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/issues/)${issue_number}([^0-9]|\$)" \
            | grep -oiE "[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+(#|/issues/)${issue_number}" \
            | sed -E 's@(#|/[^/]+/)[0-9]+$@@' \
            | grep -vixF "${GITHUB_REPOSITORY}" | head -1) || true

          if [[ -n "${issue_repo}" ]]; then
            # Not looked up here: the token cannot read a private repository.
            issue_ref="${issue_repo}#${issue_number}"
          else
            issue_json=$(\
              gh api \
                --method GET \
                repos/${{ github.repository }}/issues/${issue_number} \
            )
            fetched_issue_number=$(echo "${issue_json}" | jq -r '.number')
            [[ -z "${fetched_issue_number}" ]] && echo "Issue [${issue_number}] could not be resolved" && exit 3
            issue_ref="#${issue_number}"
          fi
          echo "issue_ref=${issue_ref}"

          [[ -n "${pr_body}" ]] && pr_body="${pr_body}"$'\n\n'
          pr_body="${pr_body}This PR fixes: ${issue_ref}"
          echo "pr_body=${pr_body}"
          
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
            -f "body=${pr_body}"
