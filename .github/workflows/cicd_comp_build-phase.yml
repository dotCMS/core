# Build Phase Workflow
#
# This reusable workflow is responsible for performing the core build process,
# including artifact generation, validation, and optional PR checks.
#
# Key features:
# - Configurable core build execution
# - Optional PR checks
# - Supports validation profile
# - Configurable version setting
# - Optional Docker artifact generation
# - Checks for unauthorized modifications to maven.config and working directory

name: Build Phase

on:
  workflow_call:
    inputs:
      core-build:
        description: "Run core build"
        type: boolean
        default: true
      run-pr-checks:
        description: "Run PR checks"
        type: boolean
        default: false
      ref:
        description: "Branch or tag ref"
        required: false
        default: ''
        type: string
      validate:
        description: "Run validation"
        type: boolean
        default: false
      version:
        description: 'The version of the build'
        required: false
        type: string
        default: '1.0.0-SNAPSHOT'
      generate-docker:
        description: 'Generate docker artifact'
        required: false
        type: boolean
        default: true
      # generate-docker produces the deployment context AND a throwaway test
      # image. Test phases need both; release needs only the context. See the
      # matching inputs in core-cicd/maven-job.
      generate-test-image:
        description: 'Build, save and upload the throwaway test image. Only test phases consume it.'
        required: false
        type: boolean
        default: true
      # Off by default: no workflow restores the bundle (restore-classes is used only by
      # deploy-javadoc, which no workflow calls), and the upload cost ~25 s per build.
      generate-build-classes:
        description: 'Upload per-module build classes (consumed only by restore-classes callers).'
        required: false
        type: boolean
        default: false
      java-version:
        description: 'Override Java version (SDKMAN format, e.g., 25.0.1-open)'
        required: false
        type: string
        default: ''
      maven-compiler-release:
        description: 'Override Maven compiler release version (e.g., 21). Preferred over source/target.'
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: 'Artifact suffix without leading separator (e.g., java-25, java-25-ms). Separators added automatically: dash (-) for Maven artifacts, underscore (_) for Docker tags. If not set, derived from java-version major (e.g., java-25).'
        required: false
        type: string
        default: ''
      release-build:
        description: 'Install the Maven coordinates the release phase will publish (applies -Dchangelist for Java variants). Release workflows only.'
        required: false
        type: boolean
        default: false
      # Default true: release, nightly, LTS and sweep callers keep cleaning up.
      # Only the PR, merge-queue and trunk callers pass false (#38203).
      cleanup-runner:
        description: 'Free runner disk space (cleanup-runner action) before the build'
        required: false
        type: boolean
        default: true
    secrets:
      # Remote build cache (S3). Absent secrets simply disable the cache, so any
      # caller that does not pass these -- every release workflow -- builds from
      # scratch exactly as it does today.
      # Untrusted refs must be given the READ-ONLY key pair; see the
      # build-cache-remote action for why.
      build-cache-access-key:
        required: false
      build-cache-secret-key:
        required: false
      build-cache-endpoint:
        required: false
      build-cache-bucket:
        required: false
    outputs:
      # Single source of the resolved suffix. Downstream jobs (deployment,
      # release) consume this rather than re-deriving it from java-version;
      # three independent derivations is how '-java25' and '-java-25' diverged.
      artifact-suffix:
        description: 'Resolved artifact suffix without leading separator (e.g. java-25). Empty for the primary build.'
        value: ${{ jobs.build-jdk11.outputs.artifact-suffix }}

jobs:
  # Initial JDK Build
  # This job performs a basic build and install with Maven without running tests.
  # It provides a local Maven repo for subsequent steps.
  build-jdk11:
    name: "Initial Artifact Build"
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    if: inputs.core-build == true
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-suffix: ${{ steps.maven-build.outputs.artifact-suffix }}
    steps:
      # Checkout code based on whether a specific ref is provided
      # Same depth rule as the ref checkout below (see its comment): depth 2
      # only when the PR-only steps need it.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref == ''
        with:
          fetch-depth: ${{ inputs.run-pr-checks && '2' || '1' }}
      # The ref path builds a tag/branch snapshot; buildnumber-maven-plugin
      # (scmRevision) only reads HEAD, which works on a shallow clone, so we
      # avoid the full fetch (~2k+ branches, ~1.1 GB pack, 364 s on a PR run).
      # Depth is driven by run-pr-checks (NOT ref). The only PR-only step that
      # reads history is the `.mvn/maven.config` guard below, and it needs just
      # the pull request's own diff: pull_request checks out the merge commit
      # (refs/pull/N/merge), whose first parent is the base tip, so depth 2 is
      # enough for HEAD^1..HEAD. The clean-tree check only needs the working
      # tree. This build runs without -Pvalidate, so the Nx `origin/main` base
      # in core-web/pom.xml is never evaluated here.
      # String literals are used deliberately: `inputs.run-pr-checks && 2 || 1`
      # would also work, but keeping the quoted form avoids the 0-is-falsy trap
      # in GH expressions if the depth is ever changed.
      - name: Checkout code with ref ${{ inputs.ref }}
        if: inputs.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.run-pr-checks && '2' || '1' }}

      # Check if .mvn/maven.config is modified in PR (only for PR checks).
      # HEAD is the PR's merge commit, so HEAD^1..HEAD is exactly what the PR
      # changes. Fail closed if HEAD is not a merge commit: HEAD^1 would then
      # be the previous commit and the guard would silently narrow to it.
      - name: Check if .mvn/maven.config is in the PR commit
        if: inputs.run-pr-checks
        run: |
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "Error: expected a pull request merge commit as HEAD, cannot determine the PR diff."
            exit 1
          fi
          if git diff --name-only HEAD^1 HEAD | grep -q '^\.mvn/maven.config$'; then
            echo "Error: .mvn/maven.config should not be modified in PR commits. This should only be set on release branches."
            exit 1
          else
            echo ".mvn/maven.config is not modified in this PR."
          fi

      # Set up validation profile if required
      - name: Set up validate profile
        id: setup-validate-profile
        run: |
          if [ "${{ inputs.validate }}" == "true" ]; then
            echo "VALIDATE_PROFILE=-Pvalidate" >> "$GITHUB_ENV"
          else
            echo "VALIDATE_PROFILE=" >> "$GITHUB_ENV"
          fi

      # Wire the Maven build cache to the shared S3 bucket. Only the merge queue
      # and trunk may write; every other ref reads. Exports BUILD_CACHE_ARGS.
      #
      # Two ways to turn it off without editing this file:
      #   - repo/org variable BUILD_CACHE_DISABLED=true   (global kill switch)
      #   - PR label "CI : No Build Cache"                (one pull request)
      - name: Set up remote build cache
        id: build-cache
        uses: ./.github/actions/core-cicd/build-cache-remote
        with:
          enabled: "${{ vars.BUILD_CACHE_DISABLED != 'true' && !contains(github.event.pull_request.labels.*.name, 'CI : No Build Cache') }}"
          bucket: ${{ secrets.build-cache-bucket }}
          endpoint: ${{ secrets.build-cache-endpoint }}
          access-key: ${{ secrets.build-cache-access-key }}
          secret-key: ${{ secrets.build-cache-secret-key }}
          save: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      # Run the Maven build job
      - id: maven-build
        uses: ./.github/actions/core-cicd/maven-job
        with:
          stage-name: "Initial Artifact Build"
          # No -Dgithub.event.name: its only effect was activating core-web's is_pr profile,
          # which made the PR effective pom differ from trunk's for that module.
          #
          # Pull requests skip the test-only modules and the CLI: each test job rebuilds its
          # own module with -pl, and nothing in a PR run reads them from maven-repo. The merge
          # queue still builds everything, because trunk reuses its maven-repo for the CLI
          # native build and the dotcms-cli deploy. About 1.5 min with a warm ~/.m2, 3.5 min cold.
          maven-args: "clean install ${{ env.VALIDATE_PROFILE }} -Dprod=true -DskipTests=true ${{ github.event_name == 'pull_request' && '-pl !:dotcms-integration,!:dotcms-postman,!:dotcms-reports,!:dotcms-ui-e2e,!:dotcms-test-karate,!:dotcms-api-data-model,!:dotcms-cli' || '' }}"
          generate-artifacts: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cleanup-runner: ${{ inputs.cleanup-runner }}
          version: ${{ inputs.version }}
          generate-docker: ${{ inputs.generate-docker }}
          generate-test-image: ${{ inputs.generate-test-image }}
          generate-build-classes: ${{ inputs.generate-build-classes }}
          java-version: ${{ inputs.java-version }}
          maven-compiler-release: ${{ inputs.maven-compiler-release }}
          artifact-suffix: ${{ inputs.artifact-suffix }}
          release-build: ${{ inputs.release-build }}

      # Tripwire, deliberately in the BUILD job. The release phase validates
      # before publishing Maven, but it runs after the deployment job has already
      # pushed Docker images — so a build that produced the wrong coordinates
      # would ship images and only then block the publish. Nothing is pushed from
      # here, so this is where the check is cheap and total.
      - name: Verify release coordinates were installed
        if: inputs.release-build == true
        shell: bash
        env:
          SUFFIX: ${{ steps.maven-build.outputs.artifact-suffix }}
        run: |
          set -uo pipefail

          revision="$(awk -F= '/^-Drevision=/{print $2; exit}' .mvn/maven.config)"
          if [[ -z "$revision" ]]; then
            echo "::error::no -Drevision= in .mvn/maven.config; release coordinates cannot be trusted"
            exit 1
          fi

          # The published version is <revision>-<suffix>; the suffix is the
          # resolved one, so a Java variant is checked as <revision>-java-25.
          version="$revision"
          if [[ -n "$SUFFIX" ]]; then
            version="${revision}-${SUFFIX}"
          fi

          dir="$HOME/.m2/repository/com/dotcms/dotcms-core/$version"
          if [[ ! -f "$dir/dotcms-core-$version.pom" || ! -f "$dir/dotcms-core-$version.jar" ]]; then
            echo "::error::$version was not installed into the Maven repository; refusing to deploy images for a release that cannot publish its artifacts"
            ls -1 "$HOME/.m2/repository/com/dotcms/dotcms-core/" 2>/dev/null || true
            exit 1
          fi
          # Historical tags keep their standalone SAML pin; only integrated source
          # lineages produce a bundle matching the core release version.
          if [[ -f independent-projects/core-plugins/saml-plugin/pom.xml ]]; then
            dir="$HOME/.m2/repository/com/dotcms/samlbundle/com.dotcms.samlbundle/$version"
            if [[ ! -f "$dir/com.dotcms.samlbundle-$version.pom" || ! -f "$dir/com.dotcms.samlbundle-$version.jar" ]]; then
              echo "::error::SAML $version was not installed; refusing to deploy images with an incomplete release"
              exit 1
            fi
          fi
          echo "Release coordinates present: $version"

      # Record who produced each cache entry. Nothing in an S3 bucket says which
      # ref wrote a given hash, which is half of what makes a shared build cache
      # a supply-chain risk (CVE-2025-36852). Written first-writer-wins, so an
      # entry keeps the identity of the build that actually created it.
      - name: Record build-cache provenance
        if: env.BUILD_CACHE_SAVE == 'true' && success()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.build-cache-access-key }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.build-cache-secret-key }}
          ENDPOINT: ${{ secrets.build-cache-endpoint }}
          BUCKET: ${{ secrets.build-cache-bucket }}
        run: |
          set -uo pipefail
          root="$HOME/.m2/build-cache"
          [[ -d "$root" ]] || exit 0
          cat > /tmp/provenance.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "workflow_ref": "${{ github.workflow_ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          count=0
          # A '<hash>/local' directory means this run built that module itself.
          while IFS= read -r dir; do
            rel="${dir#"$root"/}"
            key="maven-build-cache/${rel%/local}/provenance.json"
            aws --endpoint-url "$ENDPOINT" s3api head-object \
              --bucket "$BUCKET" --key "$key" >/dev/null 2>&1 && continue
            aws --endpoint-url "$ENDPOINT" s3 cp /tmp/provenance.json \
              "s3://$BUCKET/$key" --only-show-errors && count=$((count+1))
          done < <(find "$root" -mindepth 5 -maxdepth 5 -type d -name local)
          echo "Recorded provenance for $count cache entries."

      # Check for unauthorized changes to the working directory (only for PR checks)
      - name: Check for changes to source during build
        if: inputs.run-pr-checks
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: There are uncommitted changes in the working directory. These may have been modified by the build process. Go back and run a full build before committing changes, or add these files to .gitignore if not required to be stored in the source to ensure the build is clean."
            git status --porcelain
            exit 1
          else
            echo "No uncommitted changes found."
          fi