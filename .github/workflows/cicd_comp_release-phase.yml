# Release Phase Workflow
#
# This reusable workflow handles release-specific finalization operations:
# - Publishing Maven artifacts to the BunnyCDN S3-compatible repository
# - Generating and uploading Javadocs to S3
# - Triggering plugin repository updates
# - Generating and uploading SBOM (Software Bill of Materials)
# - Updating GitHub issue labels for release tracking
#
# This phase runs after the standard deployment phase (which handles Docker/NPM)
# and focuses on release-specific operations.
#
# Key features:
# - Configurable release operations (artifacts, javadocs, plugins, labels)
# - Java variant support: creates different Maven versions via runtime -Dchangelist override
# - SBOM generation and GitHub release asset upload
# - GitHub issue label management for release tracking
# - AWS S3 integration for javadoc hosting
# - Conditional operations: javadocs, plugins, labels, SBOM only run for primary release

name: Release Phase

on:
  workflow_call:
    inputs:
      release_version:
        description: 'Release version'
        required: true
        type: string
      release_tag:
        description: 'Release tag'
        required: true
        type: string
      artifact_run_id:
        description: 'Artifact run ID'
        required: false
        type: string
        default: ${{ github.run_id }}
      deploy_artifact:
        description: 'Publish Maven artifacts to the S3 repository'
        type: boolean
        default: true
      upload_javadocs:
        description: 'Upload Javadocs to S3'
        type: boolean
        default: true
      update_plugins:
        description: 'Update Plugins'
        type: boolean
        default: true
      update_github_labels:
        description: 'Update GitHub labels'
        type: boolean
        default: true
      java-version:
        description: 'Override Java version (SDKMAN format, e.g., 25.0.1-open)'
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: 'Artifact suffix without leading separator (e.g., java-25, java-25-ms). Separators added automatically: dash (-) for Maven artifacts, underscore (_) for Docker tags. If not set, derived from java-version major (e.g., java-25).'
        required: false
        type: string
        default: ''
      reuse-build-artifacts:
        description: |
          Publish the Maven outputs restored from artifact_run_id instead of
          running a second full reactor install first. The caller must have built
          them with the build phase release-build input, so the restored
          repository already holds release_version (+ any Java variant suffix).
          The restored repository is validated before anything is published, and
          it is cleared before restoring so a warm runner cannot contribute
          artifacts to a release. Default false keeps the legacy
          "rebuild, then publish" behaviour for callers that have not opted in.
        required: false
        type: boolean
        default: false
    secrets:
      MAVEN_BUNNY_RW_USERNAME:
        required: false
        description: 'BunnyCDN storage-zone name (S3 access key id)'
      MAVEN_BUNNY_RW_PASSWORD:
        required: false
        description: 'BunnyCDN storage-zone password (S3 secret key)'
      AWS_ACCESS_KEY_ID:
        required: false
        description: 'AWS access key ID'
      AWS_SECRET_ACCESS_KEY:
        required: false
        description: 'AWS secret access key'
      CI_MACHINE_TOKEN:
        required: false
        description: 'CI machine token for GitHub API operations'

jobs:
  # Publish release artifacts to the S3 repository and upload Javadocs to S3
  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    env:
      AWS_REGION: us-east-1
      JVM_TEST_MAVEN_OPTS: '-e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'
    steps:
      - name: Checkout core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - uses: ./.github/actions/core-cicd/cleanup-runner

      - name: Compute Java Suffix
        id: java-suffix
        shell: bash
        run: |
          # Naming Convention for Java Variants:
          # - User input: suffix without leading separator (e.g., "java-25" or "java-25-ms")
          # - Maven artifacts: use dash separator (e.g., "-java-25")
          # - Docker tags: use underscore separator (e.g., "_java-25")
          #
          # Note: Underscore in Docker tags is non-standard but follows existing dotCMS convention.
          # Docker typically uses dash or no separator, but we use underscore to distinguish from
          # version dashes (e.g., "25.02.16-01_java-25_abc123" vs "25.02.16-01-java-25-abc123").
          # This convention may be revisited in future.
          #
          # Derived form is "java-<major>", matching RELEASE_JAVA_VARIANT_SUFFIX
          # and cicd_comp_deployment-phase.

          # Resolved independently of java-version, exactly as maven-job and
          # cicd_comp_deployment-phase do: an explicit artifact-suffix wins
          # outright, otherwise derive java-<major> from an explicit java-version,
          # otherwise no suffix (a primary release).
          if [ -n "${{ inputs.artifact-suffix }}" ]; then
            RAW_SUFFIX="${{ inputs.artifact-suffix }}"
            echo "Using explicit artifact suffix: ${RAW_SUFFIX}"
          elif [ -n "${{ inputs.java-version }}" ]; then
            JAVA_MAJOR=$(echo "${{ inputs.java-version }}" | grep -oE '^[0-9]+')
            RAW_SUFFIX="java-${JAVA_MAJOR}"
            echo "Using derived artifact suffix: ${RAW_SUFFIX}"
          else
            RAW_SUFFIX=""
          fi

          if [ -n "${RAW_SUFFIX}" ]; then
            # Normalize: strip any leading separators, then add the dash separator
            while [[ "${RAW_SUFFIX}" =~ ^[-_] ]]; do
              RAW_SUFFIX="${RAW_SUFFIX:1}"
            done
            MAVEN_SUFFIX="-${RAW_SUFFIX}"
          else
            MAVEN_SUFFIX=""
          fi

          echo "Raw suffix: '${RAW_SUFFIX}'"
          echo "Maven suffix: '${MAVEN_SUFFIX}'"
          echo "suffix=${MAVEN_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "raw_suffix=${RAW_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        id: setup-java
        uses: ./.github/actions/core-cicd/setup-java
        with:
          java-version: ${{ inputs.java-version }}

      # In reuse mode the restored repository IS the publication source, so start
      # from an empty directory: a warm runner or a half-populated cache must not
      # be able to contribute artifacts to a release. Without reuse, the install
      # below overwrites whatever is here and this is unnecessary.
      - name: Prepare Maven Repository
        if: inputs.reuse-build-artifacts == true
        shell: bash
        run: rm -rf "$HOME/.m2/repository"

      - name: Restore Maven Repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          # Pinned to the selected run rather than implicitly to this one, so the
          # source of the published artifacts is always explicit.
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: maven-repo${{ steps.java-suffix.outputs.suffix }}
          path: ~/.m2/repository

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        if: inputs.upload_javadocs == true

      # Publish locally (install) instead of deploying. The maven-deploy-plugin
      # no longer has an Artifactory target; the S3 publish step below uploads the
      # artifacts from ~/.m2/repository, preserving the Maven layout.
      #
      # Skipped in reuse mode: the build phase already installed these
      # coordinates (release-build applies the changelist), so this second full
      # reactor build is what made the release slow. See #37607.
      - name: Install Release Artifacts
        if: inputs.deploy_artifact == true && !inputs.reuse-build-artifacts
        run: |
          # Add changelist suffix for alternate Java versions
          CHANGELIST_ARG=""
          if [ -n "${{ steps.java-suffix.outputs.suffix }}" ]; then
            CHANGELIST_ARG="-Dchangelist=${{ steps.java-suffix.outputs.suffix }}"
            echo "Adding changelist suffix: ${{ steps.java-suffix.outputs.suffix }}"
          fi

          # shellcheck disable=SC2086
          # Reason: JVM_TEST_MAVEN_OPTS and CHANGELIST_ARG must be word-split to pass multiple Maven arguments
          ./mvnw -ntp \
            ${JVM_TEST_MAVEN_OPTS} \
            -Dprod=true \
            -DskipTests=true \
            ${CHANGELIST_ARG} \
            install

      # Fail closed BEFORE publishing, and AFTER Install: in legacy mode it is
      # Install's `-Dchangelist` that creates the suffixed coordinates, so
      # validating any earlier would reject every Java-variant release. In reuse
      # mode the build already installed them and Install is skipped.
      #
      # `publish.sh maven` publishes whatever versions it finds under com/dotcms
      # and exits 0 when it finds none, so without this a partial maven-repo
      # would "succeed" by publishing an incomplete release - and would have
      # already rewritten the shared maven-metadata.xml.
      - name: Validate Release Artifacts
        id: validate-release-artifacts
        if: inputs.deploy_artifact == true
        shell: bash
        env:
          VERSION: ${{ inputs.release_version }}${{ steps.java-suffix.outputs.suffix }}
          # The built-in coordinates below are always required; the repo variable
          # only ADDS to them, so it cannot weaken the guard. Space or comma
          # separated groupId:artifactId.
          REQUIRED_COORDINATES: com.dotcms:dotcms-core com.dotcms:dotcms-core-web ${{ vars.RELEASE_REQUIRED_COORDINATES }}
        run: |
          set -uo pipefail

          repo="${MAVEN_REPO:-$HOME/.m2/repository}"
          version="${VERSION:?VERSION is required}"
          # dotcms-core packages a jar and dotcms-core-web a war; a release
          # shipping one without the other is partial.
          coords="${REQUIRED_COORDINATES:-com.dotcms:dotcms-core com.dotcms:dotcms-core-web}"
          coords="${coords//,/ }"

          rc=0
          for coord in $coords; do
            group="${coord%%:*}"
            artifact="${coord##*:}"
            if [[ "$coord" != *:* || -z "$group" || -z "$artifact" ]]; then
              echo "::error::'$coord' is not groupId:artifactId"
              rc=1
              continue
            fi
            group_path="$(printf '%s' "$group" | tr '.' '/')"
            dir="$repo/$group_path/$artifact/$version"

            if [[ ! -d "$dir" ]]; then
              echo "::error::$coord has no $version directory at $dir"
              rc=1
              continue
            fi
            # Match the exact primary artifact. A pom alone means the module
            # installed but its archive did not, and a -sources.jar or
            # -javadoc.jar must not stand in for the real archive.
            if [[ ! -f "$dir/$artifact-$version.pom" ]]; then
              echo "::error::$coord: no $artifact-$version.pom in $dir"
              rc=1
              continue
            fi
            if [[ ! -f "$dir/$artifact-$version.jar" && ! -f "$dir/$artifact-$version.war" ]]; then
              echo "::error::$coord: no $artifact-$version.jar or .war in $dir"
              rc=1
            fi
          done

          if [[ $rc -ne 0 ]]; then
            echo "::error::refusing to publish $version: the Maven repository is incomplete"
            exit 1
          fi
          echo "Validated release artifacts for $version in $repo"

      - name: Publish Release Artifacts to S3
        if: inputs.deploy_artifact == true
        env:
          MAVEN_BUNNY_RW_USERNAME: ${{ secrets.MAVEN_BUNNY_RW_USERNAME }}
          MAVEN_BUNNY_RW_PASSWORD: ${{ secrets.MAVEN_BUNNY_RW_PASSWORD }}
          MAVEN_S3_ENDPOINT: ${{ vars.MAVEN_S3_ENDPOINT }}
          MAVEN_S3_REGION: ${{ vars.MAVEN_S3_REGION }}
          MAVEN_S3_BUCKET: ${{ vars.MAVEN_S3_BUCKET }}
          MAVEN_S3_PREFIX: ${{ vars.MAVEN_S3_PREFIX }}
          # Alternate Java variants append their changelist (e.g. -java-25) to the version.
          VERSION: ${{ inputs.release_version }}${{ steps.java-suffix.outputs.suffix }}
        run: |
          echo "::group::Publish Release Artifacts to S3"
          ./.github/scripts/publish-to-s3/publish.sh maven --version "$VERSION"
          echo "::endgroup::"

      - name: Generate and Upload Javadocs
        run: |
          # shellcheck disable=SC2086
          # Reason: JVM_TEST_MAVEN_OPTS must be word-split to pass multiple Maven arguments
          ./mvnw -ntp \
            ${JVM_TEST_MAVEN_OPTS} \
            javadoc:javadoc \
            -pl :dotcms-core
          rc=$?
          if [[ $rc != 0 ]]; then
            echo "Javadoc generation failed with exit code $rc"
            exit $rc
          fi

          site_dir=./dotCMS/target/site
          javadoc_dir=${site_dir}/javadocs
          s3_uri=s3://static.dotcms.com/docs/${{ inputs.release_version }}${{ steps.java-suffix.outputs.suffix }}/javadocs

          mv ${site_dir}/apidocs ${javadoc_dir}
          echo "Running: aws s3 cp ${javadoc_dir} ${s3_uri} --recursive"
          aws s3 cp ${javadoc_dir} ${s3_uri} --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        if: inputs.upload_javadocs == true && inputs.java-version == ''

      - name: Trigger Plugin Repository Update
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CI_MACHINE_TOKEN: ${{ secrets.CI_MACHINE_TOKEN }}
        run: |
          # shellcheck disable=SC2153
          release_version="${RELEASE_VERSION}"
          response=$(curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CI_MACHINE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dotcms-community/plugin-examples/dispatches \
            -d "{\"event_type\": \"on-plugins-release\", \"client_payload\": {\"release_version\": \"${release_version}\"}}" \
            -w "\n%{http_code}" \
            -s)
          http_code=$(echo "$response" | tail -n1)
          if [ "${http_code}" != "204" ]; then
            echo "Failed to dispatch workflow. HTTP code: $http_code"
            echo "Response: $response"
          fi
        if: inputs.update_plugins == true && inputs.java-version == ''

  # Generate and upload SBOM to GitHub release
  # Only run for primary release (not Java variants) since SBOM is based on Docker image
  # and should represent the primary release artifact
  release-sbom:
    name: Release SBOM
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    if: inputs.java-version == ''
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/legacy-release/sbom-generator
        id: sbom-generator
        with:
          dotcms_version: ${{ inputs.release_version }}
          github_token: ${{ secrets.CI_MACHINE_TOKEN }}

      - name: Download SBOM Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          path: ${{ github.workspace }}/artifacts
          pattern: ${{ steps.sbom-generator.outputs.sbom-artifact }}

      - name: Upload SBOM to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_MACHINE_TOKEN }}
        run: |
          echo "::group::Upload SBOM Asset"
          ARTIFACT_NAME=${{ steps.sbom-generator.outputs.sbom-artifact }}
          SBOM="./artifacts/${ARTIFACT_NAME}/${ARTIFACT_NAME}.json"

          if [ -f "${SBOM}" ]; then
            echo "SBOM: ${SBOM}"
            cat "${SBOM}"

            zip "${ARTIFACT_NAME}.zip" "${SBOM}"
            gh release upload "${{ inputs.release_tag }}" "${ARTIFACT_NAME}.zip"
          else
            echo "SBOM artifact not found."
          fi
          echo "::endgroup::"

  # Update GitHub labels for release tracking
  # Only updates labels if release-artifacts (S3/Javadocs) succeeded.
  # The calling workflow's dependency chain ensures deployment also succeeded.
  release-labeling:
    name: Release Labeling
    needs: [ release-artifacts ]
    if: success() && inputs.update_github_labels == true && inputs.java-version == ''
    uses: ./.github/workflows/issue_comp_release-labeling.yml
    with:
      new_label: 'Release : ${{ inputs.release_version }}'
      rename_label: 'Next Release'
    secrets:
      CI_MACHINE_TOKEN: ${{ secrets.CI_MACHINE_TOKEN }}
