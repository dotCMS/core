name: evergreen-tracks-admin

# The run title carries the mode, so a dry-run is distinguishable from a real
# mutation in the Actions list and at the top of the run page — not just buried
# in the step log. A dry-run that was meant to apply has been mistaken for a
# completed taint before (2026-08-31, run 33434507975).
run-name: >-
  ${{ inputs.mode == 'apply' && 'APPLY' || 'DRY-RUN (no changes)' }}
  — ${{ inputs.action }}${{ inputs.track && format(' {0}', inputs.track) || '' }}${{ inputs.version && format(' {0}', inputs.version) || '' }}

on:
  workflow_dispatch:
    inputs:
      # FIRST input deliberately: the dispatch form renders inputs in declaration
      # order, and this one was previously last — under five other fields, as a
      # free-text box pre-filled with the word "false", which is easy to skim past.
      # A choice dropdown spelling out "dry-run" forces a deliberate pick.
      mode:
        description: 'Mode — dry-run prints the plan and changes NOTHING; apply mutates tags'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, apply]
      repo:
        description: 'Docker repo to operate on'
        required: true
        default: 'dotcms/dotcms'
      action:
        description: 'taint | untaint | hold | release-hold'
        required: true
        type: choice
        options: [taint, untaint, hold, release-hold]
      version:
        description: 'GA version (for taint/untaint/hold)'
        required: false
        default: ''
      track:
        description: 'Track (for hold/release-hold): latest|standard|trailing'
        required: false
        default: ''
      # Only consulted by `hold`; inert on taint/untaint/release-hold. Lifts the guard
      # against pinning a track to a KNOWN-BAD release, and a held track bypasses the
      # planner, so promote actively re-pins it there until release-hold. See RUNBOOK.
      force:
        description: 'hold only — pin onto a TAINTED version (last resort, see RUNBOOK)'
        required: false
        type: boolean
        default: false

jobs:
  admin:
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    permissions:
      contents: write  # github.token needs it for `gh release edit` (taint title)
    # Share the registry-mutation lock with the promote workflows so an admin
    # taint/hold can never overlap a promote run on the same tags. Job level (not
    # workflow level) so the site-sync job below never holds the lock.
    concurrency:
      group: evergreen-tracks-registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Run admin action
        working-directory: .github/actions/core-cicd/evergreen-tracks
        env:
          # Scope Docker Hub creds to this step only (the CLI's untaint/release-hold
          # delete calls read them); other steps/actions don't need them.
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          REPO: ${{ inputs.repo }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
          FORCE: ${{ inputs.force }}
          MODE: ${{ inputs.mode }}
        run: |
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="$EXTRA --force"; fi
          if [ "$MODE" = "apply" ]; then
            EXTRA="$EXTRA --apply"
          else
            echo "::notice::DRY-RUN — printing the plan only. Nothing in the registry will change. Re-dispatch with mode=apply to make it real."
          fi
          uv run evergreen-tracks admin \
            --repo "$REPO" \
            --action "$ACTION" \
            --version "$VERSION" \
            --track "$TRACK" \
            $EXTRA
      - name: Retitle GitHub Release
        id: title
        if: (inputs.action == 'taint' || inputs.action == 'untaint') && inputs.repo == 'dotcms/dotcms'
        continue-on-error: true
        working-directory: .github/actions/core-cicd/evergreen-tracks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ACTION: ${{ inputs.action }}
          MODE: ${{ inputs.mode }}
        run: |
          OLD=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          if [ -z "$OLD" ]; then echo "::error::empty title for v$VERSION"; exit 1; fi
          NEW=$(uv run evergreen-tracks release-title --action "$ACTION" --title "$OLD")
          if [ "$OLD" = "$NEW" ]; then
            echo "title unchanged: '$OLD'"
          elif [ "$MODE" != "apply" ]; then
            echo "DRY-RUN would retitle v$VERSION: '$OLD' -> '$NEW'"
          else
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "$NEW"
          fi
      - name: Notify title failure
        if: steps.title.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/core-cicd/notification/notify-slack
        with:
          channel-id: 'CE1TBQU00'  # #dot-releases
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: >-
            :warning: *Evergreen ${{ inputs.action }} of ${{ inputs.version }}: GitHub Release title NOT updated.*
            The registry ${{ inputs.action }} DID apply; only the GitHub Release title failed to change.
            Fix it by hand or re-run this workflow.
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>

  # Reconcile the corpsites EvergreenState record. Outside the registry lock (job-level
  # above) so it never blocks the next mutation. A dry-run previews via --as-if-*.
  site-sync:
    needs: [ admin ]
    if: >-
      always()
      && inputs.repo == 'dotcms/dotcms'
      && (needs.admin.result == 'success' || needs.admin.result == 'failure')
    uses: ./.github/workflows/cicd_comp_evergreen-site-sync.yml
    with:
      trigger: evergreen-tracks-admin ${{ inputs.action }} ${{ inputs.track }} ${{ inputs.version }}
      apply: ${{ inputs.mode == 'apply' }}
      as_if_action: ${{ inputs.mode != 'apply' && inputs.action || '' }}
      as_if_version: ${{ inputs.mode != 'apply' && inputs.version || '' }}
      as_if_track: ${{ inputs.mode != 'apply' && inputs.track || '' }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOTCMS_DEVSITE_RELEASENOTES_TOKEN: ${{ secrets.DOTCMS_DEVSITE_RELEASENOTES_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
