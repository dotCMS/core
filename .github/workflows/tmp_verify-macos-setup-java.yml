# ⚠️ TEMPORARY — DO NOT MERGE ⚠️
#
# Test scaffolding for issue #37650 (macOS CLI native build fails: Homebrew no longer
# ships a bash bottle for our runner platforms).
#
# Why this exists: `cicd_comp_cli-native-build-phase.yml` is `workflow_call`-only, so the
# failing job never runs on a pull request. Without this workflow there is no way to observe
# the Red state before the fix or the Green state after it, which Constitution Principle V
# requires.
#
# Expected results:
#   BEFORE the fix — both legs FAIL in `Install Bash 4+ (macOS)` with `bash: no bottle available!`
#   AFTER  the fix — both legs PASS, with no Homebrew invocation anywhere in the job
#
# This file is deleted before PR 2 (task T015). If you are reading it on `main`, it escaped.

name: TMP Verify macOS setup-java (#37650)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 'setup-java on ${{ matrix.label }}'
    # fail-fast disabled on purpose: the defect affects both architectures, and cancelling
    # one leg because the other failed is exactly what hides that in the real pipeline.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-Silicon
            arch: arm64
          - os: macos-15-intel
            label: macOS-Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report runner baseline
        shell: bash
        run: |
          echo "runner os       : $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "architecture    : $(uname -m)  (expected: ${{ matrix.arch }})"
          echo "system bash     : $(/bin/bash --version | head -1)"
          echo "shell bash      : ${BASH_VERSION}"
          echo "homebrew bash   : $([ -x "$(brew --prefix 2>/dev/null)/bin/bash" ] && echo present || echo absent)"

      # The action under test. This is the step expected to fail before the fix.
      - name: Setup Java (action under test)
        uses: ./.github/actions/core-cicd/setup-java
        with:
          require-graalvm: 'true'

      - name: 'AC-001 — JDK and GraalVM resolve'
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME    = ${JAVA_HOME:-<unset>}"
          echo "GRAALVM_HOME = ${GRAALVM_HOME:-<unset>}"

          echo "--- java -version ---"
          java -version

          # `.sdkmanrc` pins a Microsoft JDK, so `sdk default` points at that and GraalVM is
          # NOT on PATH. native-image lives under GRAALVM_HOME — assert it there, not on PATH.
          if [ -z "${GRAALVM_HOME:-}" ]; then
            echo "::error::GRAALVM_HOME is unset after setup-java with require-graalvm: true"
            exit 1
          fi

          echo "--- native-image --version ---"
          "${GRAALVM_HOME}/bin/native-image" --version

      - name: 'AC-002 — no Homebrew dependency'
        shell: bash
        run: |
          set -euo pipefail

          # The whole point of the fix: provisioning must not depend on Homebrew. The runner
          # images ship no Homebrew bash, so its presence here means something installed it.
          BREW_BASH="$(brew --prefix 2>/dev/null)/bin/bash"
          if [ -x "$BREW_BASH" ]; then
            echo "::error::Homebrew bash found at ${BREW_BASH} — setup-java still depends on brew"
            exit 1
          fi
          echo "OK: no Homebrew bash present; SDKMAN was installed with the system bash"
          echo "Also confirm by eye in the job log: no 'Downloading Homebrew API data' output."

      - name: 'AC-003 — SDKMAN install cache was populated'
        shell: bash
        run: |
          set -euo pipefail

          # Proves the self-perpetuating failure loop is broken: a successful run must leave a
          # complete installation behind for `Save Cache SDKMan install` to persist.
          for f in bin/sdkman-init.sh var/version var/platform; do
            if [ ! -e "$HOME/.sdkman/$f" ]; then
              echo "::error::missing \$HOME/.sdkman/$f — SDKMAN install is incomplete"
              exit 1
            fi
          done
          echo "sdkman version : $(cat "$HOME/.sdkman/var/version")"
          echo "sdkman platform: $(cat "$HOME/.sdkman/var/platform")"
          echo "OK: installation tree complete."
          echo "Confirm in the log that 'Save Cache SDKMan install' RAN (cold) or that"
          echo "'Cache restored from key' appeared (warm, second dispatch — task T010)."
