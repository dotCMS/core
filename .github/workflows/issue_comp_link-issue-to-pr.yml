name: Link issue to PR

on:
  workflow_call:
    inputs:
      pr_branch:
        description: 'PR branch name'
        required: true
        type: string
      pr_url:
        description: 'PR URL'
        required: true
        type: string
      pr_title:
        description: 'PR title'
        required: true
        type: string
      pr_body:
        description: 'PR body'
        required: true
        type: string
      pr_author:
        description: 'PR author'
        required: true
        type: string
      pr_merged:
        description: 'PR merged status'
        required: true
        type: string
jobs:
  link-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ inputs.pr_branch }}
      PR_URL: ${{ inputs.pr_url }}
      PR_TITLE: ${{ inputs.pr_title }}
      PR_BODY: ${{ inputs.pr_body }}
      PR_AUTHOR: ${{ inputs.pr_author }}
      PR_MERGED: ${{ inputs.pr_merged }}

    steps:
      - name: Debug workflow inputs
        run: |
          echo "PR Branch: $PR_BRANCH"
          echo "PR URL: $PR_URL"
          echo "PR Title: $PR_TITLE"
          echo "PR Body: $PR_BODY"
          echo "PR Author: $PR_AUTHOR"
          echo "PR Merged: $PR_MERGED"

      - name: Check if PR already has linked issues
        id: check_existing_issues
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')

          # Get PR details
          pr_details=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$pr_number")

          # Check for issues linked via GitHub's Development section (timeline events).
          # Paginated: the endpoint defaults to 30 events per page, and on a PR with any
          # review history the "connected" event sits well past that boundary. Missing it
          # made the workflow report a sidebar-linked PR as unlinked — and, once
          # is_closing_link existed, report an issue as surviving the merge when GitHub
          # was going to close it. Seen on #37193, where the event was 33rd of 37.
          gh_err=$(mktemp)
          if connected_events=$(gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/issues/$pr_number/timeline" \
            --jq '.[] | select(.event == "connected") | .source.issue.number' 2>"$gh_err"); then
            connected_issue=$(echo "$connected_events" | head -1)
          else
            echo "::warning::timeline lookup failed; falling back to PR body parsing:"
            cat "$gh_err"
            connected_issue=""
          fi
          rm -f "$gh_err"

          if [[ -n "$connected_issue" && "$connected_issue" != "null" ]]; then
            echo "Found manually linked issue via Development section: $connected_issue"
            echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
            echo "linked_issue_number=$connected_issue" >> "$GITHUB_OUTPUT"
            echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
            echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
            echo "link_method=development_section" >> "$GITHUB_OUTPUT"
            echo "is_closing_link=true" >> "$GITHUB_OUTPUT"
          else
            pr_body=$(echo "$pr_details" | jq -r '.body // ""')

            # ── Same-repo: #NUMBER (checked first — explicit same-repo link always wins) ──
            # Prevents a stray owner/repo#N anywhere in the body from outranking an
            # intentional "Fixes #123" reference.
            linked_issues=$(echo "$pr_body" | grep -oiE \
              '(close[ds]?|fix(e[ds])?|resolve[ds]?)(:)?\s+#([0-9]+)' | grep -oE '[0-9]+' | head -1)

            if [[ -n "$linked_issues" ]]; then
              echo "Found same-repo linked issue in PR body: $linked_issues"
              echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
              echo "linked_issue_number=$linked_issues" >> "$GITHUB_OUTPUT"
              echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
              echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
              echo "link_method=pr_body" >> "$GITHUB_OUTPUT"
              echo "is_closing_link=true" >> "$GITHUB_OUTPUT"

            else
              # ── Cross-repo: owner/repo#NUMBER ───────────────────────────────
              # Matches: "Closes dotCMS/private-issues#642", "Fixes org/repo#10", etc.
              cross_repo_match=$(echo "$pr_body" | grep -oiE \
                '(close[ds]?|fix(e[ds])?|resolve[ds]?)(:)?\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#[0-9]+' | head -1)

              # ── Cross-repo: full GitHub URL ──────────────────────────────────
              # Matches: "Closes https://github.com/dotCMS/private-issues/issues/642"
              cross_url_match=$(echo "$pr_body" | grep -oiE \
                '(close[ds]?|fix(e[ds])?|resolve[ds]?)(:)?\s+https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/issues/[0-9]+' | head -1)

              if [[ -n "$cross_repo_match" ]]; then
                owner_repo_num=$(echo "$cross_repo_match" | grep -oE '[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#[0-9]+')
                cross_owner_repo=$(echo "$owner_repo_num" | cut -d'#' -f1)
                cross_issue_num=$(echo "$owner_repo_num" | cut -d'#' -f2)
                # If owner/repo resolves to this repo, route as same-repo so the
                # PR-list comment and #N body-patch side effects still run.
                if [[ "${cross_owner_repo,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
                  echo "Cross-repo ref resolves to same repo ($cross_owner_repo) — treating as same-repo link"
                  echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                  echo "linked_issue_number=$cross_issue_num" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
                  echo "link_method=pr_body" >> "$GITHUB_OUTPUT"
                  echo "is_closing_link=true" >> "$GITHUB_OUTPUT"
                else
                  echo "Found cross-repo reference: $cross_owner_repo#$cross_issue_num"
                  echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                  echo "linked_issue_number=$cross_issue_num" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=true" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=$cross_owner_repo" >> "$GITHUB_OUTPUT"
                  echo "link_method=cross_repo_body" >> "$GITHUB_OUTPUT"
                  echo "is_closing_link=true" >> "$GITHUB_OUTPUT"
                fi

              elif [[ -n "$cross_url_match" ]]; then
                cross_url=$(echo "$cross_url_match" | grep -oE 'https://github\.com/[^ ]+')
                cross_owner_repo=$(echo "$cross_url" | sed 's|https://github.com/||;s|/issues/.*||')
                cross_issue_num=$(echo "$cross_url" | grep -oE 'issues/[0-9]+' | grep -oE '[0-9]+')
                # Same self-reference check for full URLs
                if [[ "${cross_owner_repo,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
                  echo "Cross-repo URL resolves to same repo ($cross_owner_repo) — treating as same-repo link"
                  echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                  echo "linked_issue_number=$cross_issue_num" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
                  echo "link_method=pr_body" >> "$GITHUB_OUTPUT"
                  echo "is_closing_link=true" >> "$GITHUB_OUTPUT"
                else
                  echo "Found cross-repo URL: $cross_owner_repo#$cross_issue_num"
                  echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                  echo "linked_issue_number=$cross_issue_num" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=true" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=$cross_owner_repo" >> "$GITHUB_OUTPUT"
                  echo "link_method=cross_repo_url" >> "$GITHUB_OUTPUT"
                  echo "is_closing_link=true" >> "$GITHUB_OUTPUT"
                fi

              else
                # ── Non-closing reference: "Refs #N", "Part of org/repo#N", full URL ──
                # A PR can belong to an issue without resolving it: a Spec-Kit PR 1
                # carries the spec for an issue that PR 2 actually answers, and a closing
                # keyword there would retire the issue the moment the spec merges. These
                # forms satisfy the linking requirement but set is_closing_link=false,
                # which suppresses the "This PR fixes: #N" body PATCH further down.
                # Reached only after every closing form above has failed, so an explicit
                # "Fixes #N" always outranks a "Refs #N" elsewhere in the same body.
                ref_kw='(refs?|references?|related to|part of|contributes to)'

                ref_same_repo=$(echo "$pr_body" | grep -oiE \
                  "${ref_kw}(:)?[[:space:]]+#[0-9]+" | grep -oE '[0-9]+' | head -1)
                ref_cross_match=$(echo "$pr_body" | grep -oiE \
                  "${ref_kw}(:)?[[:space:]]+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#[0-9]+" | head -1)
                ref_url_match=$(echo "$pr_body" | grep -oiE \
                  "${ref_kw}(:)?[[:space:]]+https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/issues/[0-9]+" | head -1)

                if [[ -n "$ref_same_repo" ]]; then
                  echo "Found same-repo non-closing reference in PR body: $ref_same_repo"
                  echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                  echo "linked_issue_number=$ref_same_repo" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
                  echo "link_method=pr_body_reference" >> "$GITHUB_OUTPUT"
                  echo "is_closing_link=false" >> "$GITHUB_OUTPUT"

                elif [[ -n "$ref_cross_match" || -n "$ref_url_match" ]]; then
                  if [[ -n "$ref_cross_match" ]]; then
                    ref_owner_repo_num=$(echo "$ref_cross_match" | grep -oE '[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#[0-9]+')
                    ref_owner_repo=$(echo "$ref_owner_repo_num" | cut -d'#' -f1)
                    ref_issue_num=$(echo "$ref_owner_repo_num" | cut -d'#' -f2)
                  else
                    ref_url=$(echo "$ref_url_match" | grep -oE 'https://github\.com/[^ ]+')
                    ref_owner_repo=$(echo "$ref_url" | sed 's|https://github.com/||;s|/issues/.*||')
                    ref_issue_num=$(echo "$ref_url" | grep -oE 'issues/[0-9]+' | grep -oE '[0-9]+')
                  fi

                  # Same self-reference normalisation as the closing paths above.
                  if [[ "${ref_owner_repo,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
                    echo "Non-closing reference resolves to same repo ($ref_owner_repo) — treating as same-repo link"
                    echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                    echo "linked_issue_number=$ref_issue_num" >> "$GITHUB_OUTPUT"
                    echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
                    echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
                    echo "link_method=pr_body_reference" >> "$GITHUB_OUTPUT"
                  else
                    echo "Found cross-repo non-closing reference: $ref_owner_repo#$ref_issue_num"
                    echo "has_linked_issues=true" >> "$GITHUB_OUTPUT"
                    echo "linked_issue_number=$ref_issue_num" >> "$GITHUB_OUTPUT"
                    echo "is_cross_repo=true" >> "$GITHUB_OUTPUT"
                    echo "cross_repo_owner_repo=$ref_owner_repo" >> "$GITHUB_OUTPUT"
                    echo "link_method=cross_repo_reference" >> "$GITHUB_OUTPUT"
                  fi
                  echo "is_closing_link=false" >> "$GITHUB_OUTPUT"

                else
                  echo "No linked issues found in Development section or PR body"
                  echo "has_linked_issues=false" >> "$GITHUB_OUTPUT"
                  echo "is_cross_repo=false" >> "$GITHUB_OUTPUT"
                  echo "cross_repo_owner_repo=" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          fi

      - name: Extract issue number from branch name
        id: extract_issue_number
        run: |
          branch_name="$PR_BRANCH"
          issue_number=""

          # Try multiple patterns to extract issue number (more flexible but specific)
          # The leading (^|/) also covers worktree-style branches, where the issue number
          # follows a namespace segment instead of starting the ref — "nicobytes/36850-foo",
          # "oidacra/37132-bar". Those are the dominant layout on this repo and the old
          # ^([0-9]+)- anchor missed every one of them. Digits must directly follow the
          # slash, so "gh-readonly-queue/main/pr-37131-<sha>" still does not match.
          if [[ "$branch_name" =~ (^|/)([0-9]+)- ]]; then
            issue_number="${BASH_REMATCH[2]}"
            echo "Found issue number at start of branch or worktree segment: $issue_number"
          elif [[ "$branch_name" =~ ^issue-([0-9]+)- ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "Found issue number with 'issue-' prefix: $issue_number"
          elif [[ "$branch_name" =~ issue-([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "Found issue number with 'issue-' anywhere in branch: $issue_number"
          else
            echo "No issue number found in branch name: $branch_name"
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Determine final issue number
        id: determine_issue
        env:
          HAS_LINKED_ISSUES: ${{ steps.check_existing_issues.outputs.has_linked_issues }}
          LINKED_ISSUE_NUMBER: ${{ steps.check_existing_issues.outputs.linked_issue_number }}
          LINK_METHOD: ${{ steps.check_existing_issues.outputs.link_method }}
          IS_CROSS_REPO: ${{ steps.check_existing_issues.outputs.is_cross_repo }}
          CROSS_REPO_OWNER_REPO: ${{ steps.check_existing_issues.outputs.cross_repo_owner_repo }}
          IS_CLOSING_LINK: ${{ steps.check_existing_issues.outputs.is_closing_link }}
          BRANCH_ISSUE_NUMBER: ${{ steps.extract_issue_number.outputs.issue_number }}
        run: |
          # Priority:
          #   1) check_existing_issues: timeline (Development section), cross-repo ref, or same-repo keyword
          #   2) closingIssuesReferences GraphQL: GitHub's own parser, catches markdown-linked refs
          #      the regex misses (e.g. "fixes [#123](url)"). This must outrank branch-name
          #      heuristics — author intent in the PR body should win over a branch pattern.
          #   3) Branch name extraction: heuristic of last resort.
          # is_closing_link tells the body-patch step below whether this PR is expected to
          # close the issue on merge. Only a non-closing body reference sets it to false;
          # every other path (keyword, sidebar link, GraphQL, branch name) closes as before.
          is_closing_link=true

          if [[ "$HAS_LINKED_ISSUES" == "true" ]]; then
            final_issue_number="$LINKED_ISSUE_NUMBER"
            link_method="$LINK_METHOD"
            is_closing_link="${IS_CLOSING_LINK:-true}"
            echo "Using linked issue: $final_issue_number (via $link_method, closing=$is_closing_link)"
          else
            pr_number=$(echo "$PR_URL" | grep -o '[0-9]*$')
            closing_issue=""
            if [[ -z "$pr_number" ]]; then
              echo "::warning::Could not extract PR number from PR_URL=$PR_URL; skipping closingIssuesReferences lookup"
            else
              owner="${GITHUB_REPOSITORY%/*}"
              repo="${GITHUB_REPOSITORY#*/}"
              gh_err=$(mktemp)
              closing_issue=$(gh api graphql \
                -F owner="$owner" \
                -F name="$repo" \
                -F num="$pr_number" \
                -f query='query($owner:String!,$name:String!,$num:Int!){repository(owner:$owner,name:$name){pullRequest(number:$num){closingIssuesReferences(first:1){nodes{number}}}}}' \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // ""' 2>"$gh_err") || {
                echo "::warning::closingIssuesReferences GraphQL lookup failed:"
                cat "$gh_err"
                closing_issue=""
              }
              rm -f "$gh_err"
            fi

            if [[ -n "$closing_issue" && "$closing_issue" != "null" ]]; then
              final_issue_number="$closing_issue"
              echo "Using issue from GitHub closingIssuesReferences (PR body / sidebar link): $final_issue_number"
            elif [[ -n "$BRANCH_ISSUE_NUMBER" ]]; then
              final_issue_number="$BRANCH_ISSUE_NUMBER"
              echo "Using issue from branch name: $final_issue_number"
            else
              echo "::error::No issue number found in Development section, PR body, GitHub linked issues, or branch name"
              echo "::error::Please link an issue using one of these methods:"
              echo "::error::1. Link via GitHub UI: Go to PR → Development section → Link issue"
              echo "::error::2. Add 'fixes #123' (same repo), 'fixes org/repo#123' (cross-repo), or a full GitHub issue URL to PR body"
              echo "::error::3. Add 'refs #123' / 'part of #123' if this PR relates to the issue but must NOT close it"
              echo "::error::4. Use branch naming like 'issue-123-feature', '123-feature' or 'user/123-feature'"
              echo "failure_detected=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "final_issue_number=$final_issue_number" >> "$GITHUB_OUTPUT"
          echo "is_closing_link=$is_closing_link" >> "$GITHUB_OUTPUT"
          echo "is_cross_repo=${IS_CROSS_REPO:-false}" >> "$GITHUB_OUTPUT"
          echo "cross_repo_owner_repo=$CROSS_REPO_OWNER_REPO" >> "$GITHUB_OUTPUT"

      # Gates run before any side effects so that a PR whose linked issue is
      # missing required metadata does not get its body patched or have a
      # PR-list comment posted on the issue thread.

      - name: Remove failure comment if issue is now resolved
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')

          # Check for existing failure comment. Best-effort cleanup: a transient API
          # error (5xx/HTML body) must degrade to "no comment found", never fail the
          # merge-gating check by feeding non-JSON to jq (#36610).
          existing_comments=$(curl -sf --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments") || existing_comments="[]"
          echo "$existing_comments" | jq -e . >/dev/null 2>&1 || existing_comments="[]"

          # Find failure comment by looking for the distinctive header
          failure_comment_id=$(echo "$existing_comments" | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("❌ Issue Linking Required"))) | .id' | head -1)

          if [[ -n "$failure_comment_id" && "$failure_comment_id" != "null" ]]; then
            echo "Found existing failure comment: $failure_comment_id"

            # Delete the failure comment since the issue is now resolved
            curl -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/$failure_comment_id"

            echo "Removed failure comment from PR #$pr_number (issue now resolved)"
          else
            echo "No failure comment found to remove"
          fi

      - name: Validate linked issue has team label
        id: validate_issue
        env:
          ISSUE_NUMBER: ${{ steps.determine_issue.outputs.final_issue_number }}
          IS_CROSS_REPO: ${{ steps.determine_issue.outputs.is_cross_repo }}
          CROSS_REPO_OWNER_REPO: ${{ steps.determine_issue.outputs.cross_repo_owner_repo }}
        run: |
          issue_number="$ISSUE_NUMBER"

          if [[ "$IS_CROSS_REPO" == "true" && -n "$CROSS_REPO_OWNER_REPO" ]]; then
            # Cross-repo issue: attempt label fetch; pass regardless of access.
            # Private tracking repos (e.g. dotCMS/private-issues) may be inaccessible
            # to the workflow token — treat that as implicit approval.
            gh_err=$(mktemp)
            if labels=$(gh issue view "$issue_number" --repo "$CROSS_REPO_OWNER_REPO" --json labels --jq '.labels[].name' 2>"$gh_err"); then
              team_label=$(echo "$labels" | grep -E '^Team : ' | head -1)
              if [[ -n "$team_label" ]]; then
                echo "Cross-repo linked issue $CROSS_REPO_OWNER_REPO#$issue_number has team label: $team_label"
              else
                echo "::warning::Cross-repo linked issue $CROSS_REPO_OWNER_REPO#$issue_number has no 'Team : *' label — passing since this is a cross-repo reference"
              fi
            else
              echo "::warning::Could not fetch labels for $CROSS_REPO_OWNER_REPO#$issue_number (private or inaccessible) — skipping team label validation"
            fi
            rm -f "$gh_err"
          else
            # Same-repo issue: full team label validation required.
            # Distinguish API/permission errors from a genuine missing-label result —
            # otherwise a transient 5xx, a deleted issue, or a scope problem would
            # all surface as "no team label" and start a cycle where authors add
            # the label but the next run still fails.
            gh_err=$(mktemp)
            if ! labels=$(gh issue view "$issue_number" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' 2>"$gh_err"); then
              echo "::error::Failed to fetch labels for linked issue #$issue_number:"
              cat "$gh_err"
              rm -f "$gh_err"
              exit 1
            fi
            rm -f "$gh_err"

            team_label=$(echo "$labels" | grep -E '^Team : ' | head -1)

            if [[ -z "$team_label" ]]; then
              echo "::error::Linked issue #$issue_number has no 'Team : *' label"
              echo "::error::Apply a team label (e.g., 'Team : Scout', 'Team : Platform') to the linked issue"
              echo "validation_failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "Linked issue #$issue_number has team label: $team_label"
          fi

      - name: Remove issue-validation failure comment if resolved
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')

          # Best-effort cleanup: transient API errors degrade to "no comment found" (#36610).
          existing_comments=$(curl -sf --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments") || existing_comments="[]"
          echo "$existing_comments" | jq -e . >/dev/null 2>&1 || existing_comments="[]"
          validation_comment_id=$(echo "$existing_comments" | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("❌ Linked Issue Needs Team Label"))) | .id' | head -1)

          if [[ -n "$validation_comment_id" && "$validation_comment_id" != "null" ]]; then
            curl -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/$validation_comment_id"
            echo "Removed issue-validation failure comment from PR #$pr_number (linked issue now has team label)"
          else
            echo "No issue-validation failure comment found to remove"
          fi

      - name: Get existing issue comments
        # Skip for cross-repo issues — we cannot reliably comment on private repos,
        # and the linked issue already tracks the PR via its own references.
        if: steps.determine_issue.outputs.is_cross_repo != 'true'
        id: get_comments
        env:
          ISSUE_NUMBER: ${{ steps.determine_issue.outputs.final_issue_number }}
        run: |
          # Fetch comments and write to temp file to avoid multiline JSON issues in GitHub Actions outputs.
          # A transient API error (5xx/HTML body) degrades to an empty list — downstream
          # then posts a fresh comment instead of updating, rather than failing the
          # merge-gating check on a jq parse error (#36610).
          curl -sf --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
            | jq -c . > /tmp/issue_comments.json \
            || echo "[]" > /tmp/issue_comments.json

          echo "comments_file=/tmp/issue_comments.json" >> "$GITHUB_OUTPUT"

      - name: Check if comment already exists
        if: steps.determine_issue.outputs.is_cross_repo != 'true'
        id: check_comment
        env:
          COMMENTS_FILE: ${{ steps.get_comments.outputs.comments_file }}
        run: |
          comments_file="$COMMENTS_FILE"
          pr_url="$PR_URL"

          # Escape markdown link characters in the user-supplied PR title so an
          # adversarial title like 'Fix bug](https://evil)' can't redirect the bot link.
          escaped_title=$(printf '%s' "$PR_TITLE" | sed -e 's/\\/\\\\/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g')

          # Random heredoc delimiter — prevents collision if user-supplied content
          # (PR titles in previous list entries) contains a literal "EOF" line.
          delim="ghadelimiter_$(openssl rand -hex 16)"

          # Check if our bot comment already exists (read from file instead of env var)
          existing_comment=$(jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("PRs linked to this issue"))) | .id' "$comments_file" | head -1)

          if [[ -n "$existing_comment" && "$existing_comment" != "null" ]]; then
            echo "Found existing comment: $existing_comment"
            echo "existing_comment_id=$existing_comment" >> "$GITHUB_OUTPUT"
          else
            echo "No existing comment found"
            echo "existing_comment_id=" >> "$GITHUB_OUTPUT"
          fi

          # Get existing PR list from the comment if it exists
          if [[ -n "$existing_comment" && "$existing_comment" != "null" ]]; then
            existing_body=$(jq -r --arg id "$existing_comment" '.[] | select(.id == ($id | tonumber)) | .body' "$comments_file")

            # Extract existing PR lines (lines starting with "- [")
            existing_pr_lines=$(echo "$existing_body" | grep "^- \[" | sort -u)

            # Check if current PR is already in the list. Match against the literal
            # markdown-link terminator `($pr_url)` so a URL is not seen as a prefix of
            # another PR's URL (e.g. /pull/10 substring-matching /pull/100), and so
            # regex metacharacters in the URL are not interpreted.
            if echo "$existing_pr_lines" | grep -qF "($pr_url)"; then
              echo "PR already exists in comment, keeping existing list"
              {
                echo "pr_list<<$delim"
                printf "## PRs linked to this issue\n\n%s\n" "$existing_pr_lines"
                echo "$delim"
              } >> "$GITHUB_OUTPUT"
            else
              # Add new PR to the list
              new_pr_line="- [${escaped_title}](${PR_URL}) by @${PR_AUTHOR}"
              if [[ "$PR_MERGED" == "true" ]]; then
                new_pr_line="$new_pr_line ✅"
              fi

              # Combine existing and new PR lines
              all_pr_lines=$(echo -e "$existing_pr_lines\n$new_pr_line" | sort -u)
              new_body=$(printf "## PRs linked to this issue\n\n%s" "$all_pr_lines")
              {
                echo "pr_list<<$delim"
                echo "$new_body"
                echo "$delim"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            # Create new PR list
            new_pr_line="- [${escaped_title}](${PR_URL}) by @${PR_AUTHOR}"
            if [[ "$PR_MERGED" == "true" ]]; then
              new_pr_line="$new_pr_line ✅"
            fi

            new_body=$(printf "## PRs linked to this issue\n\n%s" "$new_pr_line")
            {
              echo "pr_list<<$delim"
              echo "$new_body"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create new comment
        if: steps.determine_issue.outputs.is_cross_repo != 'true' && steps.check_comment.outputs.existing_comment_id == ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.determine_issue.outputs.final_issue_number }}
          body: ${{ steps.check_comment.outputs.pr_list }}

      - name: Update existing comment
        if: steps.determine_issue.outputs.is_cross_repo != 'true' && steps.check_comment.outputs.existing_comment_id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.check_comment.outputs.existing_comment_id }}
          body: ${{ steps.check_comment.outputs.pr_list }}
          # Replace the comment body — the action's default `append` mode tacks the new
          # body onto the old one, causing the "PRs linked to this issue" block to
          # accumulate on every re-run (issue #35794 hit 10 stacked copies).
          edit-mode: replace

      - name: Link PR to issue
        # Skip for cross-repo: the reference already exists in the PR body as owner/repo#N.
        # Adding a bare #N would create a broken same-repo link.
        #
        # Skip for non-closing references too. The author wrote "Refs #N" precisely so the
        # issue survives this PR's merge; patching "This PR fixes: #N" into the body would
        # convert their reference into a closing one behind their back. The PR-list comment
        # on the issue thread still runs, so the link is tracked either way.
        if: steps.determine_issue.outputs.is_cross_repo != 'true' && steps.determine_issue.outputs.is_closing_link != 'false'
        env:
          ISSUE_NUMBER: ${{ steps.determine_issue.outputs.final_issue_number }}
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          issue_number="$ISSUE_NUMBER"

          # Get current PR body
          current_pr=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$pr_number")

          current_body=$(echo "$current_pr" | jq -r '.body // ""')

          # Decide whether the PR already *closes* this issue, not merely whether the
          # number appears somewhere. The previous bare "#N" test treated an incidental
          # prose mention ("reproducing QA's report on #36222") as an existing link and
          # skipped the patch below, so the PR carried no closing reference at all and
          # the issue would not close on merge (#36933).
          already_linked=false

          # GitHub's own parser is authoritative and also catches markdown-linked refs
          # ("fixes [#123](url)") that a regex misses.
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          gh_err=$(mktemp)
          if closing_issues=$(gh api graphql \
              -F owner="$owner" \
              -F name="$repo" \
              -F num="$pr_number" \
              -f query='query($owner:String!,$name:String!,$num:Int!){repository(owner:$owner,name:$name){pullRequest(number:$num){closingIssuesReferences(first:20){nodes{number}}}}}' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' 2>"$gh_err"); then
            if echo "$closing_issues" | grep -qx "$issue_number"; then
              already_linked=true
            fi
          else
            echo "::warning::closingIssuesReferences lookup failed; relying on keyword matching alone:"
            cat "$gh_err"
          fi
          rm -f "$gh_err"

          # Keyword match as well as — not instead of — the API: it covers the window
          # right after our own PATCH, where GraphQL may not yet report the new
          # reference and a second append would duplicate the line. Accepts the same
          # forms as the link detection above: "#N", "owner/repo#N", full issue URL.
          # Word-boundary on the number so #10 does not match #100.
          closing_kw='(close[ds]?|fix(e[ds])?|resolve[ds]?)(:)?[[:space:]]+'
          if echo "$current_body" | grep -qiE "${closing_kw}([a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+)?#${issue_number}([^0-9]|\$)" \
            || echo "$current_body" | grep -qiE "${closing_kw}https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/issues/${issue_number}([^0-9]|\$)"; then
            already_linked=true
          fi

          if [[ "$already_linked" != 'true' ]]; then
            # Add issue reference to PR body
            if [[ -n "$current_body" && "$current_body" != "null" ]]; then
              new_body=$(printf "%s\n\nThis PR fixes: #%s" "$current_body" "$issue_number")
            else
              new_body="This PR fixes: #$issue_number"
            fi

            # Update PR body
            curl -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$pr_number" \
              -d "{\"body\":$(echo "$new_body" | jq -R -s .)}"

            echo "Added issue #$issue_number reference to PR #$pr_number body"
          else
            echo "Issue #$issue_number is already a closing reference on PR #$pr_number"
          fi

      - name: Add failure comment to PR
        if: failure() && steps.determine_issue.outputs.failure_detected == 'true'
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')

          # Skip if a failure comment already exists (avoid duplicates on synchronize/edited re-runs)
          existing_comments=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments")
          existing_failure_id=$(echo "$existing_comments" | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("❌ Issue Linking Required"))) | .id' | head -1)
          if [[ -n "$existing_failure_id" && "$existing_failure_id" != "null" ]]; then
            echo "Failure comment $existing_failure_id already exists on PR #$pr_number; skipping"
            exit 0
          fi

          # Built as an array rather than a printf format string: the previous format
          # carried 21 "%s" for 22 arguments, so bash restarted the format and the closing
          # line rendered out of place. An array has nothing to keep in sync.
          comment_lines=(
            "## ❌ Issue Linking Required"
            ""
            "This PR could not be linked to an issue. **All PRs must be linked to an issue** for tracking purposes."
            ""
            "### How to fix this:"
            ""
            "**Option 1: Add a keyword to the PR body** (Recommended - auto-removes this comment)"
            ""
            "Edit this PR description and add one of these lines."
            ""
            "*Closing links — the issue is closed when this PR merges:*"
            "- \`Fixes #123\` or \`Closes #123\` — same-repo issue"
            "- \`Fixes org/repo#123\` or \`Closes org/repo#123\` — cross-repo or private issue"
            "- \`Closes https://github.com/org/repo/issues/123\` — full GitHub URL"
            "- Other supported keywords: \`fix\`, \`fixed\`, \`close\`, \`closed\`, \`resolve\`, \`resolved\`"
            ""
            "*Non-closing links — the issue stays open after this PR merges:*"
            "- \`Refs #123\` or \`Part of #123\` — use this when the PR advances an issue that a later"
            "  PR actually resolves (e.g. a Spec-Kit PR 1 carrying the spec, where PR 2 does the work)."
            "- Also accepted: \`references\`, \`related to\`, \`contributes to\`, plus the \`org/repo#123\`"
            "  and full-URL forms."
            ""
            "**Option 2: Link via GitHub UI** (Note: won't clear the failed check)"
            ""
            "1. Go to the PR → Development section (right sidebar)"
            "2. Click \"Link issue\" and select an existing issue"
            "3. Push a new commit or re-run the workflow to clear the failed check"
            ""
            "**Option 3: Use branch naming**"
            ""
            "Create a new branch with one of these patterns:"
            "- \`123-feature-description\` (number at start)"
            "- \`user/123-feature-description\` (worktree style: number after the namespace segment)"
            "- \`issue-123-feature-description\` (issue-number at start)"
            "- \`feature-issue-123\` (issue-number anywhere)"
            ""
            "### Why is this required?"
            ""
            "Issue linking ensures proper tracking, documentation, and helps maintain project history. It connects your code changes to the problem they solve."
            ""
            "---"
            "*This comment was automatically generated by the issue linking workflow*"
          )
          comment_body=$(printf '%s\n' "${comment_lines[@]}")

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments" \
            -d "{\"body\":$(echo "$comment_body" | jq -R -s .)}"

          echo "Added failure comment to PR #$pr_number"

      - name: Add issue-validation failure comment to PR
        if: failure() && steps.validate_issue.outputs.validation_failed == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.determine_issue.outputs.final_issue_number }}
        run: |
          pr_url="$PR_URL"
          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          issue_number="$ISSUE_NUMBER"

          # Skip if a validation failure comment already exists
          existing_comments=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments")
          existing_id=$(echo "$existing_comments" | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("❌ Linked Issue Needs Team Label"))) | .id' | head -1)
          if [[ -n "$existing_id" && "$existing_id" != "null" ]]; then
            echo "Validation failure comment $existing_id already exists on PR #$pr_number; skipping"
            exit 0
          fi

          comment_body=$(printf "%s\n\n%s\n\n%s\n%s\n\n%s\n%s" \
            "## ❌ Linked Issue Needs Team Label" \
            "This PR is linked to issue #$issue_number, but that issue has **no \`Team : *\` label**. Every linked issue must be owned by a team for tracking and triage." \
            "### How to fix this:" \
            "Apply a \`Team : *\` label to the linked issue (e.g., \`Team : Scout\`, \`Team : Platform\`, \`Team : Falcon\`, \`Team : Maintenance\`). Then push a new commit or edit the PR description to re-run this check." \
            "---" \
            "*This comment was automatically generated by the issue linking workflow*")

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$pr_number/comments" \
            -d "{\"body\":$(echo "$comment_body" | jq -R -s .)}"

          echo "Added issue-validation failure comment to PR #$pr_number"
