# Reusable: build multi-arch PR images from the docker-build-context artifact
# and push them to dotcms/dotcms-test. Ordinary CI test images stay AMD64-only.
#
# Callers:
#   cicd_1-pr.yml          — needs: build, passes artifact_run_id = github.run_id
#   cicd_publish-pr-test-image.yml (pull_request_target labeled) — omits
#     artifact_run_id, so this workflow discovers the newest docker-build-context
#     artifact for the head SHA.
#
# Tag scheme — branch feat/x on PR #1234 ->
#   dotcms/dotcms-test:pr-1234-feat-x        (mutable)
#   dotcms/dotcms-test:pr-1234-feat-x_<sha7> (immutable)

name: 'Publish PR Test Image (reusable)'

on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      artifact_run_id:
        description: 'Run id holding the docker-build-context artifact; empty = discover by SHA'
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Resolve artifact run and tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          PR: ${{ inputs.pr }}
          RUN_ID_IN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          run_id="${RUN_ID_IN}"
          # Label path has no run id — find the newest run with a non-expired
          # docker-build-context artifact for this exact commit.
          if [ -z "${run_id}" ]; then
            for rid in $(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=50" \
                          --jq '.workflow_runs[].id'); do
              [ "${rid}" = "${GITHUB_RUN_ID}" ] && continue
              if gh api --paginate "repos/${REPO}/actions/runs/${rid}/artifacts" \
                   --jq '.artifacts[] | select(.expired==false) | .name' \
                 | grep -x 'docker-build-context' >/dev/null; then
                run_id="${rid}"; break
              fi
            done
          fi
          if [ -z "${run_id}" ]; then
            echo "No docker-build-context artifact for ${SHA}; nothing to publish yet."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          norm=$(printf '%s' "${BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9._-' '-' \
            | sed -E 's/-+/-/g; s/^[-.]+//; s/[-.]+$//' \
            | cut -c1-100)
          {
            echo "found=true"
            echo "run_id=${run_id}"
            echo "tags<<EOF"
            echo "dotcms/dotcms-test:pr-${PR}-${norm}"
            echo "dotcms/dotcms-test:pr-${PR}-${norm}_${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing pr-${PR}-${norm} from run ${run_id}"

      - name: Download Docker build context
        if: steps.resolve.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: docker-build-context
          path: /tmp/prebuilt
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker build context
        id: context
        if: steps.resolve.outputs.found == 'true'
        run: |
          mkdir -p /tmp/docker-context
          tar -xf /tmp/prebuilt/docker-build.tar -C /tmp/docker-context
          java_version=$(< /tmp/prebuilt/docker-java-version)
          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.resolve.outputs.found == 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Buildx
        if: steps.resolve.outputs.found == 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Docker Hub login
        if: steps.resolve.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        if: steps.resolve.outputs.found == 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: /tmp/docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          build-args: |
            SDKMAN_JAVA_VERSION=${{ steps.context.outputs.java_version }}

      - name: Sticky comment with image tags
        if: steps.resolve.outputs.found == 'true' && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          MARKER='<!-- pr-docker-image-sticky -->'
          {
            echo "${MARKER}"
            echo "### 🐳 PR Docker test image"
            echo ""
            echo "Latest build for commit \`${SHA:0:7}\` pushed to \`dotcms/dotcms-test\`:"
            echo ""
            echo '```bash'
            for t in ${TAGS}; do echo "docker pull ${t}"; done
            echo '```'
          } > body.md

          id=$(gh api -X GET "repos/${REPO}/issues/${PR}/comments" -f per_page=100 \
                --jq "map(select(.body | contains(\"${MARKER}\"))) | .[0].id // empty")
          # gh api has no @file syntax for fields — build the JSON body with jq.
          payload=$(jq -nc --rawfile b body.md '{body: $b}')
          if [ -n "${id}" ]; then
            printf '%s' "${payload}" | gh api -X PATCH "repos/${REPO}/issues/comments/${id}" --input - >/dev/null
            echo "Updated sticky comment ${id}"
          else
            printf '%s' "${payload}" | gh api -X POST "repos/${REPO}/issues/${PR}/comments" --input - >/dev/null
            echo "Created sticky comment"
          fi
