name: '-2 Merge Group Check'
run-name: 'MQ: ${{ github.event.merge_group.head_commit.message }}'
on:
  merge_group:
    types: [ checks_requested ]
    branches: [ main, master ]
# GitHub deletes a merge group's branch when the queue re-forms it but does not cancel its run.
# The key below is the merge-group head commit message. It is identical across re-formations of the
# same PR, so keying on it cancels the orphan while runs for other PRs, which build in parallel,
# are untouched.
#
# INVARIANT: the first line of that message must end in "(#N)". Only that suffix makes the key unique
# per PR. Without it, two PRs that share a title get the same key and cancel each other's LIVE
# groups, which fails the queue. Today the repo's merge settings (merge commit, title PR_TITLE, body
# BLANK) append "(#N)" to every message. Anyone changing those settings must keep it that way.
# The key is evaluated before any job runs, so it cannot reject a bad message; the
# check-queue-key job below only warns when the suffix is missing. See #38143, #38204.
# toJSON keeps a multi-line message on a single escaped line.
concurrency:
  group: mq-${{ toJSON(github.event.merge_group.head_commit.message) }}
  cancel-in-progress: true
jobs:
  # Warn-only guard for the INVARIANT above. It never fails: a failed check would eject a live PR
  # from the queue, and the concurrency key has already been evaluated by the time this runs.
  check-queue-key:
    name: Check Queue Key
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    permissions: {}
    steps:
      - name: Warn if the head commit message lacks a trailing (#N)
        shell: bash
        env:
          # Passed through env, never interpolated into the script, because it is a PR title.
          HEAD_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          set -euo pipefail
          title="${HEAD_MESSAGE%%$'\n'*}"
          title="${title%$'\r'}"
          if [[ "$title" =~ \(#[0-9]+\)[[:space:]]*$ ]]; then
            echo "Concurrency key ends in (#N): ok"
            exit 0
          fi
          echo "::warning title=Merge queue concurrency key lacks (#N)::The head commit message does not end in (#N), so this PR's concurrency key may collide with another PR's and cancel live merge groups. See the header comment in cicd_2-merge-queue.yml and #38204."
          {
            echo "### Merge queue concurrency key lacks a trailing (#N)"
            echo
            echo "The first line of the head commit message must end in \`(#N)\`; it does not. Two PRs sharing this title would cancel each other's live merge groups. Check the repository merge settings (merge_commit_title / merge_commit_message)."
            echo
            echo '```'
            printf '%s\n' "$title"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  initialize:
    name: Initialize
    uses: ./.github/workflows/cicd_comp_initialize-phase.yml
    # Uses path-based filtering to skip integration/postman/karate tests for frontend-only changes
    # See ADR-0013: https://github.com/dotCMS/platform-adrs/pull/53
    with:
      change-detection: 'enabled'
  build:
    name: Merge Group Build
    needs: [ initialize ]
    if: needs.initialize.outputs.found_artifacts == 'false'
    uses: ./.github/workflows/cicd_comp_build-phase.yml
    with:
      cleanup-runner: false
    secrets:
      # Read-write: the merge queue is a trusted ref and is the primary cache
      # populator — its builds are PR-shaped, so what it writes is what the next
      # merge-queue build can reuse.
      build-cache-access-key: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_ACCESS_KEY }}
      build-cache-secret-key: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_SECRET_KEY }}
      build-cache-endpoint: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_ENDPOINT }}
      build-cache-bucket: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_NAME }}
    permissions:
      contents: read
      packages: write
  # Test matrix - decides which test jobs run. It needs no build output, so it runs in
  # parallel with the build instead of sitting between the build and the tests.
  test-matrix:
    name: Merge Group Test Matrix
    needs: [ initialize ]
    uses: ./.github/workflows/cicd_comp_test-matrix.yml
    permissions:
      contents: read
    with:
      skip-runner-cleanup: true
      jvm_unit_test: ${{ fromJSON(needs.initialize.outputs.filters).jvm_unit_test == 'true' }}
      integration: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      postman: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      karate: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      frontend: ${{ fromJSON(needs.initialize.outputs.filters).frontend == 'true' }}
      cli: ${{ fromJSON(needs.initialize.outputs.filters).cli == 'true' || fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      e2e: false
  test:
    name: Merge Group Test
    needs: [ initialize, build, test-matrix ]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/cicd_comp_test-phase.yml
    with:
      matrix: ${{ needs.test-matrix.outputs.matrix }}
      has-tests: ${{ needs.test-matrix.outputs.has-tests }}
      opensearch_phase: ${{ needs.test-matrix.outputs.opensearch_phase }}
    secrets:
      DOTCMS_LICENSE: ${{ secrets.DOTCMS_LICENSE }}
  finalize:
    name: Finalize
    if: always()
    needs: [ test-matrix, test ]
    uses: ./.github/workflows/cicd_comp_finalize-phase.yml
    with:
      needsData: ${{ toJson(needs) }}