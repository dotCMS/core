name: '-2 Merge Group Check'
run-name: 'MQ: ${{ github.event.merge_group.head_commit.message }}'
on:
  merge_group:
    types: [ checks_requested ]
    branches: [ main, master ]
# GitHub deletes a merge group's branch when the queue re-forms it but does not cancel its run.
# The squash message embeds the PR number and is identical across re-formations of the same PR,
# so keying on it cancels the orphan while runs for other PRs, which build in parallel, are untouched.
# toJSON keeps a multi-line message (a PR body folded into the squash) on a single escaped line.
concurrency:
  group: mq-${{ toJSON(github.event.merge_group.head_commit.message) }}
  cancel-in-progress: true
jobs:
  initialize:
    name: Initialize
    uses: ./.github/workflows/cicd_comp_initialize-phase.yml
    # Uses path-based filtering to skip integration/postman/karate tests for frontend-only changes
    # See ADR-0013: https://github.com/dotCMS/platform-adrs/pull/53
    with:
      change-detection: 'enabled'
  build:
    name: Merge Group Build
    needs: [ initialize ]
    if: needs.initialize.outputs.found_artifacts == 'false'
    uses: ./.github/workflows/cicd_comp_build-phase.yml
    with:
      cleanup-runner: false
    secrets:
      # Read-write: the merge queue is a trusted ref and is the primary cache
      # populator — its builds are PR-shaped, so what it writes is what the next
      # merge-queue build can reuse.
      build-cache-access-key: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_ACCESS_KEY }}
      build-cache-secret-key: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_SECRET_KEY }}
      build-cache-endpoint: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_ENDPOINT }}
      build-cache-bucket: ${{ secrets.OVH_S3_BUILD_CACHE_BUCKET_NAME }}
    permissions:
      contents: read
      packages: write
  # Test matrix - decides which test jobs run. It needs no build output, so it runs in
  # parallel with the build instead of sitting between the build and the tests.
  test-matrix:
    name: Merge Group Test Matrix
    needs: [ initialize ]
    uses: ./.github/workflows/cicd_comp_test-matrix.yml
    permissions:
      contents: read
    with:
      skip-runner-cleanup: true
      jvm_unit_test: ${{ fromJSON(needs.initialize.outputs.filters).jvm_unit_test == 'true' }}
      integration: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      postman: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      karate: ${{ fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      frontend: ${{ fromJSON(needs.initialize.outputs.filters).frontend == 'true' }}
      cli: ${{ fromJSON(needs.initialize.outputs.filters).cli == 'true' || fromJSON(needs.initialize.outputs.filters).backend == 'true' }}
      e2e: false
  test:
    name: Merge Group Test
    needs: [ initialize, build, test-matrix ]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/cicd_comp_test-phase.yml
    with:
      matrix: ${{ needs.test-matrix.outputs.matrix }}
      has-tests: ${{ needs.test-matrix.outputs.has-tests }}
      opensearch_phase: ${{ needs.test-matrix.outputs.opensearch_phase }}
    secrets:
      DOTCMS_LICENSE: ${{ secrets.DOTCMS_LICENSE }}
  finalize:
    name: Finalize
    if: always()
    needs: [ test-matrix, test ]
    uses: ./.github/workflows/cicd_comp_finalize-phase.yml
    with:
      needsData: ${{ toJson(needs) }}