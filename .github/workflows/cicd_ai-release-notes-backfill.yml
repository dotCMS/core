#
# AI Release Notes — Backfill / Manual Trigger
#
# Standalone workflow for populating release notes on existing GitHub releases.
# Calls the same reusable component used by the release pipeline.
#
# Use cases:
# - Backfill notes on past releases that were created without descriptions
# - Re-generate notes for a specific release (clear existing notes first)
# - Test the release notes pipeline in isolation
#

name: 'AI Release Notes (Backfill)'
run-name: "Release Notes: ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to generate notes for (e.g., v26.03.13-02)'
        required: true
        type: string
      previous_tag:
        description: 'Previous release tag for diff range (optional — auto-detected if omitted)'
        required: false
        type: string

# Prevent concurrent runs for the same tag
concurrency:
  group: release-notes-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  # The phase's final step is `gh release edit --notes-file`, an unconditional replace on a
  # public release body — it overwrites hand edits and cannot be undone from here.
  # workflow_dispatch is open to every account with write access on this repo, so reviewer
  # approval is the access control. Same pattern as cicd_evergreen-tracks-promote.yml.
  # The environment must carry required_reviewers; GitHub auto-creates it UNPROTECTED on
  # first use if it is missing, which would silently remove this gate.
  gate:
    name: Approve Notes Rewrite
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    environment: release-notes-backfill
    steps:
      - run: |
          echo "Approved: rewrite release notes for ${{ inputs.release_tag }}"
          echo "Previous tag: ${{ inputs.previous_tag || '(auto-detect)' }}"

  release-notes:
    name: Generate Notes
    needs: gate
    uses: ./.github/workflows/cicd_comp_ai-release-notes-phase.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      previous_tag: ${{ inputs.previous_tag }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CI_MACHINE_TOKEN: ${{ secrets.CI_MACHINE_TOKEN }}
