# CICD Reports Workflow
#
# This workflow is responsible for generating and sending reports about the CI/CD process,
# including test results and build status. It's designed to run after the main PR or merge
# group checks have completed.
#
# Key features:
# - Generates test reports from JUnit XML files
# - Aggregates workflow data from previous runs
# - Prepares and sends detailed Slack notifications
# - Can be triggered by completed workflows or called directly
#
# Security Note:
# This workflow is separate from the main PR workflow to enhance security.
# By isolating the reporting logic:
# 1. It limits access to sensitive Slack tokens only to this workflow.
# 2. It prevents potential exposure of secrets in PR builds from forks.
# 3. It allows for more granular permissions and secret management.
# This separation ensures that even if a PR workflow is compromised, 
# it doesn't have access to notification capabilities or sensitive tokens.

name: CICD Reports
run-name: Reports - ${{ github.event.workflow_run.name }}

on:
  workflow_run:
    workflows: ['PR Check','Merge Group Check', "-1 PR Check", "-2 Merge Group Check"]
    types: [completed]
  workflow_call:
    inputs:
      run-id:
        description: 'The run id of the build to report on'
        type: string
        default: "${{ github.run_id }}"
      slack-only-on-failure:
        description: 'Indicates if the slack notification should only be sent on failure'
        type: boolean
        default: true
    secrets:
      SLACK_BOT_TOKEN:
        description: 'Slack Bot Token'
        required: false

permissions:
  checks: write

jobs:
  report:
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    steps:
      # Log GitHub context for debugging
      - name: Log GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      # Checkout the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download workflow data from previous run
      - name: Download Workflow Data
        id: data-download
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          name: 'workflow-data'
          run_id: ${{ github.event.workflow_run.id || inputs.run-id }}
          if_no_artifact_found: warn

      # Download build reports from previous run
      - name: Download build reports
        id: download-artifact
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          name: build-reports-test-.*
          name_is_regexp: true
          path: /tmp/build-reports-test
          run_id: ${{ github.event.workflow_run.id || inputs.run-id }}
          if_no_artifact_found: warn

      # Generate test report
      - uses: phoenix-actions/test-reporting@v14
        id: test-reporter
        if: steps.data-download.outputs.found_artifact == 'true'
        continue-on-error: true
        with:
          output-to: 'checks'
          name: 'Test Report'
          path: '/tmp/build-reports-test/**/target/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true
          list-tests: 'failed'

      # Process workflow data. Tested by .github/workflows/tests/post-workflow-reporting.test.sh,
      # which extracts this step and the next by id, so both must stay free of `${{ }}`
      # expressions; the values they need come in through `env:`.
      - name: Get Workflow Data
        id: workflow-data
        env:
          REPORTER_CONCLUSION: ${{ steps.test-reporter.outputs.conclusion }}
          REPORTER_PASSED: ${{ steps.test-reporter.outputs.passed }}
          REPORTER_FAILED: ${{ steps.test-reporter.outputs.failed }}
          REPORTER_SKIPPED: ${{ steps.test-reporter.outputs.skipped }}
          REPORTER_ELAPSED: ${{ steps.test-reporter.outputs.time }}
          REPORTER_RUN_HTML_URL: ${{ steps.test-reporter.outputs.runHtmlUrl }}
        run: |
          if [[ ! -e "workflow-data.json" ]]
          then
            echo "::warn title=Artifact 'workflow-data' missing::Expected artifact 'workflow-data' does not exist for pull_request event."
          else
            jq . workflow-data.json
            json=$(jq -c '.' workflow-data.json)
            trigger_event_name=$(jq -r '.trigger_event_name // "null"' workflow-data.json)
            status=$(jq -r '.aggregate_status // "null"' workflow-data.json)
            pr_number=$(jq -r '.pr_number // "null"' workflow-data.json)
            pr_author=$(jq -r '.pr_author // "null"' workflow-data.json)
            run_id=$(jq -r '.run_id // "null"' workflow-data.json)
            first_fail_step=$(jq -r '.first_fail_step // "None"' workflow-data.json)
            first_fail_module=$(jq -r '.first_fail_module // "None"' workflow-data.json)
            first_fail_error=$(jq -r '.first_fail_error // "None"' workflow-data.json)
            pr_title=$(jq -r '.pr_title // "null"' workflow-data.json)
            branch=$(jq -r '.branch // "null"' workflow-data.json)
            head_sha=$(jq -r '.head_sha // "null"' workflow-data.json)
            head_author=$(jq -r '.head_author // "null"' workflow-data.json)
            head_name=$(jq -r '.head_name // "null"' workflow-data.json)
            source_repository=$(jq -r '.source_repository // "null"' workflow-data.json)
            action_run_url="https://github.com/$source_repository/actions/runs/$run_id"
            pr_number_url="https://github.com/$source_repository/pull/$pr_number"
            branch_url="https://github.com/$source_repository/tree/$branch"
            commit_id_url="https://github.com/$source_repository/pull/$pr_number/commits/$head_sha"
            test_results_url="https://github.com/$source_repository/pull/${pr_number}/checks"
            if [[ -z "${REPORTER_CONCLUSION}" ]]; then
              test_conclusion="Not Run"
              test_passed=0
              test_failed=0
              test_skipped=0
              test_elapsed=0
            else
              test_conclusion="${REPORTER_CONCLUSION}"
              test_passed="${REPORTER_PASSED}"
              test_failed="${REPORTER_FAILED}"
              test_skipped="${REPORTER_SKIPPED}"
              test_elapsed="${REPORTER_ELAPSED}"
              test_results_url="${REPORTER_RUN_HTML_URL}"
            fi
          
          
            if [[ "$status" == "SUCCESS" ]]; then
              echo "status_icon=✅" >> "$GITHUB_OUTPUT"
            elif [[ "$status" == "CANCELLED" ]]; then
              echo "status_icon=🚫" >> "$GITHUB_OUTPUT"
            else
              echo "status_icon=❌" >> "$GITHUB_OUTPUT"
            fi
          
            if [[ "$trigger_event_name" == "pull_request" ]]; then
              echo "report_type=PR" >> "$GITHUB_OUTPUT"
            elif [[ "$trigger_event_name" == "merge_group" ]]; then
              echo "report_type=Merge Queue" >> "$GITHUB_OUTPUT"
            elif [[ "$trigger_event_name" == "push" ]]; then
              echo "report_type=Branch Merge" >> "$GITHUB_OUTPUT"
            else 
               echo "report_type=$trigger_event_name" >> "$GITHUB_OUTPUT"
            fi
          
            # The failing module's error is Maven output and can span lines, so it goes out in
            # the multi-line form; the delimiter is random so the text can never close it early.
            delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "first_fail_error<<${delimiter}"
              echo "$first_fail_error"
              echo "${delimiter}"
              echo "json=$json"
              echo "trigger_event_name=$trigger_event_name"
              echo "has_json=true"
              echo "status=$status"
              echo "pr_number=$pr_number"
              echo "pr_author=$pr_author"
              echo "run_id=$run_id"
              echo "first_fail_step=$first_fail_step"
              echo "first_fail_module=$first_fail_module"
              echo "pr_title=$pr_title"
              echo "branch=$branch"
              echo "head_sha=$head_sha"
              echo "head_author=$head_author"
              echo "head_name=$head_name"
              echo "source_repository=$source_repository"
              echo "action_run_url=$action_run_url"
              echo "pr_number_url=$pr_number_url"
              echo "branch_url=$branch_url"
              echo "commit_id_url=$commit_id_url"
              echo "test_results_url=$test_results_url"
              echo "test_conclusion=$test_conclusion"
              echo "test_passed=$test_passed"
              echo "test_failed=$test_failed"
              echo "test_skipped=$test_skipped"
              echo "test_elapsed=$test_elapsed"
            } >> "$GITHUB_OUTPUT"
          
          fi
      # Prepare the Slack message payload. The title, branch name, authors and error text are
      # free text from the reported run, so the JSON is built with jq and never by hand.
      - name: Prepare Slack Message Payload
        id: prepare-slack-message
        env:
          STATUS: ${{ steps.workflow-data.outputs.status }}
          STATUS_ICON: ${{ steps.workflow-data.outputs.status_icon }}
          REPORT_TYPE: ${{ steps.workflow-data.outputs.report_type }}
          PR_NUMBER: ${{ steps.workflow-data.outputs.pr_number }}
          PR_TITLE: ${{ steps.workflow-data.outputs.pr_title }}
          PR_AUTHOR: ${{ steps.workflow-data.outputs.pr_author }}
          PR_NUMBER_URL: ${{ steps.workflow-data.outputs.pr_number_url }}
          BRANCH: ${{ steps.workflow-data.outputs.branch }}
          BRANCH_URL: ${{ steps.workflow-data.outputs.branch_url }}
          RUN_ID: ${{ steps.workflow-data.outputs.run_id }}
          ACTION_RUN_URL: ${{ steps.workflow-data.outputs.action_run_url }}
          FIRST_FAIL_STEP: ${{ steps.workflow-data.outputs.first_fail_step }}
          FIRST_FAIL_MODULE: ${{ steps.workflow-data.outputs.first_fail_module }}
          FIRST_FAIL_ERROR: ${{ steps.workflow-data.outputs.first_fail_error }}
          HEAD_SHA: ${{ steps.workflow-data.outputs.head_sha }}
          HEAD_AUTHOR: ${{ steps.workflow-data.outputs.head_author }}
          HEAD_NAME: ${{ steps.workflow-data.outputs.head_name }}
          COMMIT_ID_URL: ${{ steps.workflow-data.outputs.commit_id_url }}
          TEST_CONCLUSION: ${{ steps.workflow-data.outputs.test_conclusion }}
          TEST_PASSED: ${{ steps.workflow-data.outputs.test_passed }}
          TEST_FAILED: ${{ steps.workflow-data.outputs.test_failed }}
          TEST_SKIPPED: ${{ steps.workflow-data.outputs.test_skipped }}
          TEST_ELAPSED: ${{ steps.workflow-data.outputs.test_elapsed }}
          TEST_RESULTS_URL: ${{ steps.workflow-data.outputs.test_results_url }}
        run: |
          # A PR report names the PR; a branch report falls back to the branch, as before
          subject="${PR_NUMBER:-$BRANCH}"
          subject_url="${PR_NUMBER_URL:-$BRANCH_URL}"
          subject_name="${PR_TITLE:-$BRANCH}"
          
          payload=$(jq -n -c \
            --arg text "Github Action ${STATUS} for ${REPORT_TYPE} #${subject}" \
            --arg header "${STATUS_ICON} Github Action ${STATUS} for ${REPORT_TYPE} #${subject}" \
            --arg run "*Action Run ID:* <${ACTION_RUN_URL} | ${RUN_ID}> \n*Failure Step:* ${FIRST_FAIL_STEP} \n*Failure Module:* ${FIRST_FAIL_MODULE}" \
            --arg failure "*Failure Message:* ${FIRST_FAIL_ERROR}" \
            --arg details "*${REPORT_TYPE} Details:* \nAuthor: ${PR_AUTHOR} \nName: <${subject_url} | ${subject_name}> \nNumber: #${subject} \nBranch: <${BRANCH_URL} | ${BRANCH}>" \
            --arg commit "*Commit Details:* \nID: <${COMMIT_ID_URL} | #${HEAD_SHA}> \nAuthor: ${HEAD_AUTHOR} \nName: ${HEAD_NAME}" \
            --arg tests_header "🧪 Test Results = ${TEST_CONCLUSION}" \
            --arg tests "*Passed:* ${TEST_PASSED} \n*Failed:* ${TEST_FAILED} \n*Skipped:* ${TEST_SKIPPED} \n*Elapsed Time:* ${TEST_ELAPSED}" \
            --arg tests_link "🔍 <${TEST_RESULTS_URL} | View Test Results>" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $run } },
                { type: "section", text: { type: "mrkdwn", text: $failure } },
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: $details } },
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: $commit } },
                { type: "divider" },
                { type: "header", text: { type: "plain_text", text: $tests_header, emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $tests } },
                { type: "section", text: { type: "mrkdwn", text: $tests_link } }
              ]
            }')
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"
          echo "payload=${payload}"
      # Send Slack notification
      - name: Post to Slack
        if: steps.workflow-data.outputs.has_json == 'true' && github.repository == 'dotcms/core' && ( steps.workflow-data.outputs.status == 'FAILURE' || ( github.event_name == 'workflow_call' && inputs.slack-only-on-failure == false ) )
        uses: ./.github/actions/core-cicd/notification/notify-slack
        with:
          channel-id: ${{ vars.SLACK_REPORT_CHANNEL }}
          payload: ${{ steps.prepare-slack-message.outputs.payload }}
          json: true
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
        # Check can be removed if we have resolved root cause
        # We cannot use a local github action for this as it is run before we checkout the repo
        # secrets.GITHUB_TOKEN is not available in composite workflows so it needs to be passed in.
      - name: Check API Rate Limit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token ${GITHUB_TOKEN}" https://api.github.com/rate_limit || true