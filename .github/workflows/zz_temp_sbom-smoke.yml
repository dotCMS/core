# TEMPORARY — smoke test for #37575 / PR #37655. DELETE BEFORE MERGE.
#
# Why this exists: the SBOM change could not be validated in CI any other way.
# cicd_comp_release-phase.yml is workflow_call-only and cannot be dispatched, and the one
# release workflow that can be dispatched runs a REAL release (tags, Docker Hub, Maven
# artifacts, GitHub Release). Validating an SBOM must not publish a release.
#
# This invokes the sbom-generator action itself — not a copy of its commands, so there is no
# risk of testing something other than what ships. That is safe because the action only
# generates and uploads a workflow artifact; every publishing step lives in the callers, not
# in the action.
#
# It scans an ALREADY-PUBLISHED image and creates nothing outside this run.
name: zz temp — SBOM smoke (delete before merge)

# push, not workflow_dispatch: a dispatchable workflow must exist on the DEFAULT branch to be
# launchable at all (the API 404s otherwise), and putting a temporary smoke test on main to
# test a branch is backwards. Scoped to this branch and to the paths it exercises, so it does
# not fire on unrelated pushes and disappears when the file is deleted before merge.
on:
  push:
    branches:
      - nicobytes/build-the-product-sbom-does-not-cover-core-webs
    paths:
      - '.github/actions/legacy-release/sbom-generator/**'
      - '.github/actions/core-cicd/sbom-merge/**'
      - '.github/workflows/zz_temp_sbom-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTCMS_VERSION: '25.07.10_lts_v15'

jobs:
  smoke:
    name: SBOM smoke (frontend=${{ matrix.expect_frontend }})
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both paths in one run: the normal one, and the degraded one a release line
        # without this change would take.
        expect_frontend: [true, false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        id: sbom
        uses: ./.github/actions/legacy-release/sbom-generator
        with:
          dotcms_version: ${{ env.DOTCMS_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Empty when exercising the degraded path: the action then skips the frontend
          # half, which is exactly what a release line without this change does.
          release_ref: ${{ matrix.expect_frontend && github.ref || '' }}

      - name: Verify the merged document
        shell: bash
        env:
          EXPECT_FRONTEND: ${{ matrix.expect_frontend }}
        run: |
          set -euo pipefail
          SBOM="core/sbom-dotcms-${DOTCMS_VERSION}.json"
          [ -f "$SBOM" ] || { echo "::error::no SBOM at $SBOM"; exit 1; }

          echo "::group::Components by ecosystem"
          jq -r '.components[] | .purl // "NO-PURL"' "$SBOM" \
            | sed -E 's|^pkg:([^/]+)/.*|\1|' | sort | uniq -c | sort -rn
          echo "::endgroup::"

          npm=$(jq '[.components[] | select((.purl // "") | startswith("pkg:npm/"))] | length' "$SBOM")
          maven=$(jq '[.components[] | select((.purl // "") | startswith("pkg:maven/"))] | length' "$SBOM")
          deb=$(jq '[.components[] | select((.purl // "") | startswith("pkg:deb/"))] | length' "$SBOM")
          covered=$(jq -r '.metadata.properties[]? | select(.name=="dotcms:sbom:frontend-covered") | .value' "$SBOM")

          refs=$(jq '[.components[]."bom-ref"] | length' "$SBOM")
          uniq=$(jq '[.components[]."bom-ref"] | unique | length' "$SBOM")

          echo "npm=$npm maven=$maven deb=$deb frontend-covered=$covered refs=$refs/$uniq"

          fail=0
          note() { echo "::error::$1"; fail=1; }

          # Unique bom-refs and non-zero Java/OS coverage hold on BOTH paths.
          [ "$refs" = "$uniq" ] || note "duplicate bom-refs: $refs entries, $uniq unique"
          [ "$maven" -gt 500 ] || note "maven=$maven — Java coverage regressed"
          [ "$deb" -gt 100 ] || note "deb=$deb — OS coverage regressed"

          if [ "$EXPECT_FRONTEND" = "true" ]; then
            [ "$covered" = "true" ] || note "frontend-covered=$covered, expected true"
            # The bar is deliberately well under the ~1,981 measured locally: the exact
            # figure is platform-dependent, and this asserts "the tree is there", not a
            # number that would need editing whenever a dependency moves.
            [ "$npm" -gt 1500 ] || note "npm=$npm — frontend tree missing or truncated"

            licensed=$(jq '[.components[] | select((.purl // "") | startswith("pkg:npm/")) | select(.licenses and (.licenses | length > 0))] | length' "$SBOM")
            pct=$(( licensed * 100 / npm ))
            echo "npm licensed: $licensed/$npm (${pct}%)"
            # SC-003. Measured 99.7% locally; a collapse here means the store was not
            # populated, which is the failure mode that looks correct in every count.
            [ "$pct" -ge 95 ] || note "licensed ${pct}% — below the 95% bar (store not populated?)"
          else
            [ "$covered" = "false" ] || note "frontend-covered=$covered, expected false on the degraded path"
            echo "degraded path: Java/OS inventory still published, document marked uncovered"
          fi

          exit $fail

      - name: Upload for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-sbom-${{ env.DOTCMS_VERSION }}-frontend-${{ matrix.expect_frontend }}
          path: core/sbom-dotcms-*.json
          if-no-files-found: warn
