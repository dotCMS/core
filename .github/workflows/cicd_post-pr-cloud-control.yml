# Keep the Cloud Control token in default-branch code, not the PR's reusable workflow.
# The manifest is untrusted data; verify the current PR before using the token.
name: 'Start PR Cloud Environment'

on:
  workflow_run:
    workflows: ['-1 PR Check', 'Publish PR Test Image']
    types: [completed]
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    timeout-minutes: 5
    steps:
      - name: Find image publication manifest
        id: artifact
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.find(a => a.name === 'pr-cloud-control' && !a.expired);
            if (artifact) core.setOutput('id', artifact.id);

      - name: Download image publication manifest
        if: steps.artifact.outputs.id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pr-cloud-control
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      # Tested offline by tests/pr-cloud-control.test.cjs; no checkout or PR code runs here.
      - name: Create, start or decommission PR environment
        id: deploy
        if: steps.artifact.outputs.id != '' || github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLOUD_CONTROL_DOTCMS_MACHINE_TOKEN: ${{ secrets.CLOUD_CONTROL_DOTCMS_MACHINE_TOKEN }}
        with:
          script: |
            const teardown = context.eventName === 'pull_request_target';
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            let pr, manifest;
            if (teardown) {
              pr = context.payload.pull_request;
              if (!pr.merged || pr.state !== 'closed' || pr.head.repo?.full_name !== repository) return;
            } else {
              const fs = require('node:fs');
              manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pr-cloud-control/pr.json`, 'utf8'));
              if (!Number.isSafeInteger(manifest.pr) || manifest.pr <= 0 ||
                  typeof manifest.sha !== 'string' || !/^[a-f0-9]{40}$/.test(manifest.sha)) {
                throw new Error('Invalid PR deployment manifest');
              }
              ({ data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: manifest.pr }));
              const run = context.payload.workflow_run;
              if (pr.state !== 'open' || pr.head.repo?.full_name !== repository ||
                  pr.head.sha !== manifest.sha || !pr.labels.some(label => label.name === 'PR: docker image') ||
                  (run.event === 'pull_request' && (run.head_sha !== manifest.sha || run.head_branch !== pr.head.ref))) {
                core.info('Skipping closed, unlabeled, fork or superseded PR publication.');
                return;
              }
            }

            // Match the publisher's tag normalization; environment keys additionally need DNS-label characters.
            const branch = pr.head.ref.replace(/[A-Z]/g, c => c.toLowerCase());
            const tagBranch = branch.replace(/[^a-z0-9._-]/g, '-').replace(/-+/g, '-')
              .replace(/^[-.]+|[-.]+$/g, '').slice(0, 100);
            const image = `dotcms/dotcms-test:pr-${pr.number}-${tagBranch}`;
            const slug = branch.replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, '');
            // Reserve 'dot-dotpr-' inside PostgreSQL's 63-character identifier limit.
            const envKey = `${pr.number}${slug ? '-' + slug : ''}`.slice(0, 53).replace(/-+$/, '');
            if (!teardown) {
              // The artifact is only a hint; independently verify that the expected image was published.
              const tag = image.slice('dotcms/dotcms-test:'.length);
              const publishedDigest = async tag => {
                const response = await fetch(`https://hub.docker.com/v2/repositories/dotcms/dotcms-test/tags/${tag}`, {
                  redirect: 'error', signal: AbortSignal.timeout(30000),
                });
                if (!response.ok) throw new Error(`Image publication verification failed (HTTP ${response.status})`);
                const { digest } = await response.json();
                if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('Invalid published image digest');
                return digest;
              };
              const immutableDigest = await publishedDigest(`${tag}_${manifest.sha.slice(0, 7)}`);
              if (await publishedDigest(tag) !== immutableDigest) {
                throw new Error('Mutable image does not match the published PR commit image');
              }
            }
            const token = process.env.CLOUD_CONTROL_DOTCMS_MACHINE_TOKEN;
            if (!token) throw new Error('CLOUD_CONTROL_DOTCMS_MACHINE_TOKEN is not configured');
            const request = (path, method = 'GET', body) => fetch(`https://cloud.dotcms.dev${path}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            const detailPath = `/api/envs/dotpr/detail?env_key=${encodeURIComponent(envKey)}`;
            const report = async action => {
              core.info(`${action}: dotpr/${envKey} (${image})`);
              await core.summary.addRaw(`### PR Cloud Control\n${action}: \`dotpr/${envKey}\`\n\nImage: \`${image}\`\n`).write();
            };
            // Missing envs deliberately return 403 on detail routes for scoped tokens; use the filtered list.
            const lookup = async () => {
              const response = await request(`/api/envs?org_key=dotpr&name=${encodeURIComponent(envKey)}&scope=all`);
              if (!response.ok) throw new Error(`Cloud Control lookup failed (HTTP ${response.status})`);
              return (await response.json()).find(env => env.org_key === 'dotpr' && env.env_key === envKey);
            };
            const decommission = async () => {
              const env = await lookup();
              if (!env) return report('Environment already absent; unchanged');
              if (env.image !== image) throw new Error('Existing environment image does not match the PR mutable tag');
              const alreadyDeleting = env => env.pending_delete || ['decommissioning', 'decommissioned'].includes(env.deploy_status);
              if (alreadyDeleting(env)) return report('Already decommissioning or decommissioned; unchanged');
              const response = await request(`/api/envs/dotpr/decommission?env_key=${encodeURIComponent(envKey)}`, 'PATCH');
              if (response.status === 404) return report('Environment already absent; unchanged');
              if (response.status === 409) {
                const current = await lookup();
                if (!current || alreadyDeleting(current)) return report('Already decommissioning or decommissioned; unchanged');
              }
              if (!response.ok) throw new Error(`Cloud Control decommission failed (HTTP ${response.status})`);
              await report('Decommission queued');
            };
            if (teardown) {
              await decommission();
              return;
            }
            const complete = async action => {
              await report(action);
              // Merge cleanup may have run before this in-flight create/start finished.
              const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              if (current.merged) await decommission();
            };
            let env = await lookup();
            if (!env) {
              const created = await request('/api/provision', 'POST', {
                wizard: true, org: { org_key: 'dotpr' }, env: { env_key: envKey, image, replicas: 1 },
              });
              if (created.status === 201) {
                await complete('Provisioning queued');
                return;
              }
              if (created.status !== 409) throw new Error(`Cloud Control provision failed (HTTP ${created.status})`);
              // Another label/commit run may have created it while we were looking it up.
              env = await lookup();
              if (!env) throw new Error('Cloud Control provision rejected (HTTP 409); no matching environment found');
            }
            if (env.image !== image) throw new Error('Existing environment image does not match the PR mutable tag');
            if (env.pending_delete || ['failed', 'decommissioning', 'decommissioned', 'stopping'].includes(env.deploy_status)) {
              throw new Error('Cannot start an environment that is failed, stopping or being deleted');
            }
            if (env.replicas > 0) {
              // The reconciler picks up mutable-tag changes; do not restart a running environment.
              await complete('Already running or starting; unchanged');
              return;
            }
            if (env.deploy_status !== 'stopped') throw new Error('Cannot start an environment in its current state');
            const started = await request(detailPath, 'PATCH', { replicas: 1 });
            if (!started.ok) throw new Error(`Cloud Control start failed (HTTP ${started.status})`);
            await complete('Start queued');
