# Test Phase Workflow
#
# This reusable workflow is responsible for running various types of tests on the codebase.
# It includes JVM unit tests, CLI tests, frontend tests, integration tests, and Postman tests.
#
# Key features:
# - Configurable test execution based on input parameters
# - Parallel execution of different test suites  
# - Matrix strategy for running multiple test suites concurrently
# - Reusable Maven job action for consistent test environment setup
# - Artifact reuse from previous workflow runs
# - DRY configuration using external YAML config

name: Test Phase

on:
  workflow_call:
    inputs:
      run-all-tests:
        type: boolean
        default: false
      artifact-run-id:
        default: ${{ github.run_id }}
        type: string
      jvm_unit_test:
        required: false
        type: boolean
        default: false
      cli:
        required: false
        type: boolean
        default: false
      frontend:
        required: false
        type: boolean
        default: false
      postman:
        required: false
        type: boolean
        default: false
      karate:
        required: false
        type: boolean
        default: false
      integration:
        required: false
        type: boolean
        default: false
      opensearch_phase:
        description: >-
          ES->OS migration phase(s) to run the integration suites under. Empty, 'none' or '0'
          (default) keeps the existing single-store/phase-0 behavior. Accepts a single phase
          ('2'), a comma list ('1,2,3') or the alias 'all' (= 1,2,3): every integration
          MainSuite/Junit5 matrix entry is fanned out once per phase with -Dopensearch.phase=<N>
          appended (activating the opensearch-phase-suite Maven profile: two clusters +
          DOT_FEATURE_FLAG_OPEN_SEARCH_PHASE), name/stage_name suffixed per phase. The OpenSearch
          Upgrade Suite is left untouched.
        required: false
        type: string
        default: ''
      e2e:
        required: false
        type: boolean
        default: false
      java-version:
        description: 'Override Java version (SDKMAN format, e.g., 25.0.1-open)'
        required: false
        type: string
        default: ''
      maven-compiler-release:
        description: 'Override Maven compiler release version (e.g., 21). Preferred over source/target.'
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: 'Override artifact suffix (e.g., -java25, -java25.0.1-ms). If not set, derived from java-version major.'
        required: false
        type: string
        default: ''
    secrets:
      DOTCMS_LICENSE:
        required: true

env:
  ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id || github.run_id }}

jobs:
  # Generate test matrix from external configuration
  setup-matrix:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      has-tests: ${{ steps.generate-matrix.outputs.has-tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow checkout: this job only reads .github/test-matrix.yml from HEAD.
          # fetch-depth: 0 pulled every branch ref (~2k+ branches, ~1.1 GB pack).
          fetch-depth: 1
        
      - name: Parse test configuration
        id: parse-config
        uses: mikefarah/yq@v4.47.1
        with:
          cmd: yq -o=json .github/test-matrix.yml > config.json

      - name: Generate test matrix
        id: generate-matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          # Passed via env (not interpolated into the script) to avoid script injection.
          OPENSEARCH_PHASE: ${{ inputs.opensearch_phase }}
        with:
          script: |
            const fs = require('fs');
            
            // Read the parsed JSON configuration
            const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            
            // Build matrix from configuration
            const matrix = [];
            const inputs = {
              'run-all-tests': ${{ inputs.run-all-tests }},
              'jvm_unit_test': ${{ inputs.jvm_unit_test }},
              'cli': ${{ inputs.cli }},
              'frontend': ${{ inputs.frontend }}, 
              'postman': ${{ inputs.postman }},
              'karate': ${{ inputs.karate }},
              'integration': ${{ inputs.integration }},
              'e2e': ${{ inputs.e2e }}
            };

            // ES->OS migration phases to sweep. The input accepts a single phase ('2'),
            // a comma list ('1,2,3'), or the alias 'all' (= 1,2,3). Anything else
            // (empty, 'none', '0') yields an empty list => phase-0/default behavior.
            const rawPhase = (process.env.OPENSEARCH_PHASE || '').toLowerCase();
            const phaseList = [...new Set(
              (rawPhase === 'all' ? '1,2,3' : rawPhase)
                .split(',').map(s => s.trim()).filter(s => /^[1-3]$/.test(s))
            )].sort();
            if (phaseList.length) {
              console.log(`OpenSearch phase sweep: [${phaseList.join(', ')}]`);
            }

            // Process each test type
            for (const [testType, testConfig] of Object.entries(config.test_types)) {
              // Check if explicitly disabled (false) - this overrides run-all-tests
              const isExplicitlyDisabled = inputs[testConfig.condition_input] === false;
              const shouldRun = !isExplicitlyDisabled && (inputs['run-all-tests'] || inputs[testConfig.condition_input]);
              
              if (!shouldRun) {
                console.log(`Skipping ${testType} tests - not enabled`);
                continue;
              }
              
              // Process each suite in this test type
              for (const suite of testConfig.suites) {
                const testEntry = {
                  // Inherit global defaults
                  ...config.defaults,
                  // Inherit test type defaults
                  ...testConfig.defaults,
                  // Apply suite-specific config
                  ...suite,
                  // Add metadata
                  test_type: testType,
                  condition_input: testConfig.condition_input
                };
                
                // Build Maven args
                if (testEntry.test_class) {
                  // For integration/karate tests with test_class
                  testEntry.maven_args = `${testEntry.base_maven_args} -Dit.test=${testEntry.test_class}`;
                } else if (testEntry.collection) {
                  // For postman tests with collection
                  testEntry.maven_args = `${testEntry.base_maven_args} -Dpostman.collections=${testEntry.collection}`;
                  testEntry.stage_name = `Postman ${testEntry.collection}`;
                } else if (testEntry.maven_args && testEntry.base_maven_args) {
                  // Combine base_maven_args first, then suite-specific maven_args
                  testEntry.maven_args = `${testEntry.base_maven_args} ${testEntry.maven_args}`;
                } else if (!testEntry.maven_args && testEntry.base_maven_args) {
                  // Use base_maven_args if no specific maven_args
                  testEntry.maven_args = testEntry.base_maven_args;
                }

                // Clean up temporary fields
                delete testEntry.base_maven_args;
                delete testEntry.test_class;
                delete testEntry.collection;

                // ES->OS migration phase fan-out: run the integration battery under each
                // requested phase. Only for integration suites, and never for the OpenSearch
                // Upgrade Suite (it already drives OS via -Dopensearch.upgrade.test — activating
                // -Dopensearch.phase too would collide the two Maven profiles). The mere presence
                // of -Dopensearch.phase activates the opensearch-phase-suite profile (see
                // dotcms-integration/pom.xml). name/stage_name are suffixed per phase so job
                // labels and the resulting build-reports-<stage_name> artifacts stay unique.
                const phaseable = testEntry.test_type === 'integration'
                  && !testEntry.maven_args.includes('opensearch.upgrade.test');
                if (phaseList.length && phaseable) {
                  for (const p of phaseList) {
                    matrix.push({
                      ...testEntry,
                      maven_args: `${testEntry.maven_args} -Dopensearch.phase=${p}`,
                      name: `${testEntry.name} [OS Phase ${p}]`,
                      stage_name: `${testEntry.stage_name} - os-phase-${p}`,
                    });
                  }
                } else {
                  matrix.push(testEntry);
                }
              }
            }
            
            console.log(`Generated matrix with ${matrix.length} test configurations`);
            
            // Output the matrix
            core.setOutput('matrix', JSON.stringify({ include: matrix }));
            core.setOutput('has-tests', matrix.length > 0 ? 'true' : 'false');

  # Run all tests using the generated matrix
  test-matrix:
    name: ${{ matrix.name }}
    needs: setup-matrix
    if: needs.setup-matrix.outputs.has-tests == 'true'
    runs-on: ubuntu-${{ vars.UBUNTU_RUNNER_VERSION || '24.04' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      MAVEN_OPTS: ${{ matrix.maven_opts }}
    strategy:
      # Keep the current fast-fail for normal runs, but let ANY phased run (single phase,
      # a comma-list subset like '1,2', or 'all') run every suite/phase to completion so
      # failures are attributable per phase. Derived from "phase off" rather than an
      # exact-match list so comma-list subsets are covered too.
      #
      # The label escape hatch exists because fail-fast destroys evidence: one failing
      # suite cancels the other ~24, and a cancelled job is indistinguishable from a
      # failed one at a glance. When you are chasing a flake, or want to know whether a
      # change broke one suite or twenty, label the PR "CI : No Fail Fast" and every
      # suite runs to completion. Costs runner time, so it is opt-in per PR.
      # On merge_group there is no pull_request in the event, contains() is false, and
      # fast-fail stays on -- the queue should still bail early.
      fail-fast: >-
        ${{ (inputs.opensearch_phase == '' || inputs.opensearch_phase == 'none' || inputs.opensearch_phase == '0')
            && !contains(github.event.pull_request.labels.*.name, 'CI : No Fail Fast') }}
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:          
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow checkout: test jobs run Maven suites against the checked-out
          # snapshot only — no git history is read anywhere in this job or in the
          # maven-job action (buildnumber-maven-plugin reads HEAD, which works on
          # a shallow clone). fetch-depth: 0 pulled every branch ref (~2k+
          # branches, ~1.1 GB pack) at ~19-20 min per matrix job.
          fetch-depth: 1

      # Frontend Unit Tests runs `nx affected` (lint-test, -Pvalidate) which diffs
      # against origin/main (core-web/pom.xml git.origin.branch). The shallow
      # checkout above has no origin/main ref, so fetch just that ref, shallow.
      #
      # The strict-gate (#37536) additionally needs a base it can diff against
      # HONESTLY. Both sides here are depth-1, so `git merge-base` cannot traverse
      # and the harness falls back to comparing against the TIP of origin/main --
      # which attributes every commit main moved ahead to the pull request. That is
      # survivable for `nx affected` (over-including projects for lint is harmless
      # on a lint-clean main) but not for a blocking strict check, because main is
      # deliberately NOT strict-clean while #37198 is in flight: authors would be
      # rejected for violations they never wrote.
      #
      # So hand the gate the divergence point itself. That point is NOT
      # github.event.pull_request.base.sha: GitHub pins that field when the pull
      # request is opened and never moves it as the base branch advances, so on a
      # long-lived branch it is hundreds of commits stale -- and diffing a stale base
      # against this checkout blames the author for every one of them.
      #
      # It is the checkout's own FIRST PARENT. Both events check out a merge commit
      # (`refs/pull/N/merge` on pull_request, the queue branch head on merge_group)
      # whose first parent is the current base tip and whose second is the branch, so
      # `parent1..HEAD` is precisely the pull request's contribution. Deepening by one
      # is all it takes to see it, and it needs no knowledge of the base branch's name,
      # so a pull request targeting something other than `main` compares against its
      # own base. Requiring two parents keeps this honest: if the checkout is ever
      # changed to the branch head, HEAD^1 is the previous COMMIT, not the base, and
      # the gate would silently narrow to the last commit instead.
      - name: Fetch base refs for Nx affected and the strict gate
        if: contains(matrix.maven_args, '-Pvalidate')
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          # Not fatal: if the parent cannot be resolved the gate still runs against
          # origin/main and warns, which is the behaviour before this step.
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
          # `rev-list --parents` prints "<commit> <parent>...", and a shallow boundary
          # prints no parents at all -- so the second parent being present is also the
          # proof that the deepen above landed.
          PARENTS=$(git rev-list --parents -n 1 HEAD)
          FIRST_PARENT=$(echo "$PARENTS" | awk '{print $2}')
          SECOND_PARENT=$(echo "$PARENTS" | awk '{print $3}')
          if [ -n "$SECOND_PARENT" ]; then
            echo "STRICT_GATE_BASE=$FIRST_PARENT" >> "$GITHUB_ENV"
            echo "strict-gate base: $FIRST_PARENT (first parent of $GITHUB_SHA)"
          else
            echo "::warning::could not resolve the first parent of $GITHUB_SHA; strict-gate will fall back to origin/main"
          fi

      # The libvips image engine (IMAGE_API_USE_LIBVIPS) is exercised by VipsParityTest.
      # Install native libvips on the JVM unit-test runner so those tests run instead of
      # self-skipping. The library is extracted from the published dotcms/java-base image
      # rather than installed from Ubuntu, because libvips is now built from source there
      # with the ImageMagick and OpenEXR delegates removed (#36546) - installing Ubuntu's
      # libvips42 would make the parity tests exercise a different native configuration
      # than the one we ship.
      # Bounded so a wedged registry or mirror can't burn the job timeout (#37118).
      - name: Install native libvips (image engine parity tests)
        if: matrix.test_type == 'jvm'
        timeout-minutes: 15
        env:
          # Passed through env rather than interpolated into the script body: `${{ }}` is
          # substituted before the shell parses the line, so embedding it in `run:` is a
          # script-injection vector even when quoted.
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
        run: |
          set -euo pipefail
          # dotcms/java-base is tagged by the SDKMAN java version with '+' rewritten to '-' (docker
          # tags cannot contain '+'); see cicd_manual_build-java-base.yml.
          JAVA_VERSION="${INPUT_JAVA_VERSION}"
          if [ -z "$JAVA_VERSION" ]; then
            JAVA_VERSION=$(awk -F '=' '/^java=/ {print $2}' .sdkmanrc)
          fi
          JAVA_BASE_TAG="${JAVA_VERSION//+/-}"
          echo "Extracting libvips from dotcms/java-base:${JAVA_BASE_TAG}"

          docker pull "dotcms/java-base:${JAVA_BASE_TAG}"
          docker inspect --format='java-base digest: {{index .RepoDigests 0}}' "dotcms/java-base:${JAVA_BASE_TAG}" || true

          # java-base is scratch-based with no entrypoint, so give docker an explicit command to
          # create a stopped container we can copy out of.
          container_id=$(docker create "dotcms/java-base:${JAVA_BASE_TAG}" /bin/true)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          sudo docker cp "${container_id}:/usr/local/libvips" /usr/local/libvips
          sudo docker cp "${container_id}:/etc/ld.so.conf.d/libvips.conf" /etc/ld.so.conf.d/libvips.conf

          # Install exactly the runtime closure recorded at build time: the ELF dependencies of the
          # library, the CLI and every dynamic module, plus the dlopened libheif codec plugins.
          sudo apt-get update
          sudo xargs -r apt-get install -y --no-install-recommends \
            < /usr/local/libvips/share/runtime-packages.txt
          sudo ldconfig

          # Fail loudly when the native engine is unusable rather than letting VipsParityTest
          # self-skip into a green build. This runs the verifier from the checkout rather than the
          # copy embedded in the image, so a change to the verifier does not require republishing
          # java-base first. Scope=prefix because this runner legitimately has ImageMagick
          # preinstalled, so only the extracted prefix's own state can be asserted here - the full
          # image scope (host carries none of the forbidden packages) is asserted by the image
          # builds themselves.
          sudo env VIPS_VERIFY_SCOPE=prefix bash docker/java-base/verify-libvips.sh

          echo "LD_LIBRARY_PATH=/usr/local/libvips/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "/usr/local/libvips/bin" >> "$GITHUB_PATH"
          # Make the parity tests assert native capability instead of skipping it.
          echo "DOT_TEST_REQUIRE_LIBVIPS=true" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.name }}
        uses: ./.github/actions/core-cicd/maven-job
        with:
          stage-name: ${{ matrix.stage_name }}
          maven-args: ${{ matrix.maven_args }}
          generates-test-results: ${{ matrix.generates_test_results }}
          cleanup-runner: ${{ matrix.cleanup_runner }}
          dotcms-license: ${{ matrix.needs_license == true && secrets.DOTCMS_LICENSE || '' }}
          requires-node: ${{ matrix.needs_node == true }}
          needs-docker-image: ${{ matrix.needs_docker == true }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-from: ${{ env.ARTIFACT_RUN_ID }}
          java-version: ${{ inputs.java-version }}
          maven-compiler-release: ${{ inputs.maven-compiler-release }}
          artifact-suffix: ${{ inputs.artifact-suffix }}
          docker-io-username: ${{ secrets.DOCKER_USERNAME }}
          docker-io-token: ${{ secrets.DOCKER_TOKEN }}
