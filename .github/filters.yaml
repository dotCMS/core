full_build_test: &full_build_test
  - '.sdkmanrc'
  - 'core-web/.nvmrc'
  - '.nvmrc'

backend: &backend
  # CI files that run or configure the PR / merge-queue test suites, listed one by one.
  # Release, deploy, labeling and notification workflows are left out on purpose: changing
  # them must not trigger the full test suite. If a workflow or action is added to the test
  # pipeline (called from the initialize/build/test/finalize phases), list it here, or
  # changes to it will run no tests.
  - '.github/workflows/cicd_1-pr.yml'
  - '.github/workflows/cicd_2-merge-queue.yml'
  - '.github/workflows/cicd_comp_initialize-phase.yml'
  - '.github/workflows/cicd_comp_build-phase.yml'
  - '.github/workflows/cicd_comp_test-phase.yml'
  - '.github/workflows/cicd_comp_finalize-phase.yml'
  - '.github/actions/core-cicd/maven-job/**'
  - '.github/actions/core-cicd/build-cache-remote/**'
  - '.github/actions/core-cicd/prepare-runner/**'
  - '.github/actions/core-cicd/setup-java/**'
  - '.github/actions/core-cicd/setup-pnpm/**'
  - '.github/actions/core-cicd/cleanup-runner/**'
  - '.github/test-matrix.yml'
  - '.github/filters.yaml'
  - 'bom/**'
  - 'build-parent/**'
  - 'core-web/pom.xml'
  - 'dotCMS/src/main/webapp/html/**/!(*.{css,js})'
  - 'dotcms-postman/**'
  - 'test-karate/**'
  - 'e2e/**'
  - 'dotCMS/src/main/webapp/WEB-INF/messages/**/!(Language*.properties)'
  # Exclude html/ and WEB-INF/messages/ from backend triggering via per-segment
  # negation (picomatch !() only negates within a single path segment, so a
  # multi-segment !() followed by ** does NOT exclude a directory — see lines 78-89).
  # html/ is re-included for non-css/js above; messages/ for non-Language* above.
  - 'dotCMS/*'
  - 'dotCMS/!(src)/**'
  - 'dotCMS/src/*'
  - 'dotCMS/src/!(main)/**'
  - 'dotCMS/src/main/*'
  - 'dotCMS/src/main/!(webapp)/**'
  - 'dotCMS/src/main/webapp/*'
  - 'dotCMS/src/main/webapp/!(html|WEB-INF)/**'
  - 'dotCMS/src/main/webapp/WEB-INF/*'
  - 'dotCMS/src/main/webapp/WEB-INF/!(messages)/**'
  - 'dotcms-integration/**'
  - 'independent-projects/**'
  - 'maven-plugins/**'
  - 'osgi-base/**'
  - 'parent/**'
  - 'plugins-core/**'
  - 'pom.xml'
  - 'reports/**'
  - *full_build_test

frontend: &frontend
  - 'core-web/**'
  - 'dotCMS/src/main/webapp/html/**/*.{css,js}'
  - *full_build_test

cli: &cli
  - 'tools/dotcms-cli/**'

sdk_libs:
  - 'core-web/libs/sdk/**'

examples:
  - 'examples/**'

# The package.json shape guardrail's own source. Deliberately NOT folded into sdk_libs:
# that filter also gates the trunk npm publish job (cicd_3-trunk.yml), and touching the
# validator must not trigger an SDK release. Without this key the job that runs the
# validator is not triggered by changes to the validator — you could break the guardrail
# and keep a green build.
sdk_package_shapes:
  - '.github/scripts/validate-sdk-package-shapes/**'
  - '.github/scripts/resolve-sdk-pin/**'
  # resolve-sdk-pin's only caller, and the owner of the CLI's argument contract. Without it,
  # changing a flag in the workflow does not run the tests that cover the module it invokes.
  - '.github/workflows/cicd_comp_release-prepare-phase.yml'

# PR area labeling filters
# These are separate from test-triggering filters to avoid false positives
# (e.g., workflow changes should trigger backend tests but shouldn't label PR as "Area : Backend")
area_backend:
  - 'dotCMS/src/main/webapp/WEB-INF/messages/**/!(Language*.properties)'
  # Exclude WEB-INF/messages/Language* from the Area:Backend label via per-segment
  # negation (see backend filter above and the note at lines 78-89). html/ is NOT
  # excluded here — area_backend intentionally labels html changes as backend.
  - 'dotCMS/*'
  - 'dotCMS/!(src)/**'
  - 'dotCMS/src/*'
  - 'dotCMS/src/!(main)/**'
  - 'dotCMS/src/main/*'
  - 'dotCMS/src/main/!(webapp)/**'
  - 'dotCMS/src/main/webapp/*'
  - 'dotCMS/src/main/webapp/!(WEB-INF)/**'
  - 'dotCMS/src/main/webapp/WEB-INF/*'
  - 'dotCMS/src/main/webapp/WEB-INF/!(messages)/**'
  - 'dotcms-integration/**'
  - 'dotcms-postman/**'
  - 'test-karate/**'
  - 'bom/**'
  - 'build-parent/**'
  - 'parent/**'
  - 'osgi-base/**'
  - 'plugins-core/**'
  - 'maven-plugins/**'
  - 'independent-projects/**'
  - 'reports/**'
  - 'pom.xml'

area_frontend:
  - 'core-web/**'
  - 'dotCMS/src/main/webapp/html/**/*.{css,js}'

area_cli:
  - 'tools/dotcms-cli/**'

area_sdk:
  - 'core-web/libs/sdk/**'

area_documentation:
  - 'docs/**'
  - '*.md'
  - 'CLAUDE.md'
  - '.github/**/*.md'
  - 'core-web/*.md'
  - 'dotCMS/*.md'
  - 'tools/**/*.md'

# IMPORTANT: Negation patterns (like '!pattern') do NOT work correctly with dorny/paths-filter
#
# Due to OR logic in dorny/paths-filter, separate negation patterns match ANY file not
# matching the negation (e.g., '!.github/**/*.md' matches all files in core-web/, dotCMS/).
# This is a known bug: https://github.com/dorny/paths-filter/issues/97
#
# Solution Options:
# 1. Use explicit positive patterns (simple, clear) - PREFERRED for most cases
#    Example: list each file/directory explicitly
# 2. Use picomatch inline negation !(pattern) - ONLY when explicit listing is impractical
#    Example (already used in backend filter): dotCMS/src/main/webapp/html/**/!(*.{css,js})
#    This matches all files in the path EXCEPT .css and .js files
#
# For area_cicd, we use option 1: wildcards for directories with many files (workflows/,
# actions/) and explicit paths for individual config files.
#
# This filter matches CI/CD code and configuration that affects build/test/deploy:
# - GitHub Actions workflows (all files in workflows/)
# - Custom GitHub Actions (all files in actions/)
# - CI/CD configuration files (filters, labels, test matrix)
#
# Does NOT match (intentionally excluded by not listing):
# - ISSUE_TEMPLATE/ and PULL_REQUEST_TEMPLATE/ (non-code metadata)
# - data/ directory (reference data like slack-mappings.json)
# - instructions/ directory (documentation)
# - *.md files (documentation)
# - copilot-instructions.md (AI tool configuration)
area_cicd:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/filters.yaml'
  - '.github/area-labels.yml'
  - '.github/test-matrix.yml'

jvm_unit_test:
  - *backend
  - *cli

build:
  - *backend
  - *cli
  - *frontend
