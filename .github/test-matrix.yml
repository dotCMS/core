# Test Matrix Configuration
# This file defines all test configurations for the CI/CD pipeline in a DRY, maintainable way.
# 
# Structure:
# - defaults: Global settings applied to all tests
# - test_types: Each test type with its own defaults and suites

defaults:
  timeout_minutes: 240
  runner: ubuntu-latest
  maven_opts: "-Xmx2048m"
  requires_checkout: true
  generates_test_results: true
  cleanup_runner: true

test_types:
  # === SIMPLE TESTS (single suite) ===
  
  jvm:
    condition_input: jvm_unit_test
    defaults:
      needs_license: false
      needs_docker: false
      needs_node: false
    suites:
      - name: "JVM Unit Tests"
        maven_args: "test -Dprod -pl :dotcms-core"
        stage_name: "JVM Tests"

  cli:
    condition_input: cli
    defaults:
      needs_license: true
      needs_docker: true
      needs_node: false
    suites:
      - name: "CLI Tests"
        maven_args: "verify -pl :dotcms-api-data-model,:dotcms-cli"
        stage_name: "CLI Tests"

  frontend:
    condition_input: frontend
    defaults:
      needs_license: false
      needs_docker: false
      needs_node: true
    suites:
      - name: "Frontend Unit Tests"
        maven_args: "test -pl :dotcms-core-web"
        stage_name: "Frontend Tests"

  # === MULTI-SUITE TESTS ===
  
  integration:
    condition_input: integration
    defaults:
      needs_license: true
      needs_docker: false
      needs_node: false
      # Base command for all integration tests
      base_maven_args: >-
        verify -Dit.test.forkcount=1 -pl :dotcms-integration
        -Dcoreit.test.skip=false
    suites:
      # Shards are balanced on measured per-class test time (~18.4m each), not on
      # class count - class count is a poor proxy (one shard was 298 classes/31m,
      # another 52 classes/14m). Rebalance with the same measurement when shard
      # times drift apart; see scripts referenced in the PR that introduced this.
      - name: "Integration Tests - MainSuite 1a"
        test_class: "MainSuite1a"
        stage_name: "IT Tests MainSuite 1a"
      - name: "Integration Tests - MainSuite 1b"
        test_class: "MainSuite1b"
        stage_name: "IT Tests MainSuite 1b"
      - name: "Integration Tests - MainSuite 2a"
        test_class: "MainSuite2a"
        stage_name: "IT Tests MainSuite 2a"
      - name: "Integration Tests - MainSuite 2b"
        test_class: "MainSuite2b"
        stage_name: "IT Tests MainSuite 2b"
      - name: "Integration Tests - MainSuite 3a"
        test_class: "MainSuite3a"
        stage_name: "IT Tests MainSuite 3a"
      - name: "Integration Tests - MainSuite 3b"
        test_class: "MainSuite3b"
        stage_name: "IT Tests MainSuite 3b"
      - name: "Integration Tests - MainSuite 4a"
        test_class: "MainSuite4a"
        stage_name: "IT Tests MainSuite 4a"
      - name: "Integration Tests - Junit5 Suite 1"
        test_class: "Junit5Suite1"
        stage_name: "IT Tests Junit5Suite1"
      - name: "Integration Tests - OpenSearch Upgrade Suite"
        test_class: "OpenSearchUpgradeSuite"
        stage_name: "IT Tests OpenSearch Upgrade Suite"
        # Override base_maven_args to activate the opensearch-upgrade Maven profile,
        # which starts the opensearch-upgrade Docker container and restricts Failsafe
        # to only run OpenSearchUpgradeSuite (see dotcms-integration/pom.xml:opensearch-upgrade)
        base_maven_args: >-
          verify -Dit.test.forkcount=1 -pl :dotcms-integration
          -Dcoreit.test.skip=false
          -Dopensearch.upgrade.test=true

  postman:
    condition_input: postman
    defaults:
      needs_license: true
      needs_docker: true
      needs_node: true
      # Base command for all Postman tests
      base_maven_args: >-
        verify -pl :dotcms-postman 
        -Dpostman.test.skip=false
    # Groups are balanced on measured newman time (~16.4m each) and defined in
    # dotcms-postman/config.json. Every shard pays ~9.4m of fixed cost (artifact
    # download, docker load, dotCMS boot), so a handful of tiny groups is pure
    # waste - keep groups few and evenly sized rather than thematically pure.
    #
    # `default` is special: index.js computes it as every collection on disk NOT
    # listed in config.json, so it is the safety net that runs newly added
    # collections. It must always have a shard here.
    suites:
      - name: "Postman Tests - Content"
        collection: "content"
      - name: "Postman Tests - ContentType"
        collection: "contenttype"
      # GraphQLTests is one 25.6m collection - too big for a single shard and the
      # binding constraint on the whole Postman tail. config.json splits it by
      # top-level folder instead of splitting the 518KB collection file.
      - name: "Postman Tests - GraphQL A"
        collection: "graphql-a"
      - name: "Postman Tests - GraphQL B"
        collection: "graphql-b"
      - name: "Postman Tests - Pages"
        collection: "pages"
      - name: "Postman Tests - Site"
        collection: "site"
      - name: "Postman Tests - Template"
        collection: "template"
      - name: "Postman Tests - Workflow"
        collection: "workflow"
      - name: "Postman Tests - Default"
        collection: "default"

  karate:
    condition_input: karate
    defaults:
      needs_license: true
      needs_docker: true
      needs_node: true
      base_maven_args: >-
        verify -pl :dotcms-test-karate 
        -Dkarate.test.skip=false
    suites:
      - name: "Karate Tests - Default"
        test_class: "KarateCITests#defaults"
        stage_name: "Karate Default"

  e2e:
    condition_input: e2e
    defaults:
      needs_license: true
      needs_docker: true
      needs_node: true
      base_maven_args: "verify -De2e.test.skip=false"
    suites:
      - name: "E2E Tests - Nx Playwright 1 of 3"
        maven_args: "-De2e.test.env=ci -De2e.playwright.args=--shard=1/3 -pl :dotcms-ui-e2e"
        stage_name: "E2E Nx Playwright 1 of 3"
      - name: "E2E Tests - Nx Playwright 2 of 3"
        maven_args: "-De2e.test.env=ci -De2e.playwright.args=--shard=2/3 -pl :dotcms-ui-e2e"
        stage_name: "E2E Nx Playwright 2 of 3"
      - name: "E2E Tests - Nx Playwright 3 of 3"
        maven_args: "-De2e.test.env=ci -De2e.playwright.args=--shard=3/3 -pl :dotcms-ui-e2e"
        stage_name: "E2E Nx Playwright 3 of 3"